            --m3-transition-slow: 0.45s cubic-bezier(0.2, 0, 0, 1);

        /* ============================================================
           BASE
           ============================================================ */
        html {
            font-family: var(--font);
            background: var(--md-sys-color-background);
            color: var(--md-sys-color-on-background);
            transition: background var(--m3-transition-slow), color var(--m3-transition);
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background: var(--md-sys-color-background);
            transition: background var(--m3-transition-slow);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 80px;
            /* space for bottom nav */;
        }

        /* ============================================================
           TOP APP BAR
           ============================================================ */
        .top-app-bar {
            width: 100%;
            max-width: 1120px;
            padding: 10px 20px 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px 16px;
            background: var(--md-sys-color-surface);
            border-bottom: 1px solid var(--md-sys-color-outline-variant);
            transition: background var(--m3-transition), border-color var(--m3-transition);
            position: sticky;
            top: 0;
            z-index: 20;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .top-app-bar .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--md-sys-color-on-surface);
            font-weight: 700;
            font-size: 1.3rem;
            letter-spacing: -0.02em;
        }
        .top-app-bar .brand i {
            font-size: 1.6rem;
            color: var(--md-sys-color-primary);
            transition: color var(--m3-transition);
        }
        .top-app-bar .brand span {
            background: linear-gradient(135deg, var(--md-sys-color-on-surface) 40%, var(--md-sys-color-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .top-app-bar .social-links {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .top-app-bar .social-links a {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--md-sys-color-surface-variant);
            color: var(--md-sys-color-on-surface-variant);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            text-decoration: none;
            transition: all var(--m3-transition);
            border: none;
        }
        .top-app-bar .social-links a:hover {
            background: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            transform: translateY(-2px);
            box-shadow: var(--m3-elevation-2);
        }

        /* ============================================================
           MAIN CONTENT
           ============================================================ */
        .main-content {
            width: 100%;
            max-width: 1120px;
            padding: 16px 20px 0;
            flex: 1;
        }

        /* ---- page slider ---- */
        .slider-wrap {
            background: var(--md-sys-color-surface);
            border-radius: var(--m3-radius-lg);
            box-shadow: var(--m3-elevation-1);
            border: 1px solid var(--md-sys-color-outline-variant);
            overflow: hidden;
            transition: background var(--m3-transition), border-color var(--m3-transition), box-shadow var(--m3-transition);
        }
        .slider-inner {
            display: flex;
            width: 200%;
            transform: translateX(0);
            transition: transform 0.5s cubic-bezier(0.2, 0, 0, 1);
        }
        .slider-inner.slide-announcements {
            transform: translateX(-50%);
        }
        .slide {
            width: 50%;
            flex-shrink: 0;
            padding: 24px 28px 20px;
            min-height: 420px;
        }

        /* ============================================================
           HUB – NOW PLAYING CARD
           ============================================================ */
        .hub-top {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 6px 12px;
            margin-bottom: 16px;
        }
        .hub-top .tagline {
            font-size: 0.7rem;
            background: var(--md-sys-color-surface-variant);
            padding: 4px 14px;
            border-radius: 100px;
            color: var(--md-sys-color-on-surface-variant);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
            border: 1px solid var(--md-sys-color-outline-variant);
            transition: background var(--m3-transition), border-color var(--m3-transition);
        }
        .hub-top .tagline i {
            color: var(--md-sys-color-primary);
            font-size: 0.6rem;
        }

        /* ---- now playing strip (mini) ---- */
        .np-strip {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--md-sys-color-surface-variant);
            padding: 6px 16px 6px 14px;
            border-radius: 100px;
            border: 1px solid var(--md-sys-color-outline-variant);
            margin-bottom: 20px;
            transition: background var(--m3-transition), border-color var(--m3-transition);
        }
        .np-strip .np-label {
            font-size: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--md-sys-color-on-surface-variant);
            font-weight: 600;
        }
        .np-strip .np-label i {
            margin-right: 4px;
            color: var(--md-sys-color-primary);
        }
        .np-strip .np-title {
            font-weight: 500;
            font-size: 0.9rem;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--md-sys-color-on-surface);
        }
        .np-strip .np-dots {
            display: flex;
            gap: 4px;
        }
        .np-strip .np-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--md-sys-color-primary);
            display: inline-block;
            animation: dotPulse 1.2s ease-in-out infinite;
        }
        .np-strip .np-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .np-strip .np-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }
        .np-strip .np-dots.paused span {
            animation: none;
            opacity: 0.2;
        }
        @keyframes dotPulse {
            0%,
            100% {
                transform: scale(0.6);
                opacity: 0.25;
            }
            50% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        /* ---- player grid ---- */
        .player-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 24px 32px;
            align-items: flex-start;
        }

        /* cover */
        .cover-box {
            flex: 0 0 180px;
            width: 180px;
            height: 180px;
            border-radius: var(--m3-radius-md);
            overflow: hidden;
            box-shadow: var(--m3-elevation-3);
            background: var(--md-sys-color-surface-variant);
            position: relative;
            transition: transform var(--m3-transition), box-shadow var(--m3-transition);
            flex-shrink: 0;
        }
        .cover-box:hover {
            transform: scale(1.02) translateY(-4px);
            box-shadow: var(--m3-elevation-4);
        }
        .cover-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .cover-box .cover-fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--md-sys-color-surface-variant);
            color: var(--md-sys-color-primary);
            font-size: 3.6rem;
            opacity: 0.4;
        }
        .cover-box .ring {
            position: absolute;
            inset: -4px;
            border-radius: calc(var(--m3-radius-md) + 4px);
            border: 2.5px solid transparent;
            transition: border-color var(--m3-transition), transform var(--m3-transition);
            pointer-events: none;
        }
        .cover-box.is-playing .ring {
            border-color: var(--md-sys-color-primary);
            animation: ringPulse 1.8s ease-in-out infinite;
        }
        @keyframes ringPulse {
            0%,
            100% {
                transform: scale(1);
                opacity: 0.3;
            }
            50% {
                transform: scale(1.06);
                opacity: 0.8;
            }
        }

        /* controls */
        .controls-col {
            flex: 1;
            min-width: 200px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .track-info .track-name {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            line-height: 1.2;
            color: var(--md-sys-color-on-surface);
        }
        .track-info .track-artist {
            font-size: 0.9rem;
            color: var(--md-sys-color-on-surface-variant);
        }

        .playback-btns {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .playback-btns .play-btn {
            width: 56px;
            height: 56px;
            min-width: 56px;
            min-height: 56px;
            border-radius: 50%;
            border: none;
            background: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all var(--m3-transition);
            box-shadow: var(--m3-elevation-2);
            flex-shrink: 0;
        }
        .playback-btns .play-btn:hover {
            transform: scale(1.06);
            box-shadow: var(--m3-elevation-3);
        }
        .playback-btns .play-btn:active {
            transform: scale(0.92);
        }

        .playback-btns .sec-btn {
            background: transparent;
            border: none;
            color: var(--md-sys-color-on-surface-variant);
            font-size: 1.1rem;
            padding: 4px;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            min-width: 42px;
            min-height: 42px;
            transition: all var(--m3-transition);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .playback-btns .sec-btn:hover {
            background: var(--md-sys-color-surface-variant);
            color: var(--md-sys-color-on-surface);
        }

        .vol-wrap {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-left: auto;
            flex-shrink: 1;
            min-width: 0;
        }
        .vol-wrap .vol-btn {
            background: transparent;
            border: none;
            color: var(--md-sys-color-on-surface-variant);
            font-size: 0.95rem;
            padding: 2px;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            min-width: 32px;
            min-height: 32px;
            cursor: pointer;
            transition: all var(--m3-transition);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .vol-wrap .vol-btn:hover {
            background: var(--md-sys-color-surface-variant);
            color: var(--md-sys-color-on-surface);
        }
        .vol-wrap input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 80px;
            max-width: 80px;
            min-width: 40px;
            height: 4px;
            border-radius: 4px;
            background: var(--md-sys-color-outline-variant);
            outline: none;
            transition: background var(--m3-transition);
            cursor: pointer;
            flex-shrink: 1;
        }
        .vol-wrap input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--md-sys-color-primary);
            box-shadow: var(--m3-elevation-1);
            cursor: pointer;
            transition: transform var(--m3-transition);
        }
        .vol-wrap input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.12);
        }
        .vol-wrap input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--md-sys-color-primary);
            border: none;
            box-shadow: var(--m3-elevation-1);
            cursor: pointer;
        }

        /* progress */
        .progress-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .progress-area .time-label {
            font-size: 0.7rem;
            color: var(--md-sys-color-on-surface-variant);
            min-width: 36px;
            font-variant-numeric: tabular-nums;
            flex-shrink: 0;
            font-weight: 500;
        }
        .progress-area .track {
            flex: 1;
            height: 4px;
            border-radius: 20px;
            background: var(--md-sys-color-outline-variant);
            cursor: pointer;
            position: relative;
            transition: height var(--m3-transition);
            min-height: 28px;
            display: flex;
            align-items: center;
        }
        .progress-area .track:hover {
            height: 7px;
        }
        .progress-area .track .fill {
            height: 100%;
            width: 0;
            border-radius: 20px;
            background: var(--md-sys-color-primary);
            transition: width 0.08s linear;
            pointer-events: none;
        }

        /* ---- playlist ---- */
        .pl-section {
            margin-top: 20px;
            border-top: 1px solid var(--md-sys-color-outline-variant);
            padding-top: 16px;
            transition: border-color var(--m3-transition);
        }
        .pl-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .pl-header h3 {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--md-sys-color-on-surface-variant);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .pl-header .count {
            font-size: 0.65rem;
            background: var(--md-sys-color-surface-variant);
            padding: 2px 14px;
            border-radius: 100px;
            color: var(--md-sys-color-on-surface-variant);
            transition: background var(--m3-transition);
            font-weight: 500;
        }
        .pl-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
            max-height: 240px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .pl-list::-webkit-scrollbar {
            width: 4px;
        }
        .pl-list::-webkit-scrollbar-thumb {
            background: var(--md-sys-color-outline-variant);
            border-radius: 8px;
        }
        .pl-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: var(--m3-radius-sm);
            transition: all var(--m3-transition);
            cursor: pointer;
            border: 1px solid transparent;
        }
        .pl-item:hover {
            background: var(--md-sys-color-surface-variant);
            border-color: var(--md-sys-color-outline-variant);
        }
        .pl-item.active {
            background: var(--md-sys-color-surface-variant);
            border-color: var(--md-sys-color-primary);
        }
        .pl-item .idx {
            font-size: 0.65rem;
            color: var(--md-sys-color-on-surface-variant);
            min-width: 24px;
            text-align: center;
            flex-shrink: 0;
            font-weight: 500;
        }
        .pl-item .info {
            flex: 1;
            overflow: hidden;
            min-width: 0;
        }
        .pl-item .info .title {
            font-weight: 500;
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--md-sys-color-on-surface);
        }
        .pl-item .info .artist {
            font-size: 0.65rem;
            color: var(--md-sys-color-on-surface-variant);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .pl-item .dur {
            font-size: 0.7rem;
            color: var(--md-sys-color-on-surface-variant);
            min-width: 36px;
            text-align: right;
            flex-shrink: 0;
            font-weight: 500;
        }
        .pl-item .pl-icon {
            color: var(--md-sys-color-primary);
            font-size: 0.7rem;
            opacity: 0;
            transition: opacity var(--m3-transition);
            flex-shrink: 0;
            width: 20px;
            text-align: center;
        }
        .pl-item.active .pl-icon,
        .pl-item:hover .pl-icon {
            opacity: 1;
        }
        .pl-item .pl-icon.playing {
            opacity: 1;
            animation: iconPulse 1s infinite;
        }
        @keyframes iconPulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.15);
            }
        }

        /* ============================================================
           ANNOUNCEMENTS
           ============================================================ */
        .announce-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }
        .announce-header h2 {
            font-size: 1.2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--md-sys-color-on-surface);
        }
        .announce-header h2 i {
            color: var(--md-sys-color-primary);
        }
        .announce-header .count {
            font-size: 0.65rem;
            background: var(--md-sys-color-surface-variant);
            padding: 2px 14px;
            border-radius: 100px;
            color: var(--md-sys-color-on-surface-variant);
            transition: background var(--m3-transition);
            font-weight: 500;
        }

        .announce-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .announce-card {
            background: var(--md-sys-color-surface-variant);
            border: 1px solid var(--md-sys-color-outline-variant);
            border-radius: var(--m3-radius-md);
            padding: 12px 16px;
            transition: all var(--m3-transition);
            cursor: pointer;
            animation: fadeUp 0.4s ease forwards;
            opacity: 0;
        }
        .announce-card:nth-child(1) {
            animation-delay: 0.02s;
        }
        .announce-card:nth-child(2) {
            animation-delay: 0.06s;
        }
        .announce-card:nth-child(3) {
            animation-delay: 0.10s;
        }
        .announce-card:nth-child(4) {
            animation-delay: 0.14s;
        }
        .announce-card:nth-child(5) {
            animation-delay: 0.18s;
        }
        .announce-card:nth-child(6) {
            animation-delay: 0.22s;
        }
        .announce-card:nth-child(7) {
            animation-delay: 0.26s;
        }
        .announce-card:nth-child(8) {
            animation-delay: 0.30s;
        }
        .announce-card:nth-child(9) {
            animation-delay: 0.34s;
        }
        .announce-card:nth-child(10) {
            animation-delay: 0.38s;
        }
        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .announce-card:hover {
            border-color: var(--md-sys-color-outline);
            box-shadow: var(--m3-elevation-1);
        }
        .announce-card.expanded {
            border-color: var(--md-sys-color-primary);
            box-shadow: var(--m3-elevation-3);
        }
        .announce-card .summary {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .announce-card .summary img {
            width: 48px;
            height: 48px;
            border-radius: var(--m3-radius-sm);
            object-fit: cover;
            background: var(--md-sys-color-surface);
            flex-shrink: 0;
            border: 1px solid var(--md-sys-color-outline-variant);
        }
        .announce-card .summary .info {
            flex: 1;
            min-width: 0;
        }
        .announce-card .summary .info h4 {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--md-sys-color-on-surface);
        }
        .announce-card .summary .info p {
            font-size: 0.8rem;
            color: var(--md-sys-color-on-surface-variant);
        }
        .announce-card .summary .badge {
            font-size: 0.5rem;
            text-transform: uppercase;
            background: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            padding: 2px 10px;
            border-radius: 100px;
            font-weight: 600;
            flex-shrink: 0;
        }
        .announce-card .summary .expand-icon {
            color: var(--md-sys-color-on-surface-variant);
            transition: transform var(--m3-transition), color var(--m3-transition);
            flex-shrink: 0;
            font-size: 0.8rem;
        }
        .announce-card.expanded .summary .expand-icon {
            transform: rotate(180deg);
            color: var(--md-sys-color-primary);
        }
        .announce-card .details {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, padding 0.3s;
            padding: 0 2px;
        }
        .announce-card.expanded .details {
            max-height: 500px;
            padding: 12px 2px 2px;
        }
        .announce-card .details .row {
            display: flex;
            gap: 12px;
            padding: 6px 0;
            border-top: 1px solid var(--md-sys-color-outline-variant);
        }
        .announce-card .details .row:first-child {
            border-top: none;
        }
        .announce-card .details .row .label {
            font-size: 0.6rem;
            font-weight: 600;
            color: var(--md-sys-color-on-surface-variant);
            min-width: 60px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            flex-shrink: 0;
        }
        .announce-card .details .row .value {
            font-size: 0.85rem;
            color: var(--md-sys-color-on-surface);
            word-break: break-word;
        }
        .announce-card .details .row .value a {
            color: var(--md-sys-color-primary);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color var(--m3-transition);
        }
        .announce-card .details .row .value a:hover {
            border-bottom-color: var(--md-sys-color-primary);
        }
        .announce-card .details .row .value .tag {
            display: inline-block;
            font-size: 0.6rem;
            background: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
            padding: 1px 10px;
            border-radius: 100px;
            margin-right: 4px;
            font-weight: 500;
        }

        /* ============================================================
           BOTTOM NAVIGATION (M3)
           ============================================================ */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 30;
            background: var(--md-sys-color-surface);
            border-top: 1px solid var(--md-sys-color-outline-variant);
            display: flex;
            align-items: stretch;
            justify-content: center;
            padding: 0 16px;
            height: 72px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition: background var(--m3-transition), border-color var(--m3-transition);
            box-shadow: 0 -2px 16px rgba(0, 0, 0, 0.06);
        }
        .bottom-nav .nav-item {
            flex: 0 1 auto;
            min-width: 72px;
            max-width: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            background: transparent;
            border: none;
            color: var(--md-sys-color-on-surface-variant);
            font-family: var(--font);
            font-size: 0.6rem;
            font-weight: 500;
            cursor: pointer;
            padding: 4px 12px;
            border-radius: var(--m3-radius-md);
            transition: all var(--m3-transition);
            position: relative;
            text-decoration: none;
        }
        .bottom-nav .nav-item i {
            font-size: 1.4rem;
            transition: all var(--m3-transition);
        }
        .bottom-nav .nav-item .label {
            line-height: 1.1;
            letter-spacing: 0.01em;
        }
        .bottom-nav .nav-item:hover {
            color: var(--md-sys-color-on-surface);
            background: var(--md-sys-color-surface-variant);
        }
        .bottom-nav .nav-item.active {
            color: var(--md-sys-color-primary);
        }
        .bottom-nav .nav-item.active i {
            font-variation-settings: 'FILL' 1;
        }
        .bottom-nav .nav-item .badge-dot {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--md-sys-color-primary);
        }

        /* ============================================================
           FOOTER / THEME PICKER
           ============================================================ */
        .site-footer {
            margin-top: 28px;
            padding: 16px 0 4px;
            border-top: 1px solid var(--md-sys-color-outline-variant);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            transition: border-color var(--m3-transition);
            width: 100%;
            max-width: 1120px;
            padding-left: 20px;
            padding-right: 20px;
        }
        .site-footer .theme-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .site-footer .theme-row .label {
            font-size: 0.5rem;
            text-transform: uppercase;
            color: var(--md-sys-color-on-surface-variant);
            letter-spacing: 0.06em;
            margin-right: 4px;
            align-self: center;
            font-weight: 600;
        }
        .site-footer .theme-row .dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all var(--m3-transition);
            background: var(--md-sys-color-surface-variant);
            flex-shrink: 0;
            box-shadow: var(--m3-elevation-1);
        }
        .site-footer .theme-row .dot.active {
            border-color: var(--md-sys-color-primary);
            transform: scale(1.12);
            box-shadow: var(--m3-elevation-3);
        }
        .site-footer .theme-row .dot:hover {
            transform: scale(1.08);
        }
        .site-footer .theme-row .dot[data-theme="dark"] {
            background: #121016;
        }
        .site-footer .theme-row .dot[data-theme="light"] {

                if (pageId === currentPage) return;
                navItems.forEach(b => b.classList.toggle('active', b.dataset.page === pageId));
                if (pageId === 'hub') pageSlider.classList.remove('slide-announcements');
                else if (pageId === 'announcements') pageSlider.classList.add('slide-announcements');
                currentPage = pageId;
            }
            navItems.forEach(b => b.addEventListener('click', () => switchPage(b.dataset.page)));

            // ── announcements ──
            function renderAnnouncements() {
                announcementsContainer.innerHTML = '';
                announcements.forEach((ann) => {
                    const card = document.createElement('div');
                    card.className = 'announce-card';
                    card.setAttribute('role', 'button');
                    card.setAttribute('tabindex', '0');
                    const tagsHtml = ann.tags ? ann.tags.map(t => `<span class="tag">${t}</span>`).join(' ') : '';
                    const linksHtml = ann.links ? ann.links.map(l =>
                        `<a href="${l.url}" target="_blank" rel="noopener" onclick="event.stopPropagation();">${l.label}</a>`
                    ).join(' · ') : '';
                    card.innerHTML = `
                        <div class="summary">
                            <img src="${ann.cover}" alt="${ann.title}" loading="lazy" />
                            <div class="info"><h4>${ann.title}</h4><p>${ann.description}</p></div>
                            <span class="badge">New</span>
                            <span class="expand-icon"><i class="fas fa-chevron-down"></i></span>
                        </div>
                        <div class="details">
                            ${ann.fullDescription ? `<div class="row"><span class="label">About</span><span class="value">${ann.fullDescription}</span></div>` : ''}
                            ${ann.releaseDate ? `<div class="row"><span class="label">Released</span><span class="value">${ann.releaseDate}</span></div>` : ''}
                            ${tagsHtml ? `<div class="row"><span class="label">Tags</span><span class="value">${tagsHtml}</span></div>` : ''}
                            ${linksHtml ? `<div class="row"><span class="label">Links</span><span class="value">${linksHtml}</span></div>` : ''}
                        </div>
                    `;
                    const toggle = (e) => { if (e.target.closest('a')) return;
                        card.classList.toggle('expanded'); };
                    card.addEventListener('click', toggle);
                    card.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault();
                            toggle(e); } });
                    announcementsContainer.appendChild(card);
                });
                announcementCount.textContent = `${announcements.length} new`;
            }

            // ── player state ──
            let currentIndex = 0,
                isPlaying = false,
                isDragging = false,
                wasPlayingBeforeDrag = false,
                previousVolume = 0.8;

            function getSlug(title) { return title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, ''); }

            function updateHashForTrack(index) {
                const track = tracks[index];
                window.location.hash = track && track.title ? getSlug(track.title) : '';
            }

            function copyCurrentLink() {
                const track = tracks[currentIndex];
                if (!track) return;
                const url = window.location.href.split('#')[0] + '#' + getSlug(track.title);
                navigator.clipboard.writeText(url).then(() => {
                    const original = copyLinkBtn.innerHTML;
                    copyLinkBtn.innerHTML = '<i class="fas fa-check"></i>';
                    setTimeout(() => { copyLinkBtn.innerHTML = original; }, 1500);
                }).catch(() => alert('Could not copy link'));
            }

            function renderPlaylist() {
                playlistContainer.innerHTML = '';
                tracks.forEach((track, idx) => {
                    const item = document.createElement('div');
                    item.className = `pl-item ${idx === currentIndex ? 'active' : ''}`;
                    item.dataset.index = idx;
                    item.setAttribute('role', 'button');
                    item.setAttribute('tabindex', '0');
                    const isActive = idx === currentIndex;
                    item.innerHTML = `
                        <span class="idx">${String(idx+1).padStart(2,'0')}</span>
                        <div class="info"><span class="title">${track.title}</span><span class="artist">${track.artist}</span></div>
                        <span class="dur">${track.duration||'—'}</span>
                        <span class="pl-icon ${isActive && isPlaying ? 'playing' : ''}"><i class="fas ${isActive && isPlaying ? 'fa-volume-high' : 'fa-play'}"></i></span>
                    `;
                    const handle = () => {
                        if (idx === currentIndex) { togglePlay(); } else { currentIndex = idx;
                            loadTrack(currentIndex); if (isPlaying) audio.play().catch(() => {}); else play();
                            updateHashForTrack(currentIndex); }
                    };
                    item.addEventListener('click', handle);
                    item.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault();
                            handle(); } });
                    playlistContainer.appendChild(item);
                });
                updateTrackCount();
            }

            function updateTrackCount() { trackCount.textContent = `${tracks.length} tracks`; }

            function loadTrack(index) {
                const track = tracks[index];
                if (!track) return;
                trackName.textContent = track.title;
                trackArtist.textContent = track.artist;
                npTitle.textContent = track.title;
                if (track.cover) { coverImg.src = track.cover;
                    coverImg.style.display = 'block';
                    coverFallback.style.display = 'none'; } else { coverImg.style.display = 'none';
                    coverFallback.style.display = 'flex'; }
                audio.src = track.src;
                audio.load();
                progressFill.style.width = '0%';
                currentTimeLabel.textContent = '0:00';
                totalTimeLabel.textContent = track.duration || '0:00';
                document.querySelectorAll('.pl-item').forEach((el, i) => {
                    el.classList.toggle('active', i === index);
                    const icon = el.querySelector('.pl-icon');
                    if (icon) {
                        icon.className = `pl-icon ${i === index && isPlaying ? 'playing' : ''}`;
                        icon.innerHTML = `<i class="fas ${i === index && isPlaying ? 'fa-volume-high' : 'fa-play'}"></i>`;
                    }
                });
                updateCoverPlayState();
                npIndicator.className = isPlaying ? 'np-dots' : 'np-dots paused';
            }

            function updateCoverPlayState() { coverWrapper.classList.toggle('is-playing', isPlaying && audio.src && audio.src !==
                    ''); }

            function play() { audio.play().catch(() => {});
                isPlaying = true;
                updatePlayButton();
                updatePlaylistIcons();
                npIndicator.className = 'np-dots';
                updateCoverPlayState(); }

            function pause() { audio.pause();
                isPlaying = false;
                updatePlayButton();
                updatePlaylistIcons();
                npIndicator.className = 'np-dots paused';
                updateCoverPlayState(); }

            function togglePlay() { audio.paused ? play() : pause(); }

            function updatePlayButton() {
                playIcon.className = isPlaying ? 'fas fa-pause' : 'fas fa-play';
            }

            function updatePlaylistIcons() {
                document.querySelectorAll('.pl-item').forEach((el, i) => {
                    const icon = el.querySelector('.pl-icon');
                    if (icon) {
                        const active = i === currentIndex && isPlaying;
                        icon.className = `pl-icon ${active ? 'playing' : ''}`;
                        icon.innerHTML = `<i class="fas ${active ? 'fa-volume-high' : 'fa-play'}"></i>`;
                    }
                });
            }

            function formatTime(sec) { if (!sec || isNaN(sec)) return '0:00'; const m = Math.floor(sec / 60),
                    s = Math.floor(sec % 60); return `${m}:${s.toString().padStart(2,'0')}`; }

            function updateProgress() {
                if (isDragging) return;
                if (audio.duration && !isNaN(audio.duration)) {
                    const p = (audio.currentTime / audio.duration) * 100;
                    progressFill.style.width = `${Math.min(p,100)}%`;
                    currentTimeLabel.textContent = formatTime(audio.currentTime);
                    totalTimeLabel.textContent = formatTime(audio.duration);
                }
            }

            function updateVolumeIcon() {
                const v = parseFloat(volumeSlider.value);
                if (v === 0) volIcon.className = 'fas fa-volume-xmark';
                else if (v < 0.4) volIcon.className = 'fas fa-volume-low';
                else if (v < 0.7) volIcon.className = 'fas fa-volume-low';
                else volIcon.className = 'fas fa-volume-high';
            }

            function toggleMute() {
                const v = parseFloat(volumeSlider.value);
                if (v > 0) { previousVolume = v;
                    volumeSlider.value = 0;
                    audio.volume = 0;
                    updateVolumeIcon(); } else { volumeSlider.value = previousVolume || 0.8;
                    audio.volume = parseFloat(volumeSlider.value);
                    updateVolumeIcon(); }
            }

            function nextTrack() { const n = (currentIndex + 1) % tracks.length;
                currentIndex = n;
                loadTrack(currentIndex); if (isPlaying) audio.play().catch(() => {}); else play();
                updateHashForTrack(currentIndex); }

            function prevTrack() { const p = (currentIndex - 1 + tracks.length) % tracks.length;
                currentIndex = p;
                loadTrack(currentIndex); if (isPlaying) audio.play().catch(() => {}); else play();
                updateHashForTrack(currentIndex); }

            function findTrackBySlug(slug) {
                if (!slug) return -1;
                const idx = tracks.findIndex(t => getSlug(t.title) === slug);
                return idx >= 0 ? idx : -1;
            }

            function handleHashChange() {
                const hash = window.location.hash.substring(1);
                if (!hash) return;
                const idx = findTrackBySlug(hash);
                if (idx >= 0 && idx !== currentIndex) {
                    currentIndex = idx;
                    loadTrack(currentIndex);
                    if (isPlaying) audio.play().catch(() => {});
                    renderPlaylist();
                }
            }
            window.addEventListener('hashchange', handleHashChange);

            // ── event listeners ──
            playBtn.addEventListener('click', togglePlay);
            prevBtn.addEventListener('click', prevTrack);
            nextBtn.addEventListener('click', nextTrack);
            volIconBtn.addEventListener('click', toggleMute);
            copyLinkBtn.addEventListener('click', copyCurrentLink);

            audio.addEventListener('timeupdate', updateProgress);
            audio.addEventListener('loadedmetadata', () => { totalTimeLabel.textContent = formatTime(audio.duration); });
            audio.addEventListener('ended', nextTrack);
            audio.addEventListener('play', () => { isPlaying = true;
                updatePlayButton();
                updatePlaylistIcons();
                npIndicator.className = 'np-dots';
                updateCoverPlayState(); });
            audio.addEventListener('pause', () => { isPlaying = false;
                updatePlayButton();
                updatePlaylistIcons();
                npIndicator.className = 'np-dots paused';
                updateCoverPlayState(); });

            volumeSlider.addEventListener('input', () => { audio.volume = parseFloat(volumeSlider.value);
                updateVolumeIcon(); });

            // progress seek
            progressTrack.addEventListener('mousedown', (e) => { if (!audio.duration) return;
                isDragging = true;
                wasPlayingBeforeDrag = !audio.paused;
                audio.pause();
                seekFromMouse(e); });
            document.addEventListener('mousemove', (e) => { if (isDragging) seekFromMouse(e); });
            document.addEventListener('mouseup', () => { if (isDragging) { isDragging = false; if (wasPlayingBeforeDrag) audio
                        .play().catch(() => {}); } });
            progressTrack.addEventListener('touchstart', (e) => { if (!audio.duration) return;
                isDragging = true;
                wasPlayingBeforeDrag = !audio.paused;
                audio.pause();
                seekFromTouch(e); }, { passive: true });
            progressTrack.addEventListener('touchmove', (e) => { if (isDragging) seekFromTouch(e); }, { passive: true });
            progressTrack.addEventListener('touchend', () => { if (isDragging) { isDragging = false; if (wasPlayingBeforeDrag)
                        audio.play().catch(() => {}); } }, { passive: true });

            function seekFromMouse(e) { const rect = progressTrack.getBoundingClientRect();
                const x = Math.min(Math.max((e.clientX - rect.left) / rect.width, 0), 1); if (audio.duration) { audio
                        .currentTime = x * audio.duration;
                    progressFill.style.width = `${x*100}%`;
                    currentTimeLabel.textContent = formatTime(audio.currentTime); } }

            function seekFromTouch(e) { const touch = e.touches[0];
                const rect = progressTrack.getBoundingClientRect();
                const x = Math.min(Math.max((touch.clientX - rect.left) / rect.width, 0), 1); if (audio.duration) { audio
                        .currentTime = x * audio.duration;
                    progressFill.style.width = `${x*100}%`;
                    currentTimeLabel.textContent = formatTime(audio.currentTime); } }

            // keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                if (e.code === 'Space') { e.preventDefault();
                    togglePlay(); }
                if (e.code === 'ArrowRight') { e.preventDefault();
                    nextTrack(); }
                if (e.code === 'ArrowLeft') { e.preventDefault();
                    prevTrack(); }
                if (e.key === 'm') { e.preventDefault();
                    toggleMute(); }
            });

            // ── init ──
            loadTheme();
            renderPlaylist();
            renderAnnouncements();

            const initialHash = window.location.hash.substring(1);
            const startIndex = initialHash ? Math.max(findTrackBySlug(initialHash), 0) : 0;
            currentIndex = startIndex;
            loadTrack(currentIndex);
            if (initialHash && findTrackBySlug(initialHash) >= 0) updateHashForTrack(currentIndex);

            audio.volume = parseFloat(volumeSlider.value);
            updateVolumeIcon();
            npIndicator.className = 'np-dots paused';
            currentPage = 'hub';
            pageSlider.classList.remove('slide-announcements');
            navItems.forEach(b => b.classList.toggle('active', b.dataset.page === 'hub'));

        })();
    </script>
</body>
</html>
