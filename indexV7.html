        /* ============================================================
           BASE
           ============================================================ */
        html {
            font: 100%/1.5 var(--font);
            background: var(--md-sys-color-background);
            color: var(--md-sys-color-on-background);
            transition: background var(--m3-transition-slow), color var(--m3-transition);
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background: var(--md-sys-color-background);
            transition: background var(--m3-transition-slow);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ============================================================
           TOP APP BAR
           ============================================================ */
        .top-app-bar {
            width: 100%;
            max-width: 1120px;
            padding: 10px 20px 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px 16px;
            background: var(--md-sys-color-surface);
            border-bottom: 1px solid var(--md-sys-color-outline-variant);
            transition: background var(--m3-transition), border-color var(--m3-transition);
            position: sticky;
            top: 0;
            z-index: 20;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .top-app-bar .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--md-sys-color-on-surface);
            font-weight: 700;
            font-size: 1.3rem;
            letter-spacing: -.02em;
        }

        .top-app-bar .brand i {
            font-size: 1.6rem;
            color: var(--md-sys-color-primary);
            transition: color var(--m3-transition);
        }

        .top-app-bar .brand span {
            background: linear-gradient(135deg, var(--md-sys-color-on-surface) 40%, var(--md-sys-color-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .top-app-bar .social-links {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .top-app-bar .social-links a {
            width: 38px;
            height: 38px;
            border-radius: var(--m3-radius-sm);
            background: var(--md-sys-color-surface-variant);
            color: var(--md-sys-color-on-surface-variant);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: .9rem;
            text-decoration: none;
            transition: all var(--m3-transition);
            border: none;
        }

        .top-app-bar .social-links a:hover {
            background: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            transform: translateY(-2px);
            box-shadow: var(--m3-elevation-2);
        }

        /* ---- Contact link in header ---- */
        .header-contact {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: var(--m3-radius-sm);
            background: var(--md-sys-color-surface-variant);
            color: var(--md-sys-color-on-surface-variant);
            text-decoration: none;
            font-weight: 500;
            font-size: .8rem;
            border: 1px solid var(--md-sys-color-outline-variant);
            transition: all var(--m3-transition);
            box-shadow: var(--m3-elevation-1);
            letter-spacing: .3px;
        }

        .header-contact i {
            font-size: .9rem;
            color: var(--md-sys-color-on-surface-variant);
            transition: all var(--m3-transition);
        }

        .header-contact:hover {
            background: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            border-color: var(--md-sys-color-primary);
            transform: translateY(-3px);
            box-shadow: var(--m3-elevation-2);
        }

        .header-contact:hover i {
            color: var(--md-sys-color-on-primary);
            transform: scale(1.15) rotate(-5deg);
        }

        /* ============================================================
           NAV TABS
           ============================================================ */
        .nav-tabs {
            width: 100%;
            max-width: 1120px;
            padding: 0 20px;
            display: flex;
            gap: 0;
            background: var(--md-sys-color-surface);
            border-bottom: 1px solid var(--md-sys-color-outline-variant);
            transition: background var(--m3-transition), border-color var(--m3-transition);
            position: sticky;
            top: 60px;
            z-index: 19;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .nav-tabs .tab {
            flex: 0 0 auto;
            padding: 12px 24px;
            font: 500 .85rem/1 var(--font);
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            color: var(--md-sys-color-on-surface-variant);
            cursor: pointer;
            transition: all var(--m3-transition);
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: .01em;
            border-radius: 0;
        }

        .nav-tabs .tab i {
            font-size: .9rem;
        }

        .nav-tabs .tab:hover {
            color: var(--md-sys-color-on-surface);
            background: var(--md-sys-color-surface-variant);
        }

        .nav-tabs .tab.active {
            color: var(--md-sys-color-primary);
            border-bottom-color: var(--md-sys-color-primary);
        }

        .nav-tabs .tab .badge {
            font-size: .5rem;
            background: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            padding: 1px 8px;
            border-radius: var(--m3-radius-sm);
            font-weight: 600;
            margin-left: 2px;
        }

        /* ============================================================
           MAIN CONTENT
           ============================================================ */
        .main-content {
            width: 100%;
            max-width: 1120px;
            padding: 20px 20px 12px;
            flex: 1;
        }

        .tab-panel {
            display: none;
            animation: fadeUp .35s ease forwards;
        }

        .tab-panel.active {
            display: block;
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================================
           HUB – NOW PLAYING CARD
           ============================================================ */
        .hub-top {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 6px 12px;
            margin-bottom: 16px;
        }

        .hub-top .tagline {
            font-size: .7rem;
            background: var(--md-sys-color-surface-variant);
            padding: 4px 14px;
            border-radius: var(--m3-radius-sm);
            color: var(--md-sys-color-on-surface-variant);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
            border: 1px solid var(--md-sys-color-outline-variant);
            transition: background var(--m3-transition), border-color var(--m3-transition);
        }

        .hub-top .tagline i {
            color: var(--md-sys-color-primary);
            font-size: .6rem;
        }

        .np-strip {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--md-sys-color-surface-variant);
            padding: 6px 16px 6px 14px;
            border-radius: var(--m3-radius-sm);
            border: 1px solid var(--md-sys-color-outline-variant);
            margin-bottom: 20px;
            transition: background var(--m3-transition), border-color var(--m3-transition);
        }

        .np-strip .np-label {
            font-size: .5rem;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: var(--md-sys-color-on-surface-variant);
            font-weight: 600;
        }

        .np-strip .np-label i {
            margin-right: 4px;
            color: var(--md-sys-color-primary);
        }

        .np-strip .np-title {
            font-weight: 500;
            font-size: .9rem;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--md-sys-color-on-surface);
        }

        .np-strip .np-dots {
            display: flex;
            gap: 4px;
        }

        .np-strip .np-dots span {
            width: 6px;
            height: 6px;
            border-radius: var(--m3-radius-sm);
            background: var(--md-sys-color-primary);
            display: inline-block;
            animation: dotPulse 1.2s ease-in-out infinite;
        }

        .np-strip .np-dots span:nth-child(2) {
            animation-delay: .2s;
        }
        .np-strip .np-dots span:nth-child(3) {
            animation-delay: .4s;
        }

        .np-strip .np-dots.paused span {
            animation: none;
            opacity: .2;
        }

        @keyframes dotPulse {
            0%,
            100% {
                transform: scale(.6);
                opacity: .25;
            }
            50% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        .player-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 24px 32px;
            align-items: flex-start;
        }

        .cover-box {
            flex: 0 0 180px;
            width: 180px;
            height: 180px;
            border-radius: var(--m3-radius-md);
            overflow: hidden;
            box-shadow: var(--m3-elevation-3);
            background: var(--md-sys-color-surface-variant);
            position: relative;
            transition: transform var(--m3-transition), box-shadow var(--m3-transition);
            flex-shrink: 0;
        }

        .cover-box:hover {
            transform: scale(1.02) translateY(-4px);
            box-shadow: var(--m3-elevation-4);
        }

        .cover-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .cover-box .cover-fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--md-sys-color-surface-variant);
            color: var(--md-sys-color-primary);
            font-size: 3.6rem;
            opacity: .4;
        }

        .cover-box .ring {
            position: absolute;
            inset: -4px;
            border-radius: var(--m3-radius-md);
            border: 2.5px solid transparent;
            transition: border-color var(--m3-transition), transform var(--m3-transition);
            pointer-events: none;
        }

        .cover-box.is-playing .ring {
            border-color: var(--md-sys-color-primary);
            animation: ringPulse 1.8s ease-in-out infinite;
        }

        @keyframes ringPulse {
            0%,
            100% {
                transform: scale(1);
                opacity: .3;
            }
            50% {
                transform: scale(1.06);
                opacity: .8;
            }
        }

        .controls-col {
            flex: 1;
            min-width: 200px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .track-info .track-name {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -.01em;
            line-height: 1.2;
            color: var(--md-sys-color-on-surface);
        }

        .track-info .track-artist {
            font-size: .9rem;
            color: var(--md-sys-color-on-surface-variant);
        }

        .playback-btns {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .playback-btns .play-btn {
            width: 56px;
            height: 56px;
            min-width: 56px;
            min-height: 56px;
            border-radius: var(--m3-radius-md);
            border: none;
            background: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all var(--m3-transition);
            box-shadow: var(--m3-elevation-2);
            flex-shrink: 0;
        }

        .playback-btns .play-btn:hover {
            transform: scale(1.06);
            box-shadow: var(--m3-elevation-3);
        }

        .playback-btns .play-btn:active {
            transform: scale(.92);
        }

        .playback-btns .sec-btn {
            background: transparent;
            border: none;
            color: var(--md-sys-color-on-surface-variant);
            font-size: 1.1rem;
            padding: 4px;
            border-radius: var(--m3-radius-sm);
            width: 42px;
            height: 42px;
            min-width: 42px;
            min-height: 42px;
            transition: all var(--m3-transition);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .playback-btns .sec-btn:hover {
            background: var(--md-sys-color-surface-variant);
            color: var(--md-sys-color-on-surface);
        }

        .vol-wrap {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-left: auto;
            flex-shrink: 1;
            min-width: 0;
        }

        .vol-wrap .vol-btn {
            background: transparent;
            border: none;
            color: var(--md-sys-color-on-surface-variant);
            font-size: .95rem;
            padding: 2px;
            border-radius: var(--m3-radius-sm);
            width: 32px;
            height: 32px;
            min-width: 32px;
            min-height: 32px;
            cursor: pointer;
            transition: all var(--m3-transition);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .vol-wrap .vol-btn:hover {
            background: var(--md-sys-color-surface-variant);
            color: var(--md-sys-color-on-surface);
        }

        .vol-wrap input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 80px;
            max-width: 80px;
            min-width: 40px;
            height: 4px;
            border-radius: var(--m3-radius-sm);
            background: var(--md-sys-color-outline-variant);
            outline: none;
            transition: background var(--m3-transition);
            cursor: pointer;
            flex-shrink: 1;
        }

        .vol-wrap input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: var(--m3-radius-sm);
            background: var(--md-sys-color-primary);
            box-shadow: var(--m3-elevation-1);
            cursor: pointer;
            transition: transform var(--m3-transition);
        }

        .vol-wrap input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.12);
        }

        .vol-wrap input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: var(--m3-radius-sm);
            background: var(--md-sys-color-primary);
            border: none;
            box-shadow: var(--m3-elevation-1);
            cursor: pointer;
        }

        .progress-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .progress-area .time-label {
            font-size: .7rem;
            color: var(--md-sys-color-on-surface-variant);
            min-width: 36px;
            font-variant-numeric: tabular-nums;
            flex-shrink: 0;
            font-weight: 500;
        }

        .progress-area .track {
            flex: 1;
            height: 4px;
            border-radius: var(--m3-radius-sm);
            background: var(--md-sys-color-outline-variant);
            cursor: pointer;
            position: relative;
            transition: height var(--m3-transition);
            min-height: 28px;
            display: flex;
            align-items: center;
        }

        .progress-area .track:hover {
            height: 7px;
        }

        .progress-area .track .fill {
            height: 100%;
            width: 0;
            border-radius: var(--m3-radius-sm);
            background: var(--md-sys-color-primary);
            transition: width .08s linear;
            pointer-events: none;
        }

        /* ============================================================
           PLAYLIST
           ============================================================ */
        .pl-section {
            margin-top: 24px;
            border-top: 1px solid var(--md-sys-color-outline-variant);
            padding-top: 18px;
            transition: border-color var(--m3-transition);
        }

        .pl-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .pl-header h3 {
            font-size: .75rem;
            text-transform: uppercase;
            letter-spacing: .06em;
            color: var(--md-sys-color-on-surface-variant);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pl-header .count {
            font-size: .65rem;
            background: var(--md-sys-color-surface-variant);
            padding: 2px 14px;
            border-radius: var(--m3-radius-sm);
            color: var(--md-sys-color-on-surface-variant);
            transition: background var(--m3-transition);
            font-weight: 500;
        }

        .pl-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding-right: 4px;
        }

        .pl-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: var(--m3-radius-sm);
            transition: all var(--m3-transition);
            cursor: pointer;
            border: 1px solid transparent;
        }

        .pl-item:hover {
            background: var(--md-sys-color-surface-variant);
            border-color: var(--md-sys-color-outline-variant);
        }

        .pl-item.active {
            background: var(--md-sys-color-surface-variant);
            border-color: var(--md-sys-color-primary);
        }

        .pl-item .idx {
            font-size: .65rem;
            color: var(--md-sys-color-on-surface-variant);
            min-width: 24px;
            text-align: center;
            flex-shrink: 0;
            font-weight: 500;
        }

        .pl-item .info {
            flex: 1;
            overflow: hidden;
            min-width: 0;
        }

        .pl-item .info .title {
            font-weight: 500;
            font-size: .85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--md-sys-color-on-surface);
        }

        .pl-item .info .artist {
            font-size: .65rem;
            color: var(--md-sys-color-on-surface-variant);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .pl-item .dur {
            font-size: .7rem;
            color: var(--md-sys-color-on-surface-variant);
            min-width: 36px;
            text-align: right;
            flex-shrink: 0;
            font-weight: 500;
        }

        .pl-item .pl-icon {
            color: var(--md-sys-color-primary);
            font-size: .7rem;
            opacity: 0;
            transition: opacity var(--m3-transition);
            flex-shrink: 0;
            width: 20px;
            text-align: center;
        }

        .pl-item.active .pl-icon,
        .pl-item:hover .pl-icon {
            opacity: 1;
        }

        .pl-item .pl-icon.playing {
            opacity: 1;
            animation: iconPulse 1s infinite;
        }

        @keyframes iconPulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.15);
            }
        }

        /* ============================================================
           ANNOUNCEMENTS
           ============================================================ */
        .announce-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .announce-header h2 {
            font-size: 1.2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--md-sys-color-on-surface);
        }

        .announce-header h2 i {
            color: var(--md-sys-color-primary);
        }

        .announce-header .count {
            font-size: .65rem;
            background: var(--md-sys-color-surface-variant);
            padding: 2px 14px;
            border-radius: var(--m3-radius-sm);
            color: var(--md-sys-color-on-surface-variant);
            transition: background var(--m3-transition);
            font-weight: 500;
        }

        .announce-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .announce-card {
            background: var(--md-sys-color-surface-variant);
            border: 1px solid var(--md-sys-color-outline-variant);
            border-radius: var(--m3-radius-sm);
            padding: 12px 16px;
            transition: all var(--m3-transition);
            cursor: pointer;
            animation: fadeUp .4s ease forwards;
            opacity: 0;
        }

        .announce-card:nth-child(1) {
            animation-delay: .02s;
        }
        .announce-card:nth-child(2) {
            animation-delay: .06s;
        }
        .announce-card:nth-child(3) {
            animation-delay: .10s;
        }
        .announce-card:nth-child(4) {
            animation-delay: .14s;
        }
        .announce-card:nth-child(5) {
            animation-delay: .18s;
        }
        .announce-card:nth-child(6) {
            animation-delay: .22s;
        }
        .announce-card:nth-child(7) {
            animation-delay: .26s;
        }
        .announce-card:nth-child(8) {
            animation-delay: .30s;
        }
        .announce-card:nth-child(9) {
            animation-delay: .34s;
        }
        .announce-card:nth-child(10) {
            animation-delay: .38s;
        }

        .announce-card:hover {
            border-color: var(--md-sys-color-outline);
            box-shadow: var(--m3-elevation-1);
        }

        .announce-card.expanded {
            border-color: var(--md-sys-color-primary);
            box-shadow: var(--m3-elevation-3);
        }

        .announce-card .summary {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .announce-card .summary img {
            width: 48px;
            height: 48px;
            border-radius: var(--m3-radius-sm);
            object-fit: cover;
            background: var(--md-sys-color-surface);
            flex-shrink: 0;
            border: 1px solid var(--md-sys-color-outline-variant);
        }

        .announce-card .summary .info {
            flex: 1;
            min-width: 0;
        }

        .announce-card .summary .info h4 {
            font-weight: 600;
            font-size: .95rem;
            color: var(--md-sys-color-on-surface);
        }

        .announce-card .summary .info p {
            font-size: .8rem;
            color: var(--md-sys-color-on-surface-variant);
        }

        .announce-card .summary .badge {
            font-size: .5rem;
            text-transform: uppercase;
            background: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            padding: 2px 10px;
            border-radius: var(--m3-radius-sm);
            font-weight: 600;
            flex-shrink: 0;
        }

        .announce-card .summary .expand-icon {
            color: var(--md-sys-color-on-surface-variant);
            transition: transform var(--m3-transition), color var(--m3-transition);
            flex-shrink: 0;
            font-size: .8rem;
        }

        .announce-card.expanded .summary .expand-icon {
            transform: rotate(180deg);
            color: var(--md-sys-color-primary);
        }

        .announce-card .details {
            max-height: 0;
            overflow: hidden;
            transition: max-height .4s ease, padding .3s;
            padding: 0 2px;
        }

        .announce-card.expanded .details {
            max-height: 500px;
            padding: 12px 2px 2px;
        }

        .announce-card .details .row {
            display: flex;
            gap: 12px;
            padding: 6px 0;
            border-top: 1px solid var(--md-sys-color-outline-variant);
        }

        .announce-card .details .row:first-child {
            border-top: none;
        }

        .announce-card .details .row .label {
            font-size: .6rem;
            font-weight: 600;
            color: var(--md-sys-color-on-surface-variant);
            min-width: 60px;
            text-transform: uppercase;
            letter-spacing: .04em;
            flex-shrink: 0;
        }

        .announce-card .details .row .value {
            font-size: .85rem;
            color: var(--md-sys-color-on-surface);
            word-break: break-word;
        }

        .announce-card .details .row .value a {
            color: var(--md-sys-color-primary);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color var(--m3-transition);
        }

        .announce-card .details .row .value a:hover {
            border-bottom-color: var(--md-sys-color-primary);
        }

        .announce-card .details .row .value .tag {
            display: inline-block;
            font-size: .6rem;
            background: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
            padding: 1px 10px;
            border-radius: var(--m3-radius-sm);
            margin-right: 4px;
            font-weight: 500;
        }

        /* ============================================================
           OTHER / PROJECTS
           ============================================================ */
        .other-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .other-header h2 {
            font-size: 1.2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--md-sys-color-on-surface);
        }

        .other-header h2 i {
            color: var(--md-sys-color-primary);
        }

        .other-header .count {
            font-size: .65rem;
            background: var(--md-sys-color-surface-variant);
            padding: 2px 14px;
            border-radius: var(--m3-radius-sm);
            color: var(--md-sys-color-on-surface-variant);
            transition: background var(--m3-transition);
            font-weight: 500;
        }

        .other-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 4px 0 8px;
        }

        .other-item {
            aspect-ratio: 1/1;
            border-radius: var(--m3-radius-md);
            overflow: hidden;
            cursor: pointer;
            position: relative;
            border: 1px solid var(--md-sys-color-outline-variant);
            background: var(--md-sys-color-surface-variant);
            transition: transform .55s cubic-bezier(.22, 1, .36, 1), box-shadow .55s cubic-bezier(.22, 1, .36, 1), border-color .4s ease;
            transform-origin: center center;
            z-index: 1;
            box-shadow: var(--m3-elevation-1);
        }

        .other-item:hover {
            border-color: var(--md-sys-color-outline);
            box-shadow: var(--m3-elevation-2);
        }

        .other-item .other-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform .5s ease;
        }

        .other-item:hover .other-img {
            transform: scale(1.03);
        }

        .other-item .other-overlay {

            /* ── state ── */
            let tracks = [...DEFAULT_TRACKS],

            let currentIndex = 0,

            /* ── DOM refs ── */

            const otherGrid = document.getElementById('otherGrid');
            const otherCount = document.getElementById('otherCount');

            /* ── helpers ── */
            const slug = t => t.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
            const fmt = s => { if (!s || isNaN(s)) return '0:00'; const m = Math.floor(s / 60),
                    sec = Math.floor(s % 60); return m + ':' + String(sec).padStart(2, '0'); };

            /* ── theme ── */
            function setTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                themeDots.forEach(d => d.classList.toggle('active', d.dataset.theme === theme));
                try { localStorage.setItem(STORAGE_KEY_THEME, theme); } catch (_) {}
            }

            function loadTheme() {
                let theme = 'dark';
                try { const s = localStorage.getItem(STORAGE_KEY_THEME); if (s && VALID_THEMES.includes(s)) theme = s; } catch (
                _) {}
                setTheme(theme);
            }
            themeDots.forEach(d => d.addEventListener('click', () => setTheme(d.dataset.theme)));

            /* ── tabs ── */
            function switchPage(pageId) {
                if (pageId === currentPage) return;
                tabs.forEach(t => t.classList.toggle('active', t.dataset.page === pageId));
                Object.keys(panels).forEach(k => panels[k].classList.toggle('active', k === pageId));
                currentPage = pageId;
            }
            tabs.forEach(t => t.addEventListener('click', () => switchPage(t.dataset.page)));

            /* ── announcements ── */
            function renderAnnouncements() {
                announcementsContainer.innerHTML = '';
                announcements.forEach(ann => {
                    const card = document.createElement('div');
                    card.className = 'announce-card';
                    card.setAttribute('role', 'button');
                    card.setAttribute('tabindex', '0');
                    const tagsHtml = ann.tags ? ann.tags.map(t => `<span class="tag">${t}</span>`).join(' ') : '';
                    const linksHtml = ann.links ? ann.links.map(l =>
                        `<a href="${l.url}" target="_blank" rel="noopener" onclick="event.stopPropagation();">${l.label}</a>`
                    ).join(' · ') : '';
                    card.innerHTML =
                        `
                        <div class="summary">
                            <img src="${ann.cover}" alt="${ann.title}" loading="lazy" />
                            <div class="info"><h4>${ann.title}</h4><p>${ann.description}</p></div>
                            <span class="badge">New</span>
                            <span class="expand-icon"><i class="fas fa-chevron-down"></i></span>
                        </div>
                        <div class="details">
                            ${ann.fullDescription ? `<div class="row"><span class="label">About</span><span class="value">${ann.fullDescription}</span></div>` : ''}
                            ${ann.releaseDate ? `<div class="row"><span class="label">Released</span><span class="value">${ann.releaseDate}</span></div>` : ''}
                            ${tagsHtml ? `<div class="row"><span class="label">Tags</span><span class="value">${tagsHtml}</span></div>` : ''}
                            ${linksHtml ? `<div class="row"><span class="label">Links</span><span class="value">${linksHtml}</span></div>` : ''}
                        </div>
                    `;
                    const toggle = e => { if (e.target.closest('a')) return;
                        card.classList.toggle('expanded'); };
                    card.addEventListener('click', toggle);
                    card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault();
                            toggle(e); } });
                    announcementsContainer.appendChild(card);
                });
                announcementCount.textContent = announcements.length + ' new';
                newsBadge.textContent = announcements.length;
            }

            /* ── other ── */
            function renderOther() {
                otherGrid.innerHTML = '';
                otherItems.forEach((item, idx) => {
                    const div = document.createElement('div');
                    div.className = 'other-item';
                    div.dataset.index = idx;
                    div.setAttribute('role', 'button');
                    div.setAttribute('tabindex', '0');

                    const hasImage = item.image && !item.image.includes('placehold');
                    const imgHtml = hasImage ?
                        `<img class="other-img" src="${item.image}" alt="${item.title}" loading="lazy" onerror="this.style.display='none'; this.parentElement.querySelector('.other-img-fallback').style.display='flex';" />` :
                        `<div class="other-img-fallback"><i class="fas fa-image"></i></div>`;

                    div.innerHTML = `
                        ${imgHtml}
                        ${!hasImage ? `<div class="other-img-fallback"><i class="fas fa-image"></i></div>` : ''}
                        <div class="other-overlay">
                            <h4>${item.title}</h4>
                            <p>${item.description}</p>
                        </div>
                        <button class="expand-close" aria-label="Close"><i class="fas fa-times"></i></button>
                    `;

                    if (hasImage) {
                        const fb = div.querySelector('.other-img-fallback');
                        if (fb) fb.style.display = 'none';
                    }

                    const closeBtn = div.querySelector('.expand-close');
                    const expand = e => {
                        if (e && e.target.closest('.expand-close')) return;
                        const was = div.classList.contains('expanded');
                        document.querySelectorAll('.other-item.expanded').forEach(el => { if (el !== div) el
                                .classList.remove('expanded'); });
                        div.classList.toggle('expanded', !was);
                    };
                    const collapse = e => { e.stopPropagation();
                        div.classList.remove('expanded'); };
                    div.addEventListener('click', expand);
                    closeBtn.addEventListener('click', collapse);
                    div.addEventListener('keydown', e => {
                        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault();
                            expand(e); }
                        if (e.key === 'Escape') div.classList.remove('expanded');
                    });
                    otherGrid.appendChild(div);
                });
                otherCount.textContent = otherItems.length + ' items';
            }

            /* ── player core ── */
            function loadTrack(index) {
                const track = tracks[index];
                if (!track) return;
                trackName.textContent = track.title;
                trackArtist.textContent = track.artist;
                npTitle.textContent = track.title;
                if (track.cover) {
                    coverImg.src = track.cover;
                    coverImg.style.display = 'block';
                    coverFallback.style.display = 'none';
                } else {
                    coverImg.style.display = 'none';
                    coverFallback.style.display = 'flex';
                }
                audio.src = track.src;
                audio.load();
                progressFill.style.width = '0%';
                currentTimeLabel.textContent = '0:00';
                totalTimeLabel.textContent = track.duration || '0:00';
                updatePlaylistUI();
                updateCoverState();
                npIndicator.className = isPlaying ? 'np-dots' : 'np-dots paused';
            }

            function updateCoverState() { coverWrapper.classList.toggle('is-playing', isPlaying && !!audio.src); }

            function updatePlaylistUI() {
                document.querySelectorAll('.pl-item').forEach((el, i) => {
                    el.classList.toggle('active', i === currentIndex);
                    const icon = el.querySelector('.pl-icon');
                    if (icon) {
                        const active = i === currentIndex && isPlaying;
                        icon.className = 'pl-icon' + (active ? ' playing' : '');
                        icon.innerHTML = `<i class="fas ${active ? 'fa-volume-high' : 'fa-play'}"></i>`;
                    }
                });
            }

            function updatePlayBtn() { playIcon.className = isPlaying ? 'fas fa-pause' : 'fas fa-play'; }

            function play() { audio.play().catch(() => {});
                isPlaying = true;
                updatePlayBtn();
                updatePlaylistUI();
                npIndicator.className = 'np-dots';
                updateCoverState(); }

            function pause() { audio.pause();
                isPlaying = false;
                updatePlayBtn();
                updatePlaylistUI();
                npIndicator.className = 'np-dots paused';
                updateCoverState(); }

            function togglePlay() { audio.paused ? play() : pause(); }

            function nextTrack() { currentIndex = (currentIndex + 1) % tracks.length;
                loadTrack(currentIndex); if (isPlaying) audio.play().catch(() => {}); else play();
                updateHash(); }

            function prevTrack() { currentIndex = (currentIndex - 1 + tracks.length) % tracks.length;
                loadTrack(currentIndex); if (isPlaying) audio.play().catch(() => {}); else play();
                updateHash(); }

            function updateHash() {
                const track = tracks[currentIndex];
                window.location.hash = track ? slug(track.title) : '';
            }

            function findTrackBySlug(s) { if (!s) return -1; return tracks.findIndex(t => slug(t.title) === s); }

            function handleHashChange() {
                const hash = window.location.hash.substring(1);
                if (!hash) return;
                const idx = findTrackBySlug(hash);
                if (idx >= 0 && idx !== currentIndex) {
                    currentIndex = idx;
                    loadTrack(currentIndex);
                    if (isPlaying) audio.play().catch(() => {});
                }
            }
            window.addEventListener('hashchange', handleHashChange);

            /* ── playlist render ── */
            function renderPlaylist() {
                playlistContainer.innerHTML = '';
                tracks.forEach((track, idx) => {
                    const item = document.createElement('div');
                    item.className = 'pl-item' + (idx === currentIndex ? ' active' : '');
                    item.dataset.index = idx;
                    item.setAttribute('role', 'button');
                    item.setAttribute('tabindex', '0');
                    const active = idx === currentIndex && isPlaying;
                    item.innerHTML =
                        `
                        <span class="idx">${String(idx+1).padStart(2,'0')}</span>
                        <div class="info"><span class="title">${track.title}</span><span class="artist">${track.artist}</span></div>
                        <span class="dur">${track.duration||'—'}</span>
                        <span class="pl-icon${active?' playing':''}"><i class="fas ${active?'fa-volume-high':'fa-play'}"></i></span>
                    `;
                    const handler = () => {
                        if (idx === currentIndex) { togglePlay(); } else {
                            currentIndex = idx;
                            loadTrack(currentIndex);
                            if (isPlaying) audio.play().catch(() => {});
                            else play();
                            updateHash();
                        }
                    };
                    item.addEventListener('click', handler);
                    item.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault();
                            handler(); } });
                    playlistContainer.appendChild(item);
                });
                trackCount.textContent = tracks.length + ' tracks';
            }

            /* ── copy link ── */
            function copyCurrentLink() {
                const track = tracks[currentIndex];
                if (!track) return;
                const url = window.location.href.split('#')[0] + '#' + slug(track.title);
                navigator.clipboard.writeText(url).then(() => {
                    const orig = copyLinkBtn.innerHTML;
                    copyLinkBtn.innerHTML = '<i class="fas fa-check"></i>';
                    setTimeout(() => { copyLinkBtn.innerHTML = orig; }, 1500);
                }).catch(() => alert('Could not copy link'));
            }

            /* ── volume ── */
            function updateVolumeIcon() {
                const v = parseFloat(volumeSlider.value);
                if (v === 0) volIcon.className = 'fas fa-volume-xmark';
                else if (v < 0.4) volIcon.className = 'fas fa-volume-low';
                else if (v < 0.7) volIcon.className = 'fas fa-volume-low';
                else volIcon.className = 'fas fa-volume-high';
            }

            function toggleMute() {
                const v = parseFloat(volumeSlider.value);
                if (v > 0) {
                    previousVolume = v;
                    volumeSlider.value = 0;
                    audio.volume = 0;
                } else {
                    const restore = previousVolume || 0.8;
                    volumeSlider.value = restore;
                    audio.volume = restore;
                }
                updateVolumeIcon();
            }

            function updateProgress() {
                if (isDragging) return;
                if (audio.duration && !isNaN(audio.duration)) {
                    const p = (audio.currentTime / audio.duration) * 100;
                    progressFill.style.width = Math.min(p, 100) + '%';
                    currentTimeLabel.textContent = fmt(audio.currentTime);
                    totalTimeLabel.textContent = fmt(audio.duration);
                }
            }

            /* ── seek ── */
            function seekFromClientX(clientX) {
                const rect = progressTrack.getBoundingClientRect();
                const x = Math.min(Math.max((clientX - rect.left) / rect.width, 0), 1);
                if (audio.duration) {
                    audio.currentTime = x * audio.duration;
                    progressFill.style.width = (x * 100) + '%';
                    currentTimeLabel.textContent = fmt(audio.currentTime);
                }
            }

            function seekMouse(e) { seekFromClientX(e.clientX); }

            function seekTouch(e) { if (e.touches.length) seekFromClientX(e.touches[0].clientX); }

            /* ── init player events ── */
            playBtn.addEventListener('click', togglePlay);
            prevBtn.addEventListener('click', prevTrack);
            nextBtn.addEventListener('click', nextTrack);
            volIconBtn.addEventListener('click', toggleMute);
            copyLinkBtn.addEventListener('click', copyCurrentLink);

            audio.addEventListener('timeupdate', updateProgress);
            audio.addEventListener('loadedmetadata', () => { totalTimeLabel.textContent = fmt(audio.duration); });
            audio.addEventListener('ended', nextTrack);
            audio.addEventListener('play', () => { isPlaying = true;
                updatePlayBtn();
                updatePlaylistUI();
                npIndicator.className = 'np-dots';
                updateCoverState(); });
            audio.addEventListener('pause', () => { isPlaying = false;
                updatePlayBtn();
                updatePlaylistUI();
                npIndicator.className = 'np-dots paused';
                updateCoverState(); });

            volumeSlider.addEventListener('input', () => { audio.volume = parseFloat(volumeSlider.value);
                updateVolumeIcon(); });

            progressTrack.addEventListener('mousedown', e => {
                if (!audio.duration) return;
                isDragging = true;
                wasPlayingBeforeDrag = !audio.paused;
                audio.pause();
                seekMouse(e);
            });
            document.addEventListener('mousemove', e => { if (isDragging) seekMouse(e); });
            document.addEventListener('mouseup', () => {
                if (isDragging) { isDragging = false; if (wasPlayingBeforeDrag) audio.play().catch(() => {}); }
            });

            progressTrack.addEventListener('touchstart', e => {
                if (!audio.duration) return;
                isDragging = true;
                wasPlayingBeforeDrag = !audio.paused;
                audio.pause();
                seekTouch(e);
            }, { passive: true });
            progressTrack.addEventListener('touchmove', e => { if (isDragging) seekTouch(e); }, { passive: true });
            progressTrack.addEventListener('touchend', () => {
                if (isDragging) { isDragging = false; if (wasPlayingBeforeDrag) audio.play().catch(() => {}); }
            }, { passive: true });

            /* ── keyboard shortcuts ── */
            document.addEventListener('keydown', e => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                if (e.code === 'Space') { e.preventDefault();
                    togglePlay(); }
                if (e.code === 'ArrowRight') { e.preventDefault();
                    nextTrack(); }
                if (e.code === 'ArrowLeft') { e.preventDefault();
                    prevTrack(); }
                if (e.key === 'm') { e.preventDefault();
                    toggleMute(); }
                if (e.key === 'Escape') {
                    document.querySelectorAll('.other-item.expanded').forEach(el => el.classList.remove('expanded'));
                }
            });

            document.addEventListener('scroll', () => {
                document.querySelectorAll('.other-item.expanded').forEach(el => el.classList.remove('expanded'));
            }, { passive: true });

            /* ── init ── */
            loadTheme();
            renderPlaylist();
            renderAnnouncements();
            renderOther();

            const initialHash = window.location.hash.substring(1);
            const startIdx = initialHash ? Math.max(findTrackBySlug(initialHash), 0) : 0;
            currentIndex = startIdx;
            loadTrack(currentIndex);
            if (initialHash && findTrackBySlug(initialHash) >= 0) updateHash();

            audio.volume = parseFloat(volumeSlider.value);
            updateVolumeIcon();
            npIndicator.className = 'np-dots paused';

            // ensure hub is active
            currentPage = 'hub';
            tabs.forEach(t => t.classList.toggle('active', t.dataset.page === 'hub'));
            Object.keys(panels).forEach(k => panels[k].classList.toggle('active', k === 'hub'));

        })();
    </script>
</body>
</html>
