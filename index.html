<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>SBPebbles · music hub</title>
    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&display=swap" rel="stylesheet" />
    <style>
        /* ── reset & base ── */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-base: #0f0d11;
            --bg-surface: rgba(22, 20, 26, 0.78);
            --bg-elevated: rgba(255, 255, 255, 0.04);
            --text-primary: #f2ede8;
            --text-secondary: #b4a89c;
            --text-muted: #73695f;
            --accent: #e8b48c;
            --accent-glow: rgba(232, 180, 140, 0.25);
            --border-subtle: rgba(255, 215, 185, 0.06);
            --border-strong: rgba(255, 215, 185, 0.14);
            --shadow-card: 0 20px 60px rgba(0, 0, 0, 0.8);
            --glass-backdrop: blur(18px);
            --radius-card: 32px;
            --radius-sm: 20px;
            --radius-full: 60px;
        }
        body {
            font-family: "Inter", system-ui, -apple-system, sans-serif;
            background: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            padding-top: 5.5rem;
            background-image: radial-gradient(circle at 20% 20%, #2a2228 0%, #0b090d 80%);
            background-attachment: fixed;
            transition: background 0.3s;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at 60% 10%, rgba(232, 180, 140, 0.06), transparent 60%);
        }

        /* ── floating top nav ── */
        .top-nav {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%) translateY(-150%);
            z-index: 2000;
            background: rgba(18, 16, 22, 0.82);
            backdrop-filter: var(--glass-backdrop);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-full);
            padding: 0.5rem 1.4rem;
            display: flex;
            gap: 0.3rem;
            transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s;
            opacity: 0;
            pointer-events: none;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
        }
        .top-nav.visible {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
            pointer-events: auto;
        }
        .top-nav .nav-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-family: inherit;
            font-weight: 500;
            font-size: 0.8rem;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.25s;
            cursor: pointer;
            letter-spacing: 0.01em;
        }
        .top-nav .nav-btn i {
            font-size: 0.8rem;
            transition: transform 0.2s;
        }
        .top-nav .nav-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }
        .top-nav .nav-btn.active {
            background: var(--accent);
            color: #0f0d11;
            box-shadow: 0 4px 20px var(--accent-glow);
        }
        .top-nav .nav-btn.active i {
            color: #0f0d11;
        }
        .nav-trigger-zone {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 70px;
            z-index: 1999;
            pointer-events: none;
        }
        @media (max-width: 720px) {
            .top-nav {
                transform: translateX(-50%) translateY(0) !important;
                opacity: 1 !important;
                pointer-events: auto !important;
                padding: 0.3rem 1rem;
                top: 6px;
            }
            .nav-trigger-zone {
                display: none;
            }
            body {
                padding-top: 4.5rem;
            }
        }

        /* ── slider container ── */
        .page-slider {
            width: 100%;
            max-width: 1100px;
            border-radius: var(--radius-card);
            overflow: hidden;
            box-shadow: var(--shadow-card), 0 0 0 1px var(--border-subtle);
            background: var(--bg-surface);
            backdrop-filter: var(--glass-backdrop);
            transition: box-shadow 0.3s;
        }
        .page-slider-inner {
            display: flex;
            width: 200%;
            transform: translateX(0%);
            transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .page-slider-inner.slide-announcements {
            transform: translateX(-50%);
        }
        .page-slide {
            width: 50%;
            flex-shrink: 0;
            padding: 2.8rem 2.8rem 2.2rem;
            min-height: 520px;
            position: relative;
        }
        .page-slide:first-child {
            border-radius: var(--radius-card) 0 0 var(--radius-card);
        }
        .page-slide:last-child {
            border-radius: 0 var(--radius-card) var(--radius-card) 0;
        }

        /* ── hub header ── */
        .hub-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            gap: 0.8rem 1.2rem;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .brand-icon {
            font-size: 2.2rem;
            color: var(--accent);
            filter: drop-shadow(0 0 14px var(--accent-glow));
        }
        .brand h1 {
            font-size: 1.9rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #fff 30%, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .social-links {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .social-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: all 0.25s;
            text-decoration: none;
        }
        .social-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-3px) scale(1.05);
            border-color: var(--accent);
            color: #fff;
            box-shadow: 0 8px 24px var(--accent-glow);
        }
        .tagline {
            font-size: 0.75rem;
            background: rgba(255, 255, 255, 0.04);
            padding: 0.3rem 1rem;
            border-radius: var(--radius-full);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }
        .tagline i {
            color: var(--accent);
            font-size: 0.65rem;
        }

        /* ── now playing strip ── */
        .now-playing-strip {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            background: rgba(255, 255, 255, 0.03);
            padding: 0.4rem 1.2rem 0.4rem 1rem;
            border-radius: var(--radius-full);
            border: 1px solid var(--border-subtle);
            backdrop-filter: blur(6px);
            margin-bottom: 1.6rem;
            transition: 0.2s;
        }
        .now-playing-strip .np-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            font-weight: 500;
        }
        .now-playing-strip .np-label i {
            margin-right: 0.2rem;
            color: var(--accent);
        }
        .np-title {
            font-weight: 500;
            font-size: 0.9rem;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .np-indicator {
            display: flex;
            gap: 0.2rem;
        }
        .np-indicator .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--accent);
            display: inline-block;
            animation: pulseDot 1.2s ease-in-out infinite;
        }
        .np-indicator .dot:nth-child(2) {
            animation-delay: 0.2s;
        }
        .np-indicator .dot:nth-child(3) {
            animation-delay: 0.4s;
        }
        .np-indicator.paused .dot {
            animation: none;
            opacity: 0.25;
        }
        @keyframes pulseDot {
            0%,
            100% {
                transform: scale(0.6);
                opacity: 0.3;
            }
            50% {
                transform: scale(1.3);
                opacity: 1;
            }
        }

        /* ── player grid ── */
        .player-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 2.2rem;
            align-items: flex-start;
        }
        .cover-wrapper {
            flex: 0 0 180px;
            width: 180px;
            height: 180px;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.7);
            background: #1e1a1f;
            position: relative;
            transition: transform 0.3s ease, box-shadow 0.3s;
        }
        .cover-wrapper:hover {
            transform: scale(1.02) translateY(-4px);
            box-shadow: 0 32px 64px -12px rgba(0, 0, 0, 0.8);
        }
        .cover-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .cover-fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1e1a1f;
            color: var(--accent);
            font-size: 3.6rem;
            opacity: 0.5;
        }
        .cover-wrapper .visualizer-ring {
            position: absolute;
            inset: -4px;
            border-radius: 32px;
            border: 2px solid transparent;
            transition: 0.4s;
            pointer-events: none;
        }
        .cover-wrapper.is-playing .visualizer-ring {
            border-color: var(--accent);
            animation: ringPulse 1.6s ease-in-out infinite;
        }
        @keyframes ringPulse {
            0%,
            100% {
                transform: scale(1);
                opacity: 0.3;
            }
            50% {
                transform: scale(1.04);
                opacity: 0.7;
            }
        }

        .controls-col {
            flex: 1;
            min-width: 220px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .track-info .track-name {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            line-height: 1.2;
        }
        .track-info .track-artist {
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        .playback-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .play-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            background: var(--accent);
            color: #0f0d11;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s;
            box-shadow: 0 8px 28px var(--accent-glow);
        }
        .play-btn:hover {
            transform: scale(1.06) translateY(-2px);
            box-shadow: 0 12px 36px var(--accent-glow);
        }
        .play-btn:active {
            transform: scale(0.92);
        }
        .secondary-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.1rem;
            padding: 0.4rem;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            transition: 0.2s;
            cursor: pointer;
        }
        .secondary-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }

        .volume-wrap {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin-left: auto;
        }
        .volume-wrap .vol-icon-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1rem;
            padding: 0.2rem;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            transition: 0.2s;
        }
        .volume-wrap .vol-icon-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }
        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 70px;
            height: 4px;
            border-radius: 4px;
            background: #2f292e;
            outline: none;
            transition: 0.2s;
            cursor: pointer;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 16px var(--accent-glow);
            cursor: pointer;
        }
        .volume-slider::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            box-shadow: 0 0 16px var(--accent-glow);
        }

        .progress-area {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .time-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            min-width: 40px;
            font-variant-numeric: tabular-nums;
        }
        .progress-track {
            flex: 1;
            height: 4px;
            border-radius: 8px;
            background: #2f292e;
            cursor: pointer;
            position: relative;
            transition: height 0.2s;
            min-height: 28px;
            display: flex;
            align-items: center;
        }
        .progress-track:hover {
            height: 7px;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            border-radius: 8px;
            background: linear-gradient(90deg, var(--accent), #dba07a);
            transition: width 0.08s linear;
            pointer-events: none;
        }
        .progress-fill::after {
            content: '';
            position: absolute;
            right: -8px;
            top: 50%;
            transform: translateY(-50%) scale(0);
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent);
            opacity: 0;
            transition: 0.2s;
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .progress-track:hover .progress-fill::after {
            opacity: 1;
            transform: translateY(-50%) scale(1);
        }

        /* ── playlist ── */
        .playlist-section {
            margin-top: 1.8rem;
            border-top: 1px solid var(--border-subtle);
            padding-top: 1.6rem;
        }
        .playlist-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.8rem;
        }
        .playlist-header h3 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .playlist-header .count {
            font-size: 0.7rem;
            background: rgba(255, 255, 255, 0.04);
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            color: var(--text-muted);
        }
        .playlist {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            max-height: 260px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .playlist::-webkit-scrollbar {
            width: 4px;
        }
        .playlist::-webkit-scrollbar-thumb {
            background: #3d353b;
            border-radius: 8px;
        }
        .playlist-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.6rem 0.8rem;
            border-radius: 16px;
            transition: all 0.2s;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .playlist-item:hover {
            background: rgba(255, 255, 255, 0.03);
            border-color: var(--border-subtle);
            transform: scale(0.98);
        }
        .playlist-item.active {
            background: rgba(232, 180, 140, 0.08);
            border-color: rgba(232, 180, 140, 0.15);
        }
        .playlist-item .idx {
            font-size: 0.7rem;
            color: var(--text-muted);
            min-width: 24px;
            text-align: center;
        }
        .playlist-item .pl-info {
            flex: 1;
            overflow: hidden;
        }
        .playlist-item .pl-title {
            font-weight: 500;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .playlist-item .pl-artist {
            font-size: 0.7rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .playlist-item .pl-duration {
            font-size: 0.75rem;
            color: var(--text-muted);
            min-width: 40px;
            text-align: right;
        }
        .playlist-item .pl-play-icon {
            color: var(--accent);
            font-size: 0.8rem;
            opacity: 0;
            transition: 0.2s;
        }
        .playlist-item.active .pl-play-icon,
        .playlist-item:hover .pl-play-icon {
            opacity: 1;
        }
        .playlist-item .pl-play-icon.playing {
            opacity: 1;
            animation: pulseIcon 1s infinite;
        }
        @keyframes pulseIcon {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.15);
            }
        }

        /* ── announcements ── */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.8rem;
        }
        .page-header h2 {
            font-size: 1.3rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .page-header h2 i {
            color: var(--accent);
        }
        .page-header .count {
            font-size: 0.7rem;
            background: rgba(255, 255, 255, 0.04);
            padding: 0.2rem 0.9rem;
            border-radius: 30px;
            color: var(--text-muted);
        }
        .announcements-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .announcement-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            padding: 1rem 1.4rem;
            transition: 0.25s;
            cursor: pointer;
        }
        .announcement-card:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: var(--border-strong);
        }
        .announcement-card.expanded {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--accent);
        }
        .card-summary {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .card-summary img {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            object-fit: cover;
            background: #1e1a1f;
            flex-shrink: 0;
        }
        .card-summary .info {
            flex: 1;
        }
        .card-summary .info h4 {
            font-weight: 600;
            font-size: 1rem;
        }
        .card-summary .info p {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        .card-summary .badge {
            font-size: 0.55rem;
            text-transform: uppercase;
            background: var(--accent);
            color: #0f0d11;
            padding: 0.15rem 0.7rem;
            border-radius: 30px;
            font-weight: 600;
        }
        .card-summary .expand-icon {
            color: var(--text-muted);
            transition: 0.3s;
        }
        .announcement-card.expanded .expand-icon {
            transform: rotate(180deg);
            color: var(--accent);
        }
        .card-details {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, padding 0.3s;
            padding: 0 0.2rem;
        }
        .announcement-card.expanded .card-details {
            max-height: 400px;
            padding: 1rem 0.2rem 0.2rem;
        }
        .detail-row {
            display: flex;
            gap: 1rem;
            padding: 0.3rem 0;
            border-top: 1px solid var(--border-subtle);
        }
        .detail-row:first-child {
            border-top: none;
        }
        .detail-label {
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--text-muted);
            min-width: 70px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .detail-value {
            font-size: 0.9rem;
            color: var(--text-primary);
        }
        .detail-value a {
            color: var(--accent);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: 0.2s;
        }
        .detail-value a:hover {
            border-bottom-color: var(--accent);
        }
        .detail-value .tag {
            display: inline-block;
            font-size: 0.65rem;
            background: rgba(232, 180, 140, 0.12);
            color: var(--accent);
            padding: 0.05rem 0.6rem;
            border-radius: 30px;
            margin-right: 0.2rem;
        }

        /* ── footer theme ── */
        .hub-footer {
            margin-top: 2.6rem;
            text-align: center;
            border-top: 1px solid var(--border-subtle);
            padding-top: 1.6rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
        }
        .footer-theme {
            display: flex;
            gap: 0.35rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .footer-theme .ft-label {
            font-size: 0.55rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.06em;
            margin-right: 0.2rem;
            align-self: center;
        }
        .theme-dot {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: 0.25s;
            background: var(--bg-base);
            flex-shrink: 0;
        }
        .theme-dot.active {
            border-color: var(--text-primary);
            transform: scale(1.1);
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .theme-dot[data-theme="dark"] {
            background: #0f0d11;
        }
        .theme-dot[data-theme="light"] {

                ],

            }, {

                releaseDate: 'August 1, 2026',

                ],
                tags: ['Single', 'Indie']

            // ─── DOM refs ──────────────────────────────────────────────
            const audio = document.getElementById('audioPlayer');

            const topNav = document.getElementById('topNav');

            // ─── THEME ──────────────────────────────────────────────────
            const themeDots = document.querySelectorAll('.theme-dot');
            const STORAGE_KEY = 'sbpebbles-theme';
            function setTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                themeDots.forEach(d => d.classList.toggle('active', d.dataset.theme === theme));
                try { localStorage.setItem(STORAGE_KEY, theme); } catch (_) {}
            }
            function loadTheme() {
                let theme = 'dark';
                try { const s = localStorage.getItem(STORAGE_KEY); if (s) theme = s; } catch (_) {}
                const valid = ['dark', 'light', 'turquoise', 'red', 'purple', 'green', 'ocean', 'sunset', 'rainbow', 'candy',
                    'forest', 'neon'
                ];
                if (!valid.includes(theme)) theme = 'dark';
                setTheme(theme);
            }
            themeDots.forEach(d => d.addEventListener('click', () => setTheme(d.dataset.theme)));

            // ─── NAV ──────────────────────────────────────────────────
            let navVisible = false;
            let navTimeout = null;

            function showNav() { if (!navVisible) { navVisible = true;
                    topNav.classList.add('visible'); } }

            function hideNav() { if (navVisible) { navVisible = false;
                    topNav.classList.remove('visible'); } }

            function isMobile() { return window.innerWidth <= 720; }
            document.addEventListener('mousemove', (e) => {
                if (isMobile()) return;
                if (e.clientY < 80) { showNav();
                    clearTimeout(navTimeout); } else if (navVisible) {
                    clearTimeout(navTimeout);
                    navTimeout = setTimeout(() => {
                        const r = topNav.getBoundingClientRect();
                        if (!(e.clientY >= r.top && e.clientY <= r.bottom && e.clientX >= r.left && e.clientX <= r
                                .right)) hideNav();
                    }, 400);
                }
            });
            document.addEventListener('click', (e) => {
                if (isMobile()) return;
                if (navVisible && !topNav.contains(e.target) && e.clientY > 80) {
                    clearTimeout(navTimeout);
                    navTimeout = setTimeout(hideNav, 300);
                }
            });
            if (!isMobile()) {
                setTimeout(() => { showNav();
                    setTimeout(hideNav, 1800); }, 400);
            } else {
                topNav.classList.add('visible');
            }

            // ─── PAGE SWITCH ──────────────────────────────────────────
            let currentPage = 'hub';

            function switchPage(pageId) {
                if (pageId === currentPage) return;
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.page === pageId));
                pageSlider.classList.toggle('slide-announcements', pageId === 'announcements');
                currentPage = pageId;
            }
            document.querySelectorAll('.nav-btn').forEach(b => b.addEventListener('click', () => switchPage(b.dataset.page)));

            // ─── RENDER ANNOUNCEMENTS ────────────────────────────────
            function renderAnnouncements() {
                announcementsContainer.innerHTML = '';
                ANNOUNCEMENTS.forEach((ann) => {
                    const card = document.createElement('div');
                    card.className = 'announcement-card';
                    card.setAttribute('role', 'button');
                    card.setAttribute('tabindex', '0');

                    const tagsHtml = ann.tags ? ann.tags.map(t => `<span class="tag">${t}</span>`).join(' ') : '';
                    const linksHtml = ann.links ? ann.links.map(l =>
                        `<a href="${l.url}" target="_blank" rel="noopener" onclick="event.stopPropagation();">${l.label}</a>`
                    ).join(' · ') : '';

                    card.innerHTML = `
                        <div class="card-summary">
                            <img src="${ann.cover}" alt="${ann.title}" loading="lazy" />
                            <div class="info">
                                <h4>${ann.title}</h4>
                                <p>${ann.description}</p>
                            </div>
                            <span class="badge">New</span>
                            <span class="expand-icon"><i class="fas fa-chevron-down"></i></span>
                        </div>
                        <div class="card-details">
                            ${ann.fullDescription ? `<div class="detail-row"><span class="detail-label">About</span><span class="detail-value">${ann.fullDescription}</span></div>` : ''}
                            ${ann.releaseDate ? `<div class="detail-row"><span class="detail-label">Released</span><span class="detail-value">${ann.releaseDate}</span></div>` : ''}
                            ${tagsHtml ? `<div class="detail-row"><span class="detail-label">Tags</span><span class="detail-value">${tagsHtml}</span></div>` : ''}
                            ${linksHtml ? `<div class="detail-row"><span class="detail-label">Links</span><span class="detail-value">${linksHtml}</span></div>` : ''}
                        </div>
                    `;
                    const toggle = (e) => {
                        if (e.target.closest('a')) return;
                        card.classList.toggle('expanded');
                    };
                    card.addEventListener('click', toggle);
                    card.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e
                            .preventDefault();
                            toggle(e); } });
                    announcementsContainer.appendChild(card);
                });
                announcementCount.textContent = `${ANNOUNCEMENTS.length} new`;
            }

            // ─── RENDER PLAYLIST ──────────────────────────────────────
            let currentIndex = 0,
                isPlaying = false,
                isDragging = false,
                wasPlayingBeforeDrag = false,
                previousVolume = 0.8;

            function renderPlaylist() {
                playlistContainer.innerHTML = '';
                TRACKS.forEach((track, idx) => {
                    const item = document.createElement('div');
                    item.className = `playlist-item ${idx === currentIndex ? 'active' : ''}`;
                    item.dataset.index = idx;
                    item.setAttribute('role', 'button');
                    item.setAttribute('tabindex', '0');
                    const isActive = idx === currentIndex;
                    item.innerHTML = `
                        <span class="idx">${String(idx+1).padStart(2,'0')}</span>
                        <div class="pl-info"><span class="pl-title">${track.title}</span><span class="pl-artist">${track.artist}</span></div>

                        <span class="pl-play-icon ${isActive && isPlaying ? 'playing' : ''}"><i class="fas ${isActive && isPlaying ? 'fa-volume-high' : 'fa-play'}"></i></span>

                        if (idx === currentIndex) { togglePlay(); } else { currentIndex = idx;
                            loadTrack(currentIndex); if (isPlaying) audio.play().catch(() => {}); else play(); }
                    };
                    item.addEventListener('click', handle);
                    item.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e
                            .preventDefault();
                            handle(); } });
                    playlistContainer.appendChild(item);
                });
                updateTrackCount();
            }

            function updateTrackCount() {
                const valid = TRACKS.filter(t => t.src && t.src !== 'https://s3.amazonaws.com');
                trackCount.textContent = `${valid.length} tracks`;
            }

            function loadTrack(index) {
                const track = TRACKS[index];
                if (!track) return;
                trackName.textContent = track.title;
                trackArtist.textContent = track.artist;
                npTitle.textContent = track.title;
                if (track.cover) { coverImg.src = track.cover;
                    coverImg.style.display = 'block';
                    coverFallback.style.display = 'none'; } else { coverImg.style.display = 'none';

                currentTimeLabel.textContent = '0:00';
                totalTimeLabel.textContent = track.duration || '0:00';

                    }
                });
                updateCoverPlayState();
                npIndicator.className = isPlaying ? 'np-indicator' : 'np-indicator paused';

                coverWrapper.classList.toggle('is-playing', isPlaying && audio.src && audio.src !== '');
            }

            function play() { audio.play().catch(() => {}); isPlaying = true;
                updatePlayButton();
                updatePlaylistIcons();
                npIndicator.className = 'np-indicator';
                updateCoverPlayState(); }

            function pause() { audio.pause(); isPlaying = false;
                updatePlayButton();
                updatePlaylistIcons();
                npIndicator.className = 'np-indicator paused';
                updateCoverPlayState(); }

            function togglePlay() { audio.paused ? play() : pause(); }

            function updatePlayButton() {
                playIcon.className = isPlaying ? 'fas fa-pause' : 'fas fa-play';
                playBtn.classList.toggle('is-playing', isPlaying);
            }

            function updatePlaylistIcons() {
                document.querySelectorAll('.playlist-item').forEach((el, i) => {
                    const icon = el.querySelector('.pl-play-icon');
                    if (icon) {
                        const active = i === currentIndex && isPlaying;
                        icon.className = `pl-play-icon ${active ? 'playing' : ''}`;
                        icon.innerHTML = `<i class="fas ${active ? 'fa-volume-high' : 'fa-play'}"></i>`;
                    }
                });
            }

            function formatTime(sec) { if (!sec || isNaN(sec)) return '0:00'; const m = Math.floor(sec / 60),
                    s = Math.floor(sec % 60); return `${m}:${s.toString().padStart(2,'0')}`; }

            function updateProgress() {
                if (isDragging) return;
                if (audio.duration && !isNaN(audio.duration)) {
                    const p = (audio.currentTime / audio.duration) * 100;
                    progressFill.style.width = `${Math.min(p,100)}%`;
                    currentTimeLabel.textContent = formatTime(audio.currentTime);
                    totalTimeLabel.textContent = formatTime(audio.duration);
                }
            }

            function updateVolumeIcon() {
                const v = parseFloat(volumeSlider.value);
                if (v === 0) volIcon.className = 'fas fa-volume-xmark';
                else if (v < 0.4) volIcon.className = 'fas fa-volume-low';
                else if (v < 0.7) volIcon.className = 'fas fa-volume-low';
                else volIcon.className = 'fas fa-volume-high';
            }

            function toggleMute() {
                const v = parseFloat(volumeSlider.value);
                if (v > 0) { previousVolume = v;
                    volumeSlider.value = 0;
                    audio.volume = 0;
                    updateVolumeIcon(); } else { volumeSlider.value = previousVolume || 0.8;
                    audio.volume = parseFloat(volumeSlider.value);
                    updateVolumeIcon(); }
            }

            function nextTrack() { const n = (currentIndex + 1) % TRACKS.length;
                currentIndex = n;
                loadTrack(currentIndex); if (isPlaying) audio.play().catch(() => {}); else play(); }

            function prevTrack() { const p = (currentIndex - 1 + TRACKS.length) % TRACKS.length;
                currentIndex = p;
                loadTrack(currentIndex); if (isPlaying) audio.play().catch(() => {}); else play(); }

            // ─── EVENT LISTENERS ──────────────────────────────────────
            playBtn.addEventListener('click', togglePlay);
            prevBtn.addEventListener('click', prevTrack);
            nextBtn.addEventListener('click', nextTrack);
            volIconBtn.addEventListener('click', toggleMute);
            audio.addEventListener('timeupdate', updateProgress);
            audio.addEventListener('loadedmetadata', () => { totalTimeLabel.textContent = formatTime(audio.duration); });
            audio.addEventListener('ended', nextTrack);
            audio.addEventListener('play', () => { isPlaying = true;
                updatePlayButton();
                updatePlaylistIcons();
                npIndicator.className = 'np-indicator';
                updateCoverPlayState(); });
            audio.addEventListener('pause', () => { isPlaying = false;
                updatePlayButton();
                updatePlaylistIcons();
                npIndicator.className = 'np-indicator paused';
                updateCoverPlayState(); });

            volumeSlider.addEventListener('input', () => { audio.volume = parseFloat(volumeSlider.value);
                updateVolumeIcon(); });

            progressTrack.addEventListener('mousedown', (e) => { if (!audio.duration) return;
                isDragging = true;
                wasPlayingBeforeDrag = !audio.paused;
                audio.pause();
                seekFromMouse(e); });
            document.addEventListener('mousemove', (e) => { if (isDragging) seekFromMouse(e); });
            document.addEventListener('mouseup', () => { if (isDragging) { isDragging = false; if (wasPlayingBeforeDrag)
                        audio.play().catch(() => {}); } });
            progressTrack.addEventListener('touchstart', (e) => { if (!audio.duration) return;
                isDragging = true;
                wasPlayingBeforeDrag = !audio.paused;
                audio.pause();
                seekFromTouch(e); }, { passive: true });
            progressTrack.addEventListener('touchmove', (e) => { if (isDragging) seekFromTouch(e); }, { passive: true });
            progressTrack.addEventListener('touchend', () => { if (isDragging) { isDragging = false; if (
                        wasPlayingBeforeDrag) audio.play().catch(() => {}); } }, { passive: true });

            function seekFromMouse(e) { const rect = progressTrack.getBoundingClientRect();
                const x = Math.min(Math.max((e.clientX - rect.left) / rect.width, 0), 1); if (audio.duration) { audio
                        .currentTime = x * audio.duration;
                    progressFill.style.width = `${x*100}%`;
                    currentTimeLabel.textContent = formatTime(audio.currentTime); } }

            function seekFromTouch(e) { const touch = e.touches[0]; const rect = progressTrack.getBoundingClientRect();
                const x = Math.min(Math.max((touch.clientX - rect.left) / rect.width, 0), 1); if (audio.duration) { audio
                        .currentTime = x * audio.duration;
                    progressFill.style.width = `${x*100}%`;
                    currentTimeLabel.textContent = formatTime(audio.currentTime); } }

            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT') return;
                if (e.code === 'Space') { e.preventDefault();
                    togglePlay(); }
                if (e.code === 'ArrowRight') { e.preventDefault();
                    nextTrack(); }
                if (e.code === 'ArrowLeft') { e.preventDefault();
                    prevTrack(); }
                if (e.key === 'm') { e.preventDefault();
                    toggleMute(); }
            });

            // ─── INIT ──────────────────────────────────────────────────
            loadTheme();
            renderPlaylist();
            renderAnnouncements();
            loadTrack(0);
            audio.volume = parseFloat(volumeSlider.value);
            updateVolumeIcon();
            npIndicator.className = 'np-indicator paused';
            // set initial page
            currentPage = 'hub';
            pageSlider.classList.remove('slide-announcements');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.page === 'hub'));

        })();
    </script>
</body>
</html>
