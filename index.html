        /* ═══════════════════════════════════════════════════════════════════
           RESET & BASE — with internal scrolling
           ═══════════════════════════════════════════════════════════════════ */

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            padding-top: 6rem;
            background-image: radial-gradient(circle at 20% 30%, var(--gradient-start) 0%, var(--gradient-end) 80%);
            background-attachment: fixed;
            transition: background 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.6s ease;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* subtle animated gradient overlay */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at 50% 0%, rgba(var(--accent-rgb), 0.04) 0%, transparent 70%);
            animation: ambientShift 14s ease-in-out infinite alternate;
            transition: opacity 0.8s ease, background 0.8s ease;
        }

        @keyframes ambientShift {
            0% {
                transform: translateX(-6%) scale(1);
                opacity: 0.5;
            }
            100% {
                transform: translateX(6%) scale(1.12);
                opacity: 1;
            }
        }

        /* ═══════════════════════════════════════════════════════════════════
           TOP NAVBAR — floating + slides from top on mouse proximity
           ═══════════════════════════════════════════════════════════════════ */

        .top-nav {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%) translateY(-120%);
            z-index: 2000;
            padding: 0.5rem 1.2rem;
            background: var(--nav-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 60px;
            box-shadow: 0 12px 48px var(--shadow-color), 0 0 0 1px var(--glass-border);
            transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease, background 0.6s ease, box-shadow 0.4s ease;
            opacity: 0;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
            max-width: 96%;
            width: auto;
            min-width: 280px;
        }

        .top-nav.visible {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        .top-nav .nav-brand {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-primary);
            flex-shrink: 0;
        }

        .top-nav .nav-brand i {
            color: var(--accent);
            font-size: 1rem;
            transition: transform 0.4s ease;
        }

        .top-nav .nav-brand:hover i {
            transform: rotate(-12deg) scale(1.1);
        }

        .top-nav .nav-links {
            display: flex;
            align-items: center;
            gap: 0.2rem;
            flex-wrap: wrap;
        }

        .top-nav .nav-btn {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.35rem 1rem;
            border-radius: 40px;
            font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 0.78rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            background: transparent;
            border: none;
            cursor: pointer;
            white-space: nowrap;
            letter-spacing: 0.01em;
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }

        .top-nav .nav-btn i {
            font-size: 0.78rem;
            transition: transform 0.3s ease;
        }

        .top-nav .nav-btn:hover {
            color: var(--text-primary);
            background: var(--nav-btn-hover);
            transform: translateY(-1px);
        }

        .top-nav .nav-btn:hover i {
            transform: scale(1.1) rotate(-4deg);
        }

        .top-nav .nav-btn:active {
            transform: scale(0.94);
        }

        .top-nav .nav-btn.active {
            color: var(--nav-btn-active-text);
            background: var(--nav-btn-active);
            box-shadow: 0 4px 20px var(--accent-glow);
            transform: translateY(0);
        }

        .top-nav .nav-btn.active i {
            color: var(--nav-btn-active-text);
        }

        .top-nav .nav-btn.active:hover {
            box-shadow: 0 6px 28px var(--accent-glow-strong);
            transform: scale(1.02) translateY(-1px);
        }

        .top-nav .nav-actions {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        /* ─── theme toggle removed from nav ─── */

        /* proximity trigger zone */
        .nav-trigger-zone {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 70px;
            z-index: 1999;
            pointer-events: none;
            background: transparent;
        }

        .nav-trigger-zone.active {
            pointer-events: auto;
        }

        /* ═══════════════════════════════════════════════════════════════════
           PAGE SLIDE CONTAINER — scrollable
           ═══════════════════════════════════════════════════════════════════ */

        .page-slider {
            position: relative;
            width: 100%;
            max-width: 1000px;
            max-height: calc(100vh - 6rem - 2.5rem);
            overflow-y: auto;
            overflow-x: hidden;
            border-radius: 3rem;
            box-shadow: var(--shadow-elevation), 0 0 0 1px var(--glass-border);
            transition: box-shadow 0.6s ease, border-radius 0.4s ease;
            margin-top: 0.5rem;
            scroll-behavior: smooth;
        }

        .page-slider::-webkit-scrollbar {
            width: 5px;
        }
        .page-slider::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
            border-radius: 10px;
        }
        .page-slider::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 10px;
            transition: background 0.3s ease;
        }
        .page-slider::-webkit-scrollbar-thumb:hover {
            background: var(--scrollbar-thumb-hover);
        }

        .page-slider-inner {
            display: flex;
            width: 200%;
            transform: translateX(0%);
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .page-slider-inner.slide-announcements {
            transform: translateX(-50%);
        }

        .page-slide {
            width: 50%;
            flex-shrink: 0;
            padding: 2.5rem 2.5rem 2.2rem;
            background: var(--bg-surface);
            backdrop-filter: blur(var(--backdrop-blur));
            -webkit-backdrop-filter: blur(var(--backdrop-blur));
            border-radius: 3rem;
            transition: background 0.6s ease, padding 0.4s ease;
            min-height: 500px;
            position: relative;
        }

        .page-slide::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 3rem;
            padding: 1px;
            background: linear-gradient(135deg, var(--border-color), transparent 60%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0.4;
            transition: opacity 0.6s ease;
        }

        .page-slide:hover::before {
            opacity: 1;
        }

        .page-slide:first-child {
            border-radius: 3rem 0 0 3rem;
        }
        .page-slide:last-child {
            border-radius: 0 3rem 3rem 0;
        }

        .page-slide .slide-header {
            display: none;
        }

        /* ═══════════════════════════════════════════════════════════════════
           HUB SECTION (inside slide)
           ═══════════════════════════════════════════════════════════════════ */

        .hub-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2.2rem;
            gap: 0.75rem 1rem;
            position: relative;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            flex-shrink: 0;
        }

        .brand-icon {
            font-size: 2rem;
            color: var(--accent);
            filter: drop-shadow(0 0 12px var(--accent-glow));
            transition: filter 0.4s ease, transform 0.4s ease;
            animation: brandPulse 3s ease-in-out infinite;
        }

        @keyframes brandPulse {
            0%,
            100% {
                filter: drop-shadow(0 0 12px var(--accent-glow));
            }
            50% {
                filter: drop-shadow(0 0 28px var(--accent-glow-strong));
            }
        }

        .brand:hover .brand-icon {
            transform: rotate(-8deg) scale(1.05);
            filter: drop-shadow(0 0 36px var(--accent-glow-strong));
        }

        .brand h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent) 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            transition: background 0.6s ease;
        }

        /* ─── Theme switcher moved to footer ─── */

        /* ─── Social Links ── */
        .social-links {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            flex-wrap: wrap;
            justify-content: center;
            flex: 1 1 auto;
            padding: 0 0.3rem;
            transition: gap 0.3s ease;
        }

        .social-links:hover {
            gap: 0.7rem;
        }

        .social-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--bg-elevated);
            border: 1px solid var(--social-border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            font-size: 1rem;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            flex-shrink: 0;
            position: relative;
            -webkit-tap-highlight-color: transparent;
        }

        .social-btn i {
            font-size: 1.05rem;
            transition: transform 0.3s ease;
        }

        .social-btn:hover {
            transform: scale(1.18) translateY(-3px);
            background: var(--social-hover-bg);
            border-color: var(--border-strong);
            box-shadow: 0 0 36px var(--accent-glow);
        }

        .social-btn:hover i {
            transform: scale(1.08) rotate(-4deg);
        }

        .social-btn:active {
            transform: scale(0.85);
        }

        .social-btn.youtube:hover {
            border-color: #ff0000;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.15);
        }
        .social-btn.bandcamp:hover {
            border-color: #629aa9;
            box-shadow: 0 0 30px rgba(98, 154, 169, 0.15);
        }
        .social-btn.spotify:hover {
            border-color: #1db954;
            box-shadow: 0 0 30px rgba(29, 185, 84, 0.15);
        }
        .social-btn.tiktok:hover {
            border-color: #00f2ea;
            box-shadow: 0 0 30px rgba(0, 242, 234, 0.15);
        }
        .social-btn.discord:hover {
            border-color: #5865F2;
            box-shadow: 0 0 30px rgba(88, 101, 242, 0.15);
        }

        /* ── Tagline ── */
        .tagline {
            font-size: 0.8rem;
            font-weight: 400;
            color: var(--text-secondary);
            background: var(--bg-elevated);
            padding: 0.4rem 1rem;
            border-radius: 40px;
            border: 1px solid var(--border-color);
            letter-spacing: 0.01em;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .tagline i {
            color: var(--accent);
            font-size: 0.7rem;
            animation: taglinePulse 2s ease-in-out infinite;
        }

        @keyframes taglinePulse {
            0%,
            100% {
                opacity: 0.6;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.12);
            }
        }

        .tagline:hover {
            border-color: var(--border-strong);
            transform: translateY(-2px);
        }

        /* ═══════════════════════════════════════════════════════════════════
           NOW PLAYING STRIP
           ═══════════════════════════════════════════════════════════════════ */

        .now-playing-strip {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: var(--now-playing-bg);
            padding: 0.5rem 1.2rem 0.5rem 1rem;
            border-radius: 60px;
            border: 1px solid var(--border-color);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: default;
        }

        .now-playing-strip:hover {
            border-color: var(--border-strong);
            background: var(--hover-item-bg);
            transform: translateY(-1px);
            box-shadow: var(--elevation-1);
        }

        .now-playing-strip .np-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.2rem;
        }

        .now-playing-strip .np-label i {
            font-size: 0.5rem;
            color: var(--accent);
            transition: transform 0.3s ease;
        }

        .now-playing-strip:hover .np-label i {
            transform: scale(1.2);
        }

        .now-playing-strip .np-title {
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--text-primary);
            max-width: 180px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color 0.3s ease;
        }

        .now-playing-strip .np-title .placeholder-track {
            color: var(--placeholder-color);
            font-style: italic;
        }

        .np-indicator {
            display: flex;
            align-items: center;
            gap: 0.15rem;
            flex-shrink: 0;
            margin-left: auto;
        }

        .np-indicator .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--np-dot);
            display: inline-block;
            animation: pulseDot 1.2s ease-in-out infinite;
            transition: background 0.4s ease, transform 0.3s ease;
        }

        .np-indicator .dot:nth-child(2) {
            animation-delay: 0.2s;
        }
        .np-indicator .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes pulseDot {
            0%,
            100% {
                opacity: 0.2;
                transform: scale(0.6);
            }
            50% {
                opacity: 1;
                transform: scale(1.3);
            }
        }

        .np-indicator.paused .dot {
            animation: none;
            opacity: 0.2;
            transform: scale(0.6);
        }

        /* ═══════════════════════════════════════════════════════════════════
           PLAYER
           ═══════════════════════════════════════════════════════════════════ */

        .player-section {
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
        }

        .player-top {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            align-items: center;
        }

        /* ── Cover Art ── */
        .cover-wrapper {
            flex: 0 0 180px;
            width: 180px;
            height: 180px;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 20px 48px -12px var(--cover-shadow), 0 0 0 1px var(--border-color);
            background: var(--bg-secondary);
            position: relative;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .cover-wrapper::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 28px;
            background: linear-gradient(135deg, transparent 40%, rgba(var(--accent-rgb), 0.07) 100%);
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .cover-wrapper:hover {
            transform: scale(1.03) translateY(-6px) rotate(1deg);
            box-shadow: 0 32px 64px -12px var(--cover-shadow), 0 0 0 1px var(--border-strong);
        }

        .cover-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .cover-wrapper:hover img {
            transform: scale(1.06);
        }

        .cover-fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-secondary);
            color: var(--accent);
            font-size: 4rem;
            opacity: 0.6;
            transition: opacity 0.4s ease;
        }

        .cover-fallback i {
            animation: fallbackPulse 3s ease-in-out infinite;
        }

        @keyframes fallbackPulse {
            0%,
            100% {
                opacity: 0.4;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.06);
            }
        }

        /* visualizer ring on cover */
        .cover-wrapper .visualizer-ring {
            position: absolute;
            inset: -6px;
            border-radius: 32px;
            border: 2px solid transparent;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        .cover-wrapper.is-playing .visualizer-ring {
            opacity: 1;
            border-color: var(--accent);
            animation: ringPulse 1.5s ease-in-out infinite;
        }

        @keyframes ringPulse {
            0%,
            100% {
                transform: scale(1);
                opacity: 0.3;
            }
            50% {
                transform: scale(1.04);
                opacity: 0.8;
            }
        }

        /* ── Controls Column ── */
        .controls-col {
            flex: 1;
            min-width: 220px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .track-info {
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
        }

        .track-info .track-name {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--text-primary);
            line-height: 1.2;
            transition: color 0.3s ease;
        }

        .track-info .track-artist {
            font-size: 1rem;
            font-weight: 400;
            color: var(--text-secondary);
            transition: color 0.3s ease;
        }

        /* ── Playback Controls ── */
        .playback-controls {
            display: flex;
            align-items: center;
            gap: 1.25rem;
            margin: 0.2rem 0 0.1rem;
        }

        .play-btn {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            border: none;
            background: var(--badge-bg);
            color: var(--badge-text);
            font-size: 1.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 8px 32px var(--accent-glow);
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
            position: relative;
            overflow: hidden;
        }

        .play-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle at center, rgba(255, 255, 255, 0.2) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .play-btn:hover::before {
            opacity: 1;
        }

        .play-btn:hover {
            transform: scale(1.07) translateY(-3px);
            box-shadow: 0 14px 44px var(--accent-glow-strong);
        }

        .play-btn:active {
            transform: scale(0.90);
            box-shadow: 0 4px 16px var(--accent-glow);
        }

        .play-btn i {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            transition: transform 0.35s ease;
            position: relative;
            z-index: 1;
        }

        .play-btn:hover i {
            transform: scale(1.06);
        }

        .play-btn .fa-play {
            margin-left: 3px;
        }
        .play-btn .fa-pause {
            margin-left: 0;
        }
        .play-btn.is-playing .fa-pause {
            margin-left: 0;
        }

        .secondary-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            padding: 0.4rem;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }

        .secondary-btn:hover {
            color: var(--text-primary);
            background: var(--bg-elevated);
            transform: scale(1.1) translateY(-2px);
        }

        .secondary-btn:active {
            transform: scale(0.85);
        }

        .secondary-btn i {
            transition: transform 0.3s ease;
        }

        .secondary-btn:hover i {
            transform: scale(1.12);
        }

        .volume-wrap {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-left: auto;
        }

        .volume-wrap .vol-icon-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 0.2rem;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            -webkit-tap-highlight-color: transparent;
        }

        .volume-wrap .vol-icon-btn:hover {
            color: var(--text-primary);
            background: var(--bg-elevated);
            transform: scale(1.12);
        }

        .volume-wrap .vol-icon-btn:active {
            transform: scale(0.85);
        }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 70px;
            height: 4px;
            border-radius: 4px;
            background: var(--progress-track);
            outline: none;
            transition: background 0.3s ease, height 0.25s ease, width 0.3s ease;
            touch-action: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--thumb-color);
            cursor: pointer;
            box-shadow: 0 0 14px var(--thumb-glow);
            transition: all 0.25s ease;
            touch-action: none;
        }

        .volume-slider::-webkit-slider-thumb:hover {
            transform: scale(1.18);
        }

        .volume-slider::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--thumb-color);
            cursor: pointer;
            border: none;
            box-shadow: 0 0 14px var(--thumb-glow);
            touch-action: none;
        }

        .volume-slider:hover {
            height: 6px;
        }

        /* ── Progress Bar ── */
        .progress-area {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-top: 0.2rem;
        }

        .time-label {
            font-size: 0.8rem;
            font-weight: 400;
            color: var(--text-secondary);
            min-width: 44px;
            font-variant-numeric: tabular-nums;
            transition: color 0.3s ease;
        }

        .progress-track {
            flex: 1;
            height: 4px;
            border-radius: 8px;
            background: var(--progress-track);
            cursor: pointer;
            position: relative;
            transition: height 0.25s ease, background 0.3s ease;
            touch-action: none;
            min-height: 28px;
            display: flex;
            align-items: center;
        }

        .progress-track:hover {
            height: 8px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            border-radius: 8px;
            background: var(--progress-fill);
            transition: width 0.08s linear, background 0.5s ease;
            position: relative;
            pointer-events: none;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            right: -10px;
            top: 50%;
            transform: translateY(-50%) scale(0);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--thumb-color);
            opacity: 0;
            transition: opacity 0.25s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s ease;
            box-shadow: 0 0 24px var(--thumb-glow);
        }

        .progress-track:hover .progress-fill::after,
        .progress-track:active .progress-fill::after {
            opacity: 1;
            transform: translateY(-50%) scale(1);
        }

        .progress-track:active .progress-fill::after {
            transform: translateY(-50%) scale(1.15);
        }

        /* ═══════════════════════════════════════════════════════════════════
           PLAYLIST
           ═══════════════════════════════════════════════════════════════════ */

        .playlist-section {
            margin-top: 0.8rem;
            border-top: 1px solid var(--separator);
            padding-top: 1.5rem;
            transition: border-color 0.4s ease;
        }

        .playlist-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .playlist-header h3 {
            font-size: 0.9rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: color 0.3s ease;
        }

        .playlist-header h3 i {
            color: var(--text-muted);
            transition: color 0.3s ease;
        }

        .playlist-header .count {
            font-size: 0.75rem;
            color: var(--text-muted);
            background: var(--bg-elevated);
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            transition: all 0.3s ease;
        }

        .playlist {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            max-height: 260px;
            overflow-y: auto;
            padding-right: 2px;
            -webkit-overflow-scrolling: touch;
        }

        .playlist::-webkit-scrollbar {
            width: 4px;
        }
        .playlist::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
        }
        .playlist::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 8px;
            transition: background 0.3s ease;
        }
        .playlist::-webkit-scrollbar-thumb:hover {
            background: var(--scrollbar-thumb-hover);
        }

        .playlist-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.7rem 1rem;
            border-radius: 16px;
            background: transparent;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            border: 1px solid transparent;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            position: relative;
        }

        .playlist-item::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 16px;
            background: var(--hover-item-bg);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .playlist-item:hover::before {
            opacity: 1;
        }

        .playlist-item:hover {
            transform: translateX(5px);
            border-color: var(--border-color);
        }

        .playlist-item:active {
            transform: scale(0.97);
        }

        .playlist-item.active {
            background: var(--active-item-bg);
            border-color: var(--active-item-border);
            transform: translateX(0);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .playlist-item.active::before {
            opacity: 0;
        }

        .playlist-item .idx {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-muted);
            min-width: 24px;
            text-align: center;
            transition: color 0.3s ease;
            position: relative;
            z-index: 1;
        }

        .playlist-item.active .idx {
            color: var(--accent);
        }

        .playlist-item .pl-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.05rem;
            overflow: hidden;
            position: relative;
            z-index: 1;
        }

        .playlist-item .pl-title {
            font-weight: 500;
            font-size: 0.95rem;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color 0.3s ease;
        }

        .playlist-item.active .pl-title {
            color: var(--accent);
        }

        .playlist-item .pl-artist {
            font-size: 0.8rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color 0.3s ease;
        }

        .playlist-item .pl-duration {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            min-width: 44px;
            text-align: right;
            transition: color 0.3s ease;
            position: relative;
            z-index: 1;
        }

        .playlist-item .pl-play-icon {
            color: var(--accent);
            font-size: 0.9rem;
            opacity: 0;
            transition: all 0.35s ease;
            min-width: 20px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .playlist-item.active .pl-play-icon,
        .playlist-item:hover .pl-play-icon {
            opacity: 1;
        }

        .playlist-item .pl-play-icon.playing {
            opacity: 1;
            color: var(--accent);
            animation: playingPulse 1.2s ease-in-out infinite;
        }

        @keyframes playingPulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.18);
            }
        }

        /* ═══════════════════════════════════════════════════════════════════
           ANNOUNCEMENTS (inside slide)
           ═══════════════════════════════════════════════════════════════════ */

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }

        .page-header h2 {
            font-size: 1.3rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.3s ease;
        }

        .page-header h2 i {
            color: var(--accent);
            transition: color 0.3s ease;
        }

        .page-header .count {
            font-size: 0.75rem;
            color: var(--text-muted);
            background: var(--bg-elevated);
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            transition: all 0.3s ease;
        }

        .announcements-list {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .announcement-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .announcement-card:hover {
            background: var(--card-hover);
            border-color: var(--border-strong);
            transform: translateY(-3px);
            box-shadow: var(--elevation-2);
        }

        .announcement-card:active {
            transform: scale(0.98);
        }

        .announcement-card.expanded {
            background: var(--card-expanded);
            border-color: var(--border-strong);
            transform: translateY(0);
            box-shadow: var(--elevation-3);
        }

        .card-summary {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            padding: 0.8rem 1.2rem;
        }

        .card-summary img {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            object-fit: cover;
            background: var(--bg-secondary);
            flex-shrink: 0;
            box-shadow: 0 4px 14px var(--shadow-light);
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .announcement-card:hover .card-summary img {
            transform: scale(1.06) rotate(-2deg);
        }

        .card-summary .info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
            min-width: 0;
        }

        .card-summary .info h4 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color 0.3s ease;
        }

        .announcement-card:hover .card-summary .info h4 {
            color: var(--accent);
        }

        .card-summary .info p {
            font-size: 0.85rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color 0.3s ease;
        }

        .card-summary .badge {
            font-size: 0.6rem;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.06em;
            background: var(--badge-bg);
            color: var(--badge-text);
            padding: 0.2rem 0.7rem;
            border-radius: 30px;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .card-summary .expand-icon {
            color: var(--text-muted);
            font-size: 0.9rem;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            flex-shrink: 0;
            margin-left: 0.2rem;
        }

        .announcement-card.expanded .expand-icon {
            transform: rotate(180deg);
            color: var(--accent);
        }

        .card-details {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.55s cubic-bezier(0.34, 1.56, 0.64, 1), padding 0.4s ease, opacity 0.4s ease;
            opacity: 0;
            padding: 0 1.2rem;
        }

        .announcement-card.expanded .card-details {
            max-height: 400px;
            opacity: 1;
            padding: 0 1.2rem 1.2rem 1.2rem;
        }

        .card-details .detail-row {
            display: flex;
            align-items: flex-start;
            gap: 0.8rem;
            padding: 0.4rem 0;
            border-top: 1px solid var(--separator);
            transition: border-color 0.3s ease;
        }

        .card-details .detail-row:first-child {
            border-top: none;
        }

        .card-details .detail-label {
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            min-width: 80px;
            flex-shrink: 0;
            transition: color 0.3s ease;
        }

        .card-details .detail-value {
            font-size: 0.9rem;
            color: var(--text-primary);
            line-height: 1.5;
            word-break: break-word;
            transition: color 0.3s ease;
        }

        .card-details .detail-value a {
            color: var(--link-color);
            text-decoration: none;
            transition: all 0.3s ease;
            border-bottom: 1px solid transparent;
        }

        .card-details .detail-value a:hover {
            color: var(--link-hover);
            border-bottom-color: var(--link-hover);
        }

        .card-details .detail-value .tag {
            display: inline-block;
            font-size: 0.7rem;
            background: var(--tag-bg);
            color: var(--tag-text);
            padding: 0.1rem 0.6rem;
            border-radius: 20px;
            margin-right: 0.3rem;
            transition: all 0.3s ease;
        }

        /* ═══════════════════════════════════════════════════════════════════
           FOOTER — with theme switcher centered
           ═══════════════════════════════════════════════════════════════════ */

        .hub-footer {
            margin-top: 2.2rem;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 0.02em;
            border-top: 1px solid var(--footer-border);
            padding-top: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
            transition: all 0.4s ease;
        }

        .hub-footer .footer-theme {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .hub-footer .footer-theme .ft-label {
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            font-weight: 500;
            opacity: 0.5;
            margin-right: 0.1rem;
        }

        .hub-footer .footer-theme .theme-dot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        .hub-footer .footer-theme .theme-dot::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .hub-footer .footer-theme .theme-dot:hover {
            transform: scale(1.18);
            box-shadow: 0 0 24px var(--accent-glow);
        }

        .hub-footer .footer-theme .theme-dot:active {
            transform: scale(0.85);
        }

        .hub-footer .footer-theme .theme-dot.active {
            border-color: var(--text-primary);
            box-shadow: 0 0 28px var(--accent-glow);
            transform: scale(1.08);
        }

        .hub-footer .footer-theme .theme-dot.active::after {
            border-color: var(--text-primary);
            opacity: 0.4;
        }

        .hub-footer .footer-theme .theme-dot[data-theme="dark"] {
            background: #0b0a0c;
            border-color: rgba(255, 255, 255, 0.15);
        }
        .hub-footer .footer-theme .theme-dot[data-theme="dark"].active {
            border-color: #f5b58a;
        }

        .hub-footer .footer-theme .theme-dot[data-theme="light"] {
            background: #f5f0eb;
            border-color: rgba(0, 0, 0, 0.1);
        }
        .hub-footer .footer-theme .theme-dot[data-theme="light"].active {
            border-color: #d4835a;
        }

        .hub-footer .footer-theme .theme-dot[data-theme="turquoise"] {
            background: #5fc8c8;
            border-color: rgba(95, 200, 200, 0.3);
        }
        .hub-footer .footer-theme .theme-dot[data-theme="turquoise"].active {
            border-color: #5fc8c8;
        }

        .hub-footer .footer-theme .theme-dot[data-theme="red"] {
            background: #d45a5a;
            border-color: rgba(212, 90, 90, 0.3);
        }
        .hub-footer .footer-theme .theme-dot[data-theme="red"].active {
            border-color: #d45a5a;
        }

        .hub-footer .footer-theme .theme-dot[data-theme="purple"] {
            background: #8b5cf6;
            border-color: rgba(139, 92, 246, 0.3);
        }
        .hub-footer .footer-theme .theme-dot[data-theme="purple"].active {
            border-color: #8b5cf6;
        }

        .hub-footer .footer-theme .theme-dot[data-theme="green"] {
            background: #34d399;
            border-color: rgba(52, 211, 153, 0.3);
        }
        .hub-footer .footer-theme .theme-dot[data-theme="green"].active {
            border-color: #34d399;
        }

        .hub-footer .footer-theme .theme-dot[data-theme="ocean"] {
            background: #3b82f6;
            border-color: rgba(59, 130, 246, 0.3);
        }
        .hub-footer .footer-theme .theme-dot[data-theme="ocean"].active {
            border-color: #3b82f6;
        }

        .hub-footer .footer-theme .theme-dot[data-theme="sunset"] {
            background: #f59e0b;
            border-color: rgba(245, 158, 11, 0.3);
        }
        .hub-footer .footer-theme .theme-dot[data-theme="sunset"].active {
            border-color: #f59e0b;
        }

        .hub-footer .footer-theme .theme-dot[data-theme="rainbow"] {
            background: linear-gradient(135deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff, #9b59b6);
            background-size: 300% 300%;
            animation: rainbowGradient 3s ease infinite;
            border-color: rgba(255, 255, 255, 0.2);
        }
        .hub-footer .footer-theme .theme-dot[data-theme="rainbow"].active {
            border-color: #fff;
            box-shadow: 0 0 24px rgba(255, 107, 107, 0.5);
        }

        .hub-footer .footer-copy {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 0.5rem 1.2rem;
            width: 100%;
        }

        .hub-footer .footer-copy span {
            transition: color 0.3s ease;
        }

        /* ═══════════════════════════════════════════════════════════════════
           UTILITY
           ═══════════════════════════════════════════════════════════════════ */

        .hidden {
            display: none !important;
        }

        .section-spacer {
            height: 2rem;
            width: 100%;
        }

        /* ═══════════════════════════════════════════════════════════════════
           FOCUS VISIBLE
           ═══════════════════════════════════════════════════════════════════ */

        .nav-btn:focus-visible,
        .social-btn:focus-visible,
        .play-btn:focus-visible,
        .secondary-btn:focus-visible,
        .playlist-item:focus-visible,
        .announcement-card:focus-visible,
        .theme-dot:focus-visible,
        .vol-icon-btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        /* ═══════════════════════════════════════════════════════════════════
           REDUCED MOTION
           ═══════════════════════════════════════════════════════════════════ */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            .np-indicator .dot {
                animation: none !important;
            }
            .brand-icon {
                animation: none !important;
            }
            .tagline i {
                animation: none !important;
            }
            .cover-fallback i {
                animation: none !important;
            }
            .playlist-item .pl-play-icon.playing {
                animation: none !important;
            }
            body::before {
                animation: none !important;
            }
            .top-nav {
                transition: none !important;
            }
            .page-slider-inner {
                transition: none !important;
            }
            [data-theme="rainbow"] .nav-btn.active,
            [data-theme="rainbow"] .play-btn,
            [data-theme="rainbow"] .progress-fill,
            [data-theme="rainbow"] .badge-bg,
            [data-theme="rainbow"] .brand-icon {
                animation: none !important;
            }
            .theme-dot[data-theme="rainbow"] {
                animation: none !important;
            }
            .cover-wrapper .visualizer-ring {
                animation: none !important;
            }
            .cover-wrapper.is-playing .visualizer-ring {
                animation: none !important;
            }
        }

                navVisible = false;
                topNav.classList.remove('visible');
                navTriggerZone.classList.remove('active');
            }

            // mouse proximity detection
            document.addEventListener('mousemove', (e) => {
                if (e.clientY < 80) {
                    showNav();
                    clearTimeout(navTimeout);
                } else if (navVisible) {
                    clearTimeout(navTimeout);
                    navTimeout = setTimeout(() => {
                        const rect = topNav.getBoundingClientRect();
                        const isOverNav = e.clientY >= rect.top && e.clientY <= rect.bottom &&
                            e.clientX >= rect.left && e.clientX <= rect.right;
                        if (!isOverNav) {
                            hideNav();
                        }
                    }, 400);
                }
            });

            let touchStartY = 0;
            document.addEventListener('touchstart', (e) => {
                touchStartY = e.touches[0].clientY;
                if (touchStartY < 80) {
                    showNav();
                }
            }, { passive: true });

            document.addEventListener('touchmove', (e) => {
                const y = e.touches[0].clientY;
                if (y < 80) {
                    showNav();
                } else if (navVisible && y > 120) {
                    clearTimeout(navTimeout);
                    navTimeout = setTimeout(hideNav, 500);
                }
            }, { passive: true });

            document.addEventListener('click', (e) => {
                if (navVisible && !topNav.contains(e.target) && !navTriggerZone.contains(e.target)) {
                    if (e.clientY > 80) {
                        clearTimeout(navTimeout);
                        navTimeout = setTimeout(hideNav, 300);
                    }
                }
            });

            // ─── RENDER ANNOUNCEMENTS ────────────────────────────────────
            function renderAnnouncements() {
                announcementsContainer.innerHTML = '';
                ANNOUNCEMENTS.forEach((ann) => {
                    const card = document.createElement('div');
                    card.className = 'announcement-card';
                    card.setAttribute('role', 'button');
                    card.setAttribute('tabindex', '0');
                    card.setAttribute('aria-expanded', 'false');

                    const tagsHtml = ann.tags ? ann.tags.map(t => `<span class="tag">${t}</span>`).join(' ') : '';
                    const linksHtml = ann.links ? ann.links.map(l =>
                        `<a href="${l.url}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation();">${l.label}</a>`
                    ).join(' · ') : '';

                    card.innerHTML = `
                            <div class="card-summary">
                                <img src="${ann.cover}" alt="${ann.title}" loading="lazy" />
                                <div class="info">
                                    <h4>${ann.title}</h4>
                                    <p>${ann.description}</p>
                                </div>
                                <span class="badge">New</span>
                                <span class="expand-icon"><i class="fas fa-chevron-down"></i></span>
                            </div>
                            <div class="card-details">
                                ${ann.fullDescription ? `
                                <div class="detail-row">
                                    <span class="detail-label">About</span>
                                    <span class="detail-value">${ann.fullDescription}</span>
                                </div>` : ''}
                                ${ann.releaseDate ? `
                                <div class="detail-row">
                                    <span class="detail-label">Released</span>
                                    <span class="detail-value">${ann.releaseDate}</span>
                                </div>` : ''}
                                ${tagsHtml ? `
                                <div class="detail-row">
                                    <span class="detail-label">Tags</span>
                                    <span class="detail-value">${tagsHtml}</span>
                                </div>` : ''}
                                ${linksHtml ? `
                                <div class="detail-row">
                                    <span class="detail-label">Links</span>
                                    <span class="detail-value">${linksHtml}</span>
                                </div>` : ''}
                            </div>
                        `;

                    const toggle = (e) => {
                        if (e.target.closest('a')) return;
                        const isExpanded = card.classList.toggle('expanded');
                        card.setAttribute('aria-expanded', isExpanded);
                    };

                    card.addEventListener('click', toggle);
                    card.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            toggle(e);
                        }
                    });

                    announcementsContainer.appendChild(card);
                });
                announcementCount.textContent = `${ANNOUNCEMENTS.length} new`;
            }

            // ─── PAGE SWITCHING (slide transition) ──────────────────────
            let currentPage = 'hub';

            function switchPage(pageId) {
                if (pageId === currentPage) return;
                const isToAnnouncements = pageId === 'announcements';

                document.querySelectorAll('.nav-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.page === pageId);
                });

                if (isToAnnouncements) {
                    pageSlider.classList.add('slide-announcements');
                } else {
                    pageSlider.classList.remove('slide-announcements');
                }

                currentPage = pageId;

                if (pageId === 'hub') {
                    updateNowPlayingIndicator();
                }
            }

            // ─── RENDER PLAYLIST ────────────────────────────────────────
            function renderPlaylist() {
                playlistContainer.innerHTML = '';
                TRACKS.forEach((track, idx) => {
                    const item = document.createElement('div');
                    item.className = `playlist-item ${idx === currentIndex ? 'active' : ''}`;
                    item.dataset.index = idx;
                    item.setAttribute('role', 'button');
                    item.setAttribute('tabindex', '0');
                    item.setAttribute('aria-label', `Play ${track.title}`);

                    const isActive = idx === currentIndex;

                    item.innerHTML = `
                            <span class="idx">${String(idx + 1).padStart(2, '0')}</span>
                            <div class="pl-info">
                                <span class="pl-title">${track.title}</span>
                                <span class="pl-artist">${track.artist}</span>
                            </div>
                            <span class="pl-duration">${track.duration || '—'}</span>
                            <span class="pl-play-icon ${isActive && isPlaying ? 'playing' : ''}">
                                <i class="fas ${isActive && isPlaying ? 'fa-volume-high' : 'fa-play'}"></i>
                            </span>
                        `;

                    const handleClick = () => {
                        if (idx === currentIndex) {
                            togglePlay();
                        } else {
                            currentIndex = idx;
                            loadTrack(currentIndex);
                            if (isPlaying) {
                                audio.play().catch(() => {});
                            } else {
                                play();
                            }
                        }
                    };

                    item.addEventListener('click', handleClick);
                    item.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            handleClick();
                        }
                    });

                    playlistContainer.appendChild(item);
                });
            }

            // ─── STATE ────────────────────────────────────────────────────
            let currentIndex = 0;
            let isPlaying = false;
            let isDragging = false;
            let wasPlayingBeforeDrag = false;
            let previousVolume = 0.8;

            // ─── LOAD TRACK ──────────────────────────────────────────────
            function loadTrack(index) {
                const track = TRACKS[index];
                if (!track) return;

                trackName.textContent = track.title;
                trackArtist.textContent = track.artist;
                npTitle.textContent = track.title;

                if (track.cover) {
                    coverImg.src = track.cover;
                    coverImg.style.display = 'block';
                    coverFallback.style.display = 'none';
                } else {
                    coverImg.style.display = 'none';
                    coverFallback.style.display = 'flex';
                }

                audio.src = track.src;
                audio.load();

                progressFill.style.width = '0%';
                currentTimeLabel.textContent = '0:00';
                totalTimeLabel.textContent = track.duration || '0:00';

                document.querySelectorAll('.playlist-item').forEach((el, i) => {
                    el.classList.toggle('active', i === index);
                    const icon = el.querySelector('.pl-play-icon');
                    if (icon) {
                        icon.className = `pl-play-icon ${i === index && isPlaying ? 'playing' : ''}`;
                        icon.innerHTML =
                            `<i class="fas ${i === index && isPlaying ? 'fa-volume-high' : 'fa-play'}"></i>`;
                    }
                });

                npTitle.textContent = track.title;
                updateNowPlayingIndicator();
                updateCoverPlayState();
            }

            // ─── COVER PLAY STATE ────────────────────────────────────────
            function updateCoverPlayState() {
                if (isPlaying && audio.src && audio.src !== '') {
                    coverWrapper.classList.add('is-playing');
                } else {
                    coverWrapper.classList.remove('is-playing');
                }
            }

            // ─── NOW PLAYING INDICATOR ──────────────────────────────────
            function updateNowPlayingIndicator() {
                if (isPlaying && audio.src && audio.src !== '') {
                    npIndicator.className = 'np-indicator';
                } else {
                    npIndicator.className = 'np-indicator paused';
                }
                updateCoverPlayState();
            }

            // ─── PLAY / PAUSE ────────────────────────────────────────────
            function togglePlay() {
                if (audio.paused) {
                    play();
                } else {
                    pause();
                }
            }

            function play() {
                audio.play().catch(err => console.warn('Playback failed:', err));
                isPlaying = true;
                updatePlayButton();
                updatePlaylistIcons();
                updateNowPlayingIndicator();
                npTitle.textContent = TRACKS[currentIndex].title;
                updateCoverPlayState();
            }

            function pause() {
                audio.pause();
                isPlaying = false;
                updatePlayButton();
                updatePlaylistIcons();
                updateNowPlayingIndicator();
                updateCoverPlayState();
            }

            function updatePlayButton() {
                if (isPlaying) {
                    playIcon.className = 'fas fa-pause';
                    playBtn.classList.add('is-playing');
                } else {
                    playIcon.className = 'fas fa-play';
                    playBtn.classList.remove('is-playing');
                }
            }

            function updatePlaylistIcons() {
                document.querySelectorAll('.playlist-item').forEach((el, i) => {
                    const icon = el.querySelector('.pl-play-icon');
                    if (icon) {
                        const isActive = i === currentIndex;
                        const isNowPlaying = isActive && isPlaying;
                        icon.className = `pl-play-icon ${isNowPlaying ? 'playing' : ''}`;
                        icon.innerHTML = `<i class="fas ${isNowPlaying ? 'fa-volume-high' : 'fa-play'}"></i>`;
                    }
                });
            }

            // ─── SEEK ─────────────────────────────────────────────────────
            function updateProgress() {
                if (isDragging) return;
                if (audio.duration && !isNaN(audio.duration)) {
                    const percent = (audio.currentTime / audio.duration) * 100;
                    progressFill.style.width = `${Math.min(percent, 100)}%`;
                    currentTimeLabel.textContent = formatTime(audio.currentTime);
                    totalTimeLabel.textContent = formatTime(audio.duration);
                }
            }

            function formatTime(seconds) {
                if (!seconds || isNaN(seconds)) return '0:00';
                const m = Math.floor(seconds / 60);
                const s = Math.floor(seconds % 60);
                return `${m}:${s.toString().padStart(2, '0')}`;
            }

            // ─── VOLUME ──────────────────────────────────────────────────
            function updateVolumeIcon() {
                const val = parseFloat(volumeSlider.value);
                if (val === 0) {
                    volIcon.className = 'fas fa-volume-xmark';
                } else if (val < 0.4) {
                    volIcon.className = 'fas fa-volume-low';
                } else if (val < 0.7) {
                    volIcon.className = 'fas fa-volume-low';
                } else {
                    volIcon.className = 'fas fa-volume-high';
                }
            }

            function toggleMute() {
                const val = parseFloat(volumeSlider.value);
                if (val > 0) {
                    previousVolume = val;
                    volumeSlider.value = 0;
                    audio.volume = 0;
                    updateVolumeIcon();
                } else {
                    volumeSlider.value = previousVolume || 0.8;
                    audio.volume = parseFloat(volumeSlider.value);
                    updateVolumeIcon();
                }
            }

            // ─── TRACK COUNT ─────────────────────────────────────────────
            function updateTrackCount() {
                const validTracks = TRACKS.filter(t => t.src && t.src !== 'https://s3.amazonaws.com');
                trackCount.textContent = `${validTracks.length} tracks`;
            }

            // ─── NAVIGATION ──────────────────────────────────────────────
            function nextTrack() {
                const next = (currentIndex + 1) % TRACKS.length;
                currentIndex = next;
                loadTrack(currentIndex);
                if (isPlaying) {
                    audio.play().catch(() => {});
                } else {
                    play();
                }
            }

            function prevTrack() {
                const prev = (currentIndex - 1 + TRACKS.length) % TRACKS.length;
                currentIndex = prev;
                loadTrack(currentIndex);
                if (isPlaying) {
                    audio.play().catch(() => {});
                } else {
                    play();
                }
            }

            // ─── EVENT LISTENERS ──────────────────────────────────────────
            function setupEventListeners() {

                document.querySelectorAll('.nav-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const page = btn.dataset.page;
                        switchPage(page);
                    });
                });

                playBtn.addEventListener('click', togglePlay);
                prevBtn.addEventListener('click', prevTrack);
                nextBtn.addEventListener('click', nextTrack);
                volIconBtn.addEventListener('click', toggleMute);

                audio.addEventListener('timeupdate', updateProgress);
                audio.addEventListener('loadedmetadata', () => {
                    totalTimeLabel.textContent = formatTime(audio.duration);
                });
                audio.addEventListener('ended', () => {
                    nextTrack();
                });
                audio.addEventListener('play', () => {
                    isPlaying = true;
                    updatePlayButton();
                    updatePlaylistIcons();
                    updateNowPlayingIndicator();
                    npTitle.textContent = TRACKS[currentIndex].title;
                    updateCoverPlayState();
                });
                audio.addEventListener('pause', () => {
                    isPlaying = false;
                    updatePlayButton();
                    updatePlaylistIcons();
                    updateNowPlayingIndicator();
                    updateCoverPlayState();
                });

                progressTrack.addEventListener('mousedown', (e) => {
                    if (!audio.duration || isNaN(audio.duration)) return;
                    isDragging = true;
                    wasPlayingBeforeDrag = !audio.paused;
                    audio.pause();
                    seekFromMouse(e);
                });

                document.addEventListener('mousemove', (e) => {
                    if (!isDragging) return;
                    seekFromMouse(e);
                });

                document.addEventListener('mouseup', () => {
                    if (isDragging) {
                        isDragging = false;
                        if (wasPlayingBeforeDrag) {
                            audio.play().catch(() => {});
                        }
                    }
                });

                progressTrack.addEventListener('touchstart', (e) => {
                    if (!audio.duration || isNaN(audio.duration)) return;
                    isDragging = true;
                    wasPlayingBeforeDrag = !audio.paused;
                    audio.pause();
                    seekFromTouch(e);
                }, { passive: true });

                progressTrack.addEventListener('touchmove', (e) => {
                    if (!isDragging) return;
                    seekFromTouch(e);
                }, { passive: true });

                progressTrack.addEventListener('touchend', () => {
                    if (isDragging) {
                        isDragging = false;
                        if (wasPlayingBeforeDrag) {
                            audio.play().catch(() => {});
                        }
                    }
                }, { passive: true });

                volumeSlider.addEventListener('input', () => {
                    const val = parseFloat(volumeSlider.value);
                    audio.volume = val;
                    updateVolumeIcon();
                });

                document.addEventListener('keydown', (e) => {
                    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                    if (e.code === 'Space') {
                        e.preventDefault();
                        togglePlay();
                    }
                    if (e.code === 'ArrowRight') {
                        e.preventDefault();
                        nextTrack();
                    }
                    if (e.code === 'ArrowLeft') {
                        e.preventDefault();
                        prevTrack();
                    }
                    if (e.key === 'm' || e.key === 'M') {
                        e.preventDefault();
                        toggleMute();
                    }
                });
            }

            // ─── SEEK HELPERS ────────────────────────────────────────────
            function seekFromMouse(e) {
                const rect = progressTrack.getBoundingClientRect();
                const x = (e.clientX - rect.left) / rect.width;
                const clamped = Math.min(Math.max(x, 0), 1);
                if (audio.duration) {
                    audio.currentTime = clamped * audio.duration;
                    progressFill.style.width = `${clamped * 100}%`;
                    currentTimeLabel.textContent = formatTime(audio.currentTime);
                }
            }

            function seekFromTouch(e) {
                const touch = e.touches[0];
                const rect = progressTrack.getBoundingClientRect();
                const x = (touch.clientX - rect.left) / rect.width;
                const clamped = Math.min(Math.max(x, 0), 1);
                if (audio.duration) {
                    audio.currentTime = clamped * audio.duration;
                    progressFill.style.width = `${clamped * 100}%`;
                    currentTimeLabel.textContent = formatTime(audio.currentTime);
                }
            }

            // ─── INIT ──────────────────────────────────────────────────
            function init() {
                loadTheme();
                renderPlaylist();
                renderAnnouncements();
                loadTrack(currentIndex);
                setupEventListeners();
                updateTrackCount();
                audio.volume = parseFloat(volumeSlider.value);
                updateVolumeIcon();
                updateNowPlayingIndicator();
                currentPage = 'hub';
                pageSlider.classList.remove('slide-announcements');
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.page === 'hub');
                });
                setTimeout(() => {
                    showNav();
                    setTimeout(hideNav, 1800);
                }, 400);
            }

            if (document.readyState === 'complete') {
                init();
            } else {
                window.addEventListener('load', init);
            }

        })();
    </script>

</body>
</html>
