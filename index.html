<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>SBPebbles · Music Hub</title>
    <meta name="description" content="SBPebbles Music Hub – listen to Kam Pebbles">
    <meta name="theme-color" content="#0b1120">
    <link rel="icon" type="image/png" href="/assets/images/favicon-96x96.png?v=20260819" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg?v=20260819" />
    <link rel="shortcut icon" href="/assets/images/favicon.ico?v=20260819" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png?v=20260819" />
    <meta name="apple-mobile-web-app-title" content="SBPebbles Music Hub" />
    <link rel="manifest" href="/assets/images/site.webmanifest?v=20260819" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ═══════════════════════════════════════════════════
           RESET & BASE
           ═══════════════════════════════════════════════════ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --font: "Inter", system-ui, -apple-system, sans-serif;
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 24px;
            --ease: cubic-bezier(.23, 1, .32, 1);
            --spring: cubic-bezier(.34, 1.56, .64, 1);
            --transition: .35s var(--ease);
            --transition-spring: .5s var(--spring);
            /* defaults for special themes */
            --secondary: var(--primary);
            --secondary-dim: var(--primary-dim);
            --accent: var(--primary);
            --accent-dim: var(--primary-dim);
        }
        html {
            font: 100%/1.6 var(--font);
            background: var(--bg);
            color: var(--text);
            transition: background .5s var(--ease), color .4s var(--ease);
            scroll-behavior: smooth;
        }
        body {
            min-height: 100vh;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            animation: fadeIn .7s var(--ease) forwards;
            padding: 0 16px;
        }
        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }
        button,
        a {
            font: inherit;
            color: inherit;
            border: none;
            background: none;
            cursor: pointer;
            text-decoration: none;
        }
        :focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }
        /* Global interactive animations – optimized */
        button,
        .pl-item,
        .news-summary,
        .other-item,
        .link-item a,
        .nav-btn,
        .social-btn,
        .contact-btn,
        .ctrl-btn,
        .play-btn,
        .theme-dot,
        .link-item {
            transition: transform .25s var(--ease), background .3s var(--ease), box-shadow .25s var(--ease),
                border-color .25s var(--ease), color .25s var(--ease), opacity .25s var(--ease);
            will-change: transform;
        }
        button:active,
        .pl-item:active,
        .news-summary:active,
        .other-item:active,
        .nav-btn:active,
        .social-btn:active,
        .contact-btn:active,
        .ctrl-btn:active,
        .play-btn:active,
        .theme-dot:active {
            transform: scale(0.97) !important;
        }

        /* ═══════════════════════════════════════════════════
           THEMES (11 total: 8 original + 3 new)
           ═══════════════════════════════════════════════════ */
        [data-theme="midnight"] {
            --primary: #5b7cfa;
            --primary-dim: #2a3f8a;
            --bg: #0b1120;
            --surface: #141c30;
            --surface-2: #1e2a44;
            --text: #e8edf5;
            --text-muted: #8899bb;
            --border: #2a3a5a;
            --shadow: 0 8px 32px rgba(0, 0, 0, .6);
            --glow: 0 0 20px rgba(91, 124, 250, .15);
        }
        [data-theme="sunset"] {
            --primary: #ff8a5c;
            --primary-dim: #b84c2a;
            --bg: #1e120e;
            --surface: #2d1c16;
            --surface-2: #3d2820;
            --text: #f5e6dc;
            --text-muted: #c9a088;
            --border: #5a3a2a;
            --shadow: 0 8px 32px rgba(0, 0, 0, .6);
            --glow: 0 0 20px rgba(255, 138, 92, .15);
        }
        [data-theme="forest"] {
            --primary: #5fbf8a;
            --primary-dim: #2a6a48;
            --bg: #0c1810;
            --surface: #16281c;
            --surface-2: #1f3828;
            --text: #e0f0e6;
            --text-muted: #88b09a;
            --border: #2a4a36;
            --shadow: 0 8px 32px rgba(0, 0, 0, .6);
            --glow: 0 0 20px rgba(95, 191, 138, .15);
        }
        [data-theme="lavender"] {
            --primary: #b28bff;
            --primary-dim: #5a3f9a;
            --bg: #14101e;
            --surface: #221c32;
            --surface-2: #322846;
            --text: #eee8f5;
            --text-muted: #a992c0;
            --border: #3f305a;
            --shadow: 0 8px 32px rgba(0, 0, 0, .6);
            --glow: 0 0 20px rgba(178, 139, 255, .15);
        }
        [data-theme="ocean"] {
            --primary: #38bdf8;
            --primary-dim: #1e5a7a;
            --bg: #0a1a2a;
            --surface: #12283a;
            --surface-2: #1a3448;
            --text: #e0f2fe;
            --text-muted: #7aa8c0;
            --border: #1e3e55;
            --shadow: 0 8px 32px rgba(0, 0, 0, .6);
            --glow: 0 0 20px rgba(56, 189, 248, .15);
        }
        [data-theme="crimson"] {
            --primary: #f87171;
            --primary-dim: #7f1d1d;
            --bg: #1a0a0a;
            --surface: #2a1212;
            --surface-2: #3a1a1a;
            --text: #fee2e2;
            --text-muted: #c98a8a;
            --border: #5a2a2a;
            --shadow: 0 8px 32px rgba(0, 0, 0, .6);
            --glow: 0 0 20px rgba(248, 113, 113, .15);
        }
        [data-theme="mint"] {
            --primary: #34d399;
            --primary-dim: #166534;
            --bg: #0a1a14;
            --surface: #12281e;
            --surface-2: #1a382a;
            --text: #e6f5ec;
            --text-muted: #8ab5a0;
            --border: #2a4a38;
            --shadow: 0 8px 32px rgba(0, 0, 0, .6);
            --glow: 0 0 20px rgba(52, 211, 153, .15);
        }
        [data-theme="sunrise"] {
            --primary: #fbbf24;
            --primary-dim: #92400e;
            --bg: #1a120a;
            --surface: #2a1e12;
            --surface-2: #3a2a1a;
            --text: #fef3c7;
            --text-muted: #c9a875;
            --border: #5a422a;
            --shadow: 0 8px 32px rgba(0, 0, 0, .6);
            --glow: 0 0 20px rgba(251, 191, 36, .15);
        }

        /* ── NEW: Turquoise-Blue ── */
        [data-theme="turquoise"] {
            --primary: #2dd4bf;
            --primary-dim: #1a6a5a;
            --bg: #0a1a1a;
            --surface: #122828;
            --surface-2: #1a3838;
            --text: #e0f5f5;
            --text-muted: #7ab0b0;
            --border: #2a4a4a;
            --shadow: 0 8px 32px rgba(0, 0, 0, .6);
            --glow: 0 0 20px rgba(45, 212, 191, .15);
        }

        /* ── SPECIAL: Galaxy (purple + teal + gold) ── */
        [data-theme="galaxy"] {
            --primary: #8b5cf6;
            --primary-dim: #5a3a9a;
            --secondary: #06b6d4;
            --secondary-dim: #1a6a7a;
            --accent: #f59e0b;
            --accent-dim: #9a6a0a;
            --bg: #0f0a1a;
            --surface: #1a1428;
            --surface-2: #2d1f3d;
            --text: #f1e8ff;
            --text-muted: #a78bcc;
            --border: #3a2a5a;
            --shadow: 0 8px 32px rgba(0, 0, 0, .7);
            --glow: 0 0 20px rgba(139, 92, 246, .20);
        }
        /* Galaxy-specific overrides for multi-color elements */
        [data-theme="galaxy"] .progress-fill {
            background: linear-gradient(90deg, var(--primary), var(--secondary));
        }
        [data-theme="galaxy"] .cover-wrapper .ring {
            border-color: var(--secondary);
        }
        [data-theme="galaxy"] .cover-wrapper.playing .ring {
            border-color: var(--accent);
        }
        [data-theme="galaxy"] .pl-item.active {
            background: var(--secondary-dim);
            border-color: var(--secondary);
        }
        [data-theme="galaxy"] .nav-btn.active {
            background: var(--secondary);
        }
        [data-theme="galaxy"] .now-playing-strip {
            border-color: var(--secondary);
        }
        [data-theme="galaxy"] .play-btn {
            background: var(--secondary);
            box-shadow: 0 4px 20px rgba(6, 182, 212, .3);
        }
        [data-theme="galaxy"] .play-btn:hover {
            box-shadow: 0 6px 28px rgba(6, 182, 212, .4);
        }
        [data-theme="galaxy"] .theme-dot.selected {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--primary), 0 6px 16px rgba(0, 0, 0, .35);
        }

        /* ── SPECIAL: Aurora (emerald + indigo + pink) ── */
        [data-theme="aurora"] {
            --primary: #34d399;
            --primary-dim: #1a6a4a;
            --secondary: #818cf8;
            --secondary-dim: #4a4a9a;
            --accent: #f472b6;
            --accent-dim: #8a3a6a;
            --bg: #0a0f1a;
            --surface: #141f2e;
            --surface-2: #1f3348;
            --text: #e8f5f0;
            --text-muted: #88b5a8;
            --border: #2a3a4a;
            --shadow: 0 8px 32px rgba(0, 0, 0, .7);
            --glow: 0 0 20px rgba(52, 211, 153, .20);
        }
        [data-theme="aurora"] .progress-fill {
            background: linear-gradient(90deg, var(--primary), var(--secondary));
        }
        [data-theme="aurora"] .cover-wrapper .ring {
            border-color: var(--secondary);
        }
        [data-theme="aurora"] .cover-wrapper.playing .ring {
            border-color: var(--accent);
        }
        [data-theme="aurora"] .pl-item.active {
            background: var(--secondary-dim);
            border-color: var(--secondary);
        }
        [data-theme="aurora"] .nav-btn.active {
            background: var(--secondary);
        }
        [data-theme="aurora"] .now-playing-strip {
            border-color: var(--secondary);
        }
        [data-theme="aurora"] .play-btn {
            background: var(--secondary);
            box-shadow: 0 4px 20px rgba(129, 140, 248, .3);
        }
        [data-theme="aurora"] .play-btn:hover {
            box-shadow: 0 6px 28px rgba(129, 140, 248, .4);
        }
        [data-theme="aurora"] .theme-dot.selected {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--primary), 0 6px 16px rgba(0, 0, 0, .35);
        }

        /* fallback for special theme properties on regular themes */
        [data-theme="midnight"] .progress-fill,
        [data-theme="sunset"] .progress-fill,
        [data-theme="forest"] .progress-fill,
        [data-theme="lavender"] .progress-fill,
        [data-theme="ocean"] .progress-fill,
        [data-theme="crimson"] .progress-fill,
        [data-theme="mint"] .progress-fill,
        [data-theme="sunrise"] .progress-fill,
        [data-theme="turquoise"] .progress-fill {
            background: var(--primary);
        }

        /* ═══════════════════════════════════════════════════
           LAYOUT
           ═══════════════════════════════════════════════════ */
        .app {
            max-width: 1120px;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px 0 10px;
        }

        /* ── Header ── */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px 20px;
            padding: 12px 0 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 28px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 22px;
            letter-spacing: -0.02em;
            transition: transform var(--transition-spring);
            will-change: transform;
        }
        .logo:hover {
            transform: translateY(-2px);
        }
        .logo-icon {
            width: 38px;
            height: 38px;
            border-radius: var(--radius-sm);
            object-fit: cover;
            display: block;

            transition: transform var(--transition-spring), border-color .3s;
            will-change: transform;
            flex-shrink: 0;
        }
        .logo:hover .logo-icon {

            border-color: var(--text);
        }
        .logo span {
            background: linear-gradient(135deg, var(--primary), var(--text));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            transition: background .3s;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .social-btn {
            width: 38px;
            height: 38px;
            border-radius: var(--radius-sm);
            background: var(--surface);
            color: var(--text-muted);
            display: grid;
            place-items: center;
            border: 1px solid transparent;
            will-change: transform;
        }
        .social-btn:hover {
            background: var(--primary);
            color: var(--bg);
            transform: translateY(-2px);
            box-shadow: var(--glow);
            border-color: var(--primary);
        }
        .contact-btn {
            padding: 8px 18px;
            border-radius: var(--radius-sm);
            background: var(--primary);
            color: var(--bg);
            font-weight: 600;
            font-size: 12px;
            letter-spacing: .06em;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            will-change: transform;
        }
        .contact-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--glow);
        }

        /* ── Bottom Navigation ── */
        .bottom-nav {
            display: flex;
            gap: 4px;
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 6px;
            margin: 24px 0 32px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }
        .nav-btn {
            flex: 1;
            padding: 12px 8px;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 14px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: transparent;
            transition: color .2s, background .2s, transform .2s;
            will-change: transform;
        }
        .nav-btn i {
            font-size: 18px;
            transition: transform .2s;
            will-change: transform;
        }
        .nav-btn:hover {
            color: var(--text);
            background: var(--surface-2);
            transform: translateY(-1px);
        }
        .nav-btn.active {
            background: var(--primary);
            color: var(--bg);
            box-shadow: 0 2px 8px rgba(var(--primary), .25);
        }
        .nav-btn.active i {
            transform: scale(1.02);
        }
        .nav-btn .badge {
            background: var(--bg);
            color: var(--text);
            font-size: 10px;
            padding: 0 8px;
            border-radius: 20px;
            line-height: 18px;
            font-weight: 700;
        }
        .nav-btn.active .badge {
            background: var(--bg);
            color: var(--primary);
        }

        /* ── Panels with slide effect ── */
        .panel {
            display: none;
        }
        .panel.active {
            display: block;
        }
        .panel.active.slide-right {
            animation: slidePanelRight .45s var(--ease) both;
        }
        .panel.active.slide-left {
            animation: slidePanelLeft .45s var(--ease) both;
        }
        @keyframes slidePanelRight {
            0% {
                opacity: 0;
                transform: translateX(48px);
            }
            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }
        @keyframes slidePanelLeft {
            0% {
                opacity: 0;
                transform: translateX(-48px);
            }
            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* ═══════════════════════════════════════════════════
           HUB – PLAYER
           ═══════════════════════════════════════════════════ */
        .now-playing-strip {
            display: flex;
            align-items: center;
            gap: 16px;
            background: var(--surface);
            padding: 10px 18px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            margin-bottom: 24px;
            box-shadow: var(--shadow);
            transition: border-color .3s var(--ease);
        }
        .now-playing-strip:hover {
            border-color: var(--primary);
        }
        .np-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .1em;
            color: var(--text-muted);
            font-weight: 600;
        }
        .np-label i {
            color: var(--primary);
            margin-right: 6px;
        }
        .np-title {
            font-weight: 600;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .np-dots {
            display: flex;
            gap: 5px;
        }
        .np-dots span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--primary);
            display: inline-block;
            transition: all .3s;
            will-change: transform, opacity;
        }
        .np-dots.paused span {
            opacity: .2;
            transform: scale(.6);
            animation: none;
        }
        .np-strip.playing .np-dots span {
            animation: dotBounce 1.2s infinite;
        }
        .np-strip.playing .np-dots span:nth-child(2) {
            animation-delay: .2s;
        }
        .np-strip.playing .np-dots span:nth-child(3) {
            animation-delay: .4s;
        }
        @keyframes dotBounce {
            0%,
            100% {
                transform: scale(.6);
                opacity: .3;
            }
            50% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        .player-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 24px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .player-grid {
            display: grid;
            grid-template-columns: 160px 1fr;
            gap: 28px;
            align-items: start;
        }
        .cover-wrapper {
            width: 160px;
            height: 160px;
            border-radius: var(--radius-md);
            overflow: hidden;
            position: relative;
            box-shadow: var(--shadow);
            background: var(--surface-2);
            flex-shrink: 0;
            will-change: transform;
        }
        .cover-wrapper:hover {
            transform: scale(1.01);
        }
        .cover-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .cover-wrapper .cover-fallback {
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
            font-size: 48px;
            color: var(--text-muted);
        }
        .cover-wrapper .ring {
            position: absolute;
            inset: -6px;
            border-radius: var(--radius-md);
            border: 2.5px solid transparent;
            pointer-events: none;
            transition: all .3s;
        }
        .cover-wrapper.playing .ring {
            border-color: var(--primary);
            animation: ringPulse 2s infinite;
        }
        @keyframes ringPulse {
            0%,
            100% {
                transform: scale(1);
                opacity: .3;
            }
            50% {
                transform: scale(1.07);
                opacity: .8;
            }
        }

        .track-info {
            margin-bottom: 6px;
        }
        .track-info .title {
            font-size: 26px;
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: -0.02em;
        }
        .track-info .artist {
            color: var(--text-muted);
            font-size: 16px;
            margin-top: 2px;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            margin: 18px 0 12px;
        }
        .ctrl-btn {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-sm);
            background: var(--surface-2);
            color: var(--text);
            display: grid;
            place-items: center;
            border: 1px solid transparent;
            will-change: transform;
        }
        .ctrl-btn:hover {
            background: var(--primary);
            color: var(--bg);
            transform: translateY(-2px);
            box-shadow: var(--glow);
            border-color: var(--primary);
        }
        .play-btn {
            width: 52px;
            height: 52px;
            border-radius: var(--radius-md);
            background: var(--primary);
            color: var(--bg);
            font-size: 20px;
            display: grid;
            place-items: center;
            box-shadow: 0 4px 20px rgba(var(--primary), .3);
            will-change: transform;
            transition: transform .25s var(--ease), box-shadow .3s var(--ease), background .3s var(--ease);
        }
        .play-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 6px 28px rgba(var(--primary), .4);
        }

        .volume-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
        }
        .volume-group input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 80px;
            height: 4px;
            border-radius: var(--radius-sm);
            background: var(--border);
            outline: none;
            cursor: pointer;
            transition: background .2s;
        }
        .volume-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--primary);
            box-shadow: 0 2px 8px rgba(0, 0, 0, .3);
            cursor: pointer;
            transition: transform .2s;
            will-change: transform;
        }
        .volume-group input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
        .volume-group input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--primary);
            border: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .3);
            cursor: pointer;
        }

        .progress-row {
            display: grid;
            grid-template-columns: 42px 1fr 42px;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }
        .progress-track {
            height: 6px;
            background: var(--border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            position: relative;
            min-height: 30px;
            display: flex;
            align-items: center;
            transition: height .2s;
        }
        .progress-track:hover {
            height: 8px;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            border-radius: inherit;
            pointer-events: none;
            transition: width .05s linear;
            background: var(--primary);
        }

        /* ── Playlist ── */
        .playlist {
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .pl-item {
            display: grid;
            grid-template-columns: 32px 1fr auto 32px;
            gap: 12px;
            align-items: center;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            background: transparent;
            cursor: pointer;
            border: 1px solid transparent;
            will-change: transform;
            transition: transform .25s var(--ease), background .3s var(--ease), border-color .25s var(--ease),
                box-shadow .25s var(--ease);
        }
        .pl-item:hover {
            background: var(--surface-2);
            border-color: var(--border);
            transform: translateX(2px);
        }
        .pl-item.active {
            background: var(--primary-dim);
            border-color: var(--primary);
            box-shadow: var(--glow);
        }
        .pl-item .idx {
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 500;
            text-align: center;
        }
        .pl-item .info .title {
            font-weight: 500;
            font-size: 14px;
        }
        .pl-item .info .artist {
            font-size: 12px;
            color: var(--text-muted);
        }
        .pl-item .dur {
            font-size: 12px;
            color: var(--text-muted);
        }
        .pl-item .pl-icon {
            text-align: center;
            color: var(--primary);
            opacity: 0;
            transition: opacity .2s, transform .2s;
            will-change: transform, opacity;
        }
        .pl-item:hover .pl-icon,
        .pl-item.active .pl-icon {
            opacity: 1;
        }
        .pl-item .pl-icon.playing {
            opacity: 1;
            animation: iconPulse 1s infinite;
        }
        @keyframes iconPulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        /* ═══════════════════════════════════════════════════
           NEWS PANEL
           ═══════════════════════════════════════════════════ */
        .section-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .section-head h2 {
            font-size: 24px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .section-head h2 i {
            color: var(--primary);
        }
        .section-head .count {
            font-size: 13px;
            color: var(--text-muted);
            background: var(--surface);
            padding: 4px 16px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
        }

        .news-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .news-card {
            background: var(--surface);
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            overflow: hidden;
            transition: border-color .3s var(--ease), box-shadow .3s var(--ease);
        }
        .news-card:hover {
            border-color: var(--primary);
        }
        .news-card.open {
            border-color: var(--primary);
            box-shadow: var(--glow);
        }
        .news-summary {
            display: grid;
            grid-template-columns: 80px 1fr 30px;
            gap: 14px;
            align-items: center;
            padding: 14px 18px;
            cursor: pointer;
            will-change: transform;
        }
        .news-summary:hover {
            background: var(--surface-2);
        }
        .news-summary img {
            width: 80px;
            height: 64px;
            object-fit: cover;
            border-radius: var(--radius-sm);
            background: var(--surface-2);
            border: 1px solid var(--border);
        }
        .news-summary .info h4 {
            font-weight: 600;
            font-size: 16px;
        }
        .news-summary .info p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 2px;
        }
        .news-summary .new-badge {
            display: inline-block;
            background: var(--primary);
            color: var(--bg);
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 1px 10px;
            border-radius: 20px;
            margin-left: 8px;
            vertical-align: middle;
        }
        .news-summary .chevron {
            color: var(--text-muted);
            transition: transform .3s;
        }
        .news-card.open .news-summary .chevron {
            transform: rotate(90deg);
            color: var(--primary);
        }
        .news-details {
            max-height: 0;
            overflow: hidden;
            padding: 0 18px;
            border-top: 0px solid var(--border);
            transition: max-height .4s ease, padding .4s ease, border-width .4s ease;
            background: var(--surface);
        }
        .news-card.open .news-details {
            max-height: 500px;
            padding: 0 18px 18px 112px;
            border-top-width: 1px;
        }
        .news-details .row {
            display: flex;
            gap: 14px;
            padding: 6px 0;
            border-top: 1px solid var(--border);
        }
        .news-details .row:first-child {
            border-top: none;
        }
        .news-details .row .label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: .04em;
            min-width: 60px;
            flex-shrink: 0;
        }
        .news-details .row .value {
            font-size: 14px;
            color: var(--text);
            word-break: break-word;
        }
        .news-details .row .value .chip {
            display: inline-block;
            font-size: 11px;
            background: var(--surface-2);
            color: var(--text-muted);
            padding: 2px 12px;
            border-radius: 20px;
            margin-right: 4px;
        }
        .news-details .row .value a {
            color: var(--primary);
            border-bottom: 1px solid transparent;
            transition: border-color .2s;
        }
        .news-details .row .value a:hover {
            border-bottom-color: var(--primary);
        }

        /* ═══════════════════════════════════════════════════
           OTHER PANEL
           ═══════════════════════════════════════════════════ */
        .other-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }
        .other-item {
            aspect-ratio: 1;
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid var(--border);
            background: var(--surface);
            position: relative;
            cursor: pointer;
            box-shadow: var(--shadow);
            will-change: transform;
            transition: transform .3s var(--ease), border-color .3s var(--ease), box-shadow .3s var(--ease);
        }
        .other-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform .4s var(--ease);
            display: block;
            will-change: transform;
        }
        .other-item:hover img {
            transform: scale(1.03);
        }
        .other-item .fallback {
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
            font-size: 48px;
            color: var(--text-muted);
            background: var(--surface-2);
        }
        .other-overlay {
            position: absolute;
            inset: auto 0 0;
            padding: 18px 16px 14px;
            background: linear-gradient(transparent, rgba(0, 0, 0, .8));
            color: #fff;
            transform: translateY(100%);
            transition: transform .3s var(--ease);
            will-change: transform;
        }
        .other-item:hover .other-overlay {
            transform: translateY(0);
        }
        .other-overlay h4 {
            font-weight: 600;
            font-size: 15px;
        }
        .other-overlay p {
            font-size: 12px;
            opacity: .8;
        }

        .other-item.expanded {
            position: fixed;
            z-index: 200;
            left: 50%;
            top: 50%;
            width: min(600px, 88vw);
            height: min(600px, 88vw);
            transform: translate(-50%, -50%) scale(1);
            border-color: var(--primary);
            box-shadow: 0 24px 64px rgba(0, 0, 0, .7);
            border-radius: var(--radius-lg);
        }
        .other-item.expanded .other-overlay {
            transform: translateY(0);
        }
        .other-close {
            display: none;
            position: absolute;
            top: 12px;
            right: 12px;
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            background: rgba(0, 0, 0, .5);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, .2);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            place-items: center;
            font-size: 14px;
            z-index: 5;
            transition: background .2s, transform .2s;
            will-change: transform;
        }
        .other-close:hover {
            background: rgba(255, 255, 255, .2);
            transform: scale(1.05);
        }
        .other-item.expanded .other-close {
            display: grid;
        }

        /* ═══════════════════════════════════════════════════
           LINKS PANEL
           ═══════════════════════════════════════════════════ */
        .links-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: var(--surface);
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            overflow: hidden;
        }
        .link-item {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            transition: background .2s;
        }
        .link-item:last-child {
            border-bottom: none;
        }
        .link-item a {
            display: flex;
            align-items: center;
            gap: 18px;
            width: 100%;
            font-weight: 600;
            font-size: 18px;
            color: var(--text);
            transition: color .2s, transform .2s;
            will-change: transform;
        }
        .link-item a i {
            width: 30px;
            text-align: center;
            color: var(--primary);
            font-size: 24px;
            transition: transform .2s;
            will-change: transform;
        }
        .link-item:hover {
            background: var(--surface-2);
        }
        .link-item:hover a {
            color: var(--primary);
            transform: translateX(4px);
        }
        .link-item:hover a i {
            transform: rotate(-8deg) scale(1.05);
        }

        /* ═══════════════════════════════════════════════════
           FOOTER – THEME PICKER (solid colors, no gradients)
           ═══════════════════════════════════════════════════ */
        .footer {
            margin-top: 40px;
            padding: 20px 0 8px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        .theme-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .theme-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: var(--text-muted);
            font-weight: 600;
        }
        .theme-dot {
            width: 44px;
            height: 32px;
            border-radius: var(--radius-sm);
            border: 2px solid var(--border);
            position: relative;
            cursor: pointer;
            background: var(--surface-2);
            transition: transform .2s, border-color .2s, box-shadow .2s;
            will-change: transform;
            flex-shrink: 0;
            /* solid colors set inline via data attributes */;
        }
        .theme-dot::after {
            content: '✓';
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            opacity: 0;
            text-shadow: 0 1px 4px rgba(0, 0, 0, .5);
            transition: opacity .2s;
        }
        .theme-dot.selected::after {
            opacity: 1;
        }
        .theme-dot:hover {
            transform: translateY(-1px);
            border-color: var(--primary);
        }
        .theme-dot.selected {
            border-color: var(--text);
            box-shadow: 0 0 0 2px var(--primary), 0 6px 16px rgba(0, 0, 0, .35);
        }

        /* Special theme dots get a subtle star indicator */
        .theme-dot.special::before {
            content: '✦';
            position: absolute;
            top: -6px;
            right: -6px;
            font-size: 10px;
            color: var(--accent, #fbbf24);
            text-shadow: 0 0 6px rgba(0, 0, 0, .6);
            opacity: .9;
            z-index: 1;
        }

        .footer-copy {
            font-size: 13px;
            color: var(--text-muted);
            opacity: .7;
        }

        /* ═══════════════════════════════════════════════════
           RESPONSIVE
           ═══════════════════════════════════════════════════ */
        @media (max-width: 820px) {
            .player-grid {
                grid-template-columns: 140px 1fr;
                gap: 20px;
            }
            .cover-wrapper {
                width: 140px;
                height: 140px;
            }
            .other-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 720px) {
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
            .header-actions {
                justify-content: center;
            }
            .bottom-nav {
                gap: 2px;
                padding: 4px;
            }
            .nav-btn {
                font-size: 12px;
                padding: 10px 4px;
            }
            .nav-btn i {
                font-size: 16px;
            }
            .nav-btn span {
                display: none;
            }
            .nav-btn .badge {
                display: none;
            }
            .player-grid {
                grid-template-columns: 1fr;
                justify-items: center;
            }
            .cover-wrapper {
                width: 180px;
                height: 180px;
            }
            .volume-group input[type="range"] {
                width: 60px;
            }
            .controls {
                justify-content: center;
            }
            .volume-group {
                margin-left: 0;
                width: 100%;
                justify-content: center;
            }
            .news-summary {
                grid-template-columns: 60px 1fr 26px;
                padding: 12px;
            }
            .news-summary img {
                width: 60px;
                height: 48px;
            }
            .news-card.open .news-details {
                padding-left: 16px;
                padding-right: 12px;
            }
            .other-grid {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
            .other-item.expanded {
                width: min(400px, 86vw);
                height: min(400px, 86vw);
            }
            .link-item a {
                font-size: 16px;
                gap: 12px;
            }
            .link-item a i {
                font-size: 20px;
                width: 24px;
            }
            .footer {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
            .theme-group {
                justify-content: center;
            }
            .theme-dot {
                width: 40px;
                height: 28px;
            }
            .footer-copy {
                text-align: center;
            }
        }
        @media (max-width: 480px) {
            .app {
                padding: 12px 0 6px;
            }
            .logo {
                font-size: 18px;
            }
            .logo-icon {
                width: 32px;
                height: 32px;
            }
            .social-btn {
                width: 34px;
                height: 34px;
            }
            .contact-btn {
                font-size: 10px;
                padding: 6px 14px;
            }
            .player-card {
                padding: 16px;
            }
            .cover-wrapper {
                width: 150px;
                height: 150px;
            }
            .track-info .title {
                font-size: 20px;
            }
            .play-btn {
                width: 46px;
                height: 46px;
                font-size: 17px;
            }
            .ctrl-btn {
                width: 34px;
                height: 34px;
            }
            .progress-row {
                font-size: 11px;
                grid-template-columns: 36px 1fr 36px;
                gap: 8px;
            }
            .pl-item {
                grid-template-columns: 24px 1fr 24px;
                padding: 8px 10px;
                gap: 8px;
            }
            .pl-item .dur {
                display: none;
            }
            .pl-item .info .title {
                font-size: 13px;
            }
            .pl-item .info .artist {
                font-size: 11px;
            }
            .news-summary {
                grid-template-columns: 48px 1fr 22px;
                padding: 10px 12px;
            }
            .news-summary img {
                width: 48px;
                height: 40px;
            }
            .news-summary .info h4 {
                font-size: 14px;
            }
            .news-summary .info p {
                font-size: 12px;
            }
            .news-details {
                padding-left: 12px;
                padding-right: 8px;
            }
            .news-card.open .news-details {
                padding-left: 12px;
                padding-right: 8px;
            }
            .news-details .row .value {
                font-size: 13px;
            }
            .other-grid {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .other-item.expanded {
                width: min(300px, 86vw);
                height: min(300px, 86vw);
            }
            .other-close {
                width: 30px;
                height: 30px;
                font-size: 12px;
                top: 8px;
                right: 8px;
            }
            .link-item {
                padding: 12px 14px;
            }
            .link-item a {
                font-size: 14px;
                gap: 10px;
            }
            .link-item a i {
                font-size: 17px;
                width: 20px;
            }
            .theme-dot {
                width: 36px;
                height: 24px;
            }
        }
    </style>
</head>
<body>

    <div class="app">

        <!-- ═══════════ HEADER ═══════════ -->
        <header class="header">
            <a class="logo" href="#" onclick="return false;">
                <img src="/assets/images/PEBBLES_LOGO.png" alt="SBPebbles" class="logo-icon" />
                <span>SBPebbles</span>
            </a>
            <div class="header-actions">
                <a class="social-btn" href="https://music.youtube.com/channel/UCeQVW-kjGwlDklf77UMk94g" target="_blank" rel="noopener" aria-label="YouTube Music"><i class="fab fa-youtube"></i></a>
                <a class="social-btn" href="https://kampebbles.bandcamp.com/community" target="_blank" rel="noopener" aria-label="Bandcamp"><i class="fab fa-bandcamp"></i></a>
                <a class="social-btn" href="https://open.spotify.com/artist/0IwRW7bQ8mD6riQJckWVG4" target="_blank" rel="noopener" aria-label="Spotify"><i class="fab fa-spotify"></i></a>
                <a class="social-btn" href="https://www.tiktok.com/@kampebbles" target="_blank" rel="noopener" aria-label="TikTok"><i class="fab fa-tiktok"></i></a>
                <a class="social-btn" href="https://discord.gg/JQ4W6F5unx" target="_blank" rel="noopener" aria-label="Discord"><i class="fab fa-discord"></i></a>
                <a class="contact-btn" href="mailto:sbpebbles298@gmail.com"><i class="fas fa-envelope"></i> CONTACT</a>
            </div>
        </header>

        <!-- ═══════════ BOTTOM NAV ═══════════ -->
        <nav class="bottom-nav" aria-label="Main navigation">
            <button class="nav-btn active" data-panel="hub"><i class="fas fa-compact-disc"></i> <span>Hub</span></button>
            <button class="nav-btn" data-panel="news"><i class="fas fa-bullhorn"></i> <span>News</span> <span class="badge" id="newsBadge">9</span></button>
            <button class="nav-btn" data-panel="other"><i class="fas fa-palette"></i> <span>Other</span></button>
            <button class="nav-btn" data-panel="links"><i class="fas fa-link"></i> <span>Links</span></button>
        </nav>

        <!-- ═══════════ PANELS ═══════════ -->
        <main>

            <!-- ─── HUB ─── -->
            <section class="panel active" id="hubPanel">
                <div class="now-playing-strip np-strip" id="npStrip">
                    <span class="np-label"><i class="fas fa-play"></i> now</span>
                    <span class="np-title" id="npTitle">Select a track</span>
                    <span class="np-dots paused" id="npIndicator">
                        <span></span><span></span><span></span>
                    </span>
                </div>

                <div class="player-card">
                    <div class="player-grid">
                        <div class="cover-wrapper" id="coverWrapper">
                            <img id="coverImg" src="" alt="Cover" style="display:none;">
                            <div class="cover-fallback" id="coverFallback"><i class="fas fa-music"></i></div>
                            <div class="ring"></div>
                        </div>
                        <div>
                            <div class="track-info">
                                <div class="title" id="trackTitle">—</div>
                                <div class="artist" id="trackArtist">SBPebbles</div>
                            </div>
                            <div class="controls">
                                <button class="ctrl-btn" id="prevBtn" aria-label="Previous"><i class="fas fa-backward-step"></i></button>
                                <button class="play-btn" id="playBtn" aria-label="Play/Pause"><i class="fas fa-play" id="playIcon"></i></button>
                                <button class="ctrl-btn" id="nextBtn" aria-label="Next"><i class="fas fa-forward-step"></i></button>
                                <button class="ctrl-btn" id="copyLinkBtn" aria-label="Copy link"><i class="fas fa-link"></i></button>
                                <div class="volume-group">
                                    <button class="ctrl-btn" id="volIconBtn" aria-label="Toggle mute"><i class="fas fa-volume-high" id="volIcon"></i></button>
                                    <input type="range" id="volumeSlider" min="0" max="1" step="0.02" value="0.8" aria-label="Volume">
                                </div>
                            </div>
                            <div class="progress-row">
                                <span id="currentTime">0:00</span>
                                <div class="progress-track" id="progressTrack"><div class="progress-fill" id="progressFill"></div></div>
                                <span id="totalTime">0:00</span>
                            </div>
                        </div>
                    </div>

                    <div class="playlist" id="playlistContainer"></div>
                </div>
                <audio id="audioPlayer" preload="metadata"></audio>
            </section>

            /* ── STATE ── */
            let currentIndex = 0;

            const announcementsContainer = document.getElementById('announcementsContainer');
            const announcementCount = document.getElementById('announcementCount');
            const newsBadge = document.getElementById('newsBadge');

            const otherCount = document.getElementById('otherCount');
            const copyLinkBtn = document.getElementById('copyLinkBtn');
            const navBtns = document.querySelectorAll('.nav-btn');
            const panels = {
                hub: document.getElementById('hubPanel'),
                news: document.getElementById('newsPanel'),
                other: document.getElementById('otherPanel'),
                links: document.getElementById('linksPanel')
            };
            const themeDots = document.querySelectorAll('.theme-dot');

            /* ── HELPERS ── */
            const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
            const fmt = t => { if (!t || isNaN(t) || !isFinite(t)) return '0:00'; const m = Math.floor(t / 60),
                    s = Math.floor(t % 60); return m + ':' + String(s).padStart(2, '0'); };
            const esc = s => String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;',
                "'": '&#39;' } [m] || m));

            /* ── THEME ── */
            function setTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                themeDots.forEach(d => d.classList.toggle('selected', d.dataset.theme === theme));
                try { localStorage.setItem(STORAGE_KEY, theme); } catch (_) {}
            }

            function loadTheme() {
                let theme = 'midnight';
                try { const s = localStorage.getItem(STORAGE_KEY); if (s && THEMES.includes(s)) theme = s; } catch (_) {}
                setTheme(theme);
            }
            themeDots.forEach(d => d.addEventListener('click', () => setTheme(d.dataset.theme)));

            /* ── NAVIGATION WITH SLIDE EFFECT ── */
            const PAGE_ORDER = ['hub', 'news', 'other', 'links'];

            function switchPage(pageId) {
                if (pageId === currentPage) return;
                const oldIdx = PAGE_ORDER.indexOf(currentPage);
                const newIdx = PAGE_ORDER.indexOf(pageId);
                const direction = newIdx > oldIdx ? 'right' : 'left';

                navBtns.forEach(b => b.classList.toggle('active', b.dataset.panel === pageId));
                Object.keys(panels).forEach(k => {
                    panels[k].classList.toggle('active', k === pageId);
                    panels[k].classList.remove('slide-left', 'slide-right');
                });

                const activePanel = panels[pageId];
                activePanel.classList.add(direction === 'right' ? 'slide-right' : 'slide-left');
                currentPage = pageId;
            }
            navBtns.forEach(b => b.addEventListener('click', () => switchPage(b.dataset.panel)));

            /* ── ANNOUNCEMENTS ── */
            function renderAnnouncements() {
                announcementsContainer.innerHTML = '';
                ANNOUNCEMENTS.forEach((ann, idx) => {
                    const card = document.createElement('div');
                    card.className = 'news-card';
                    const tagsHtml = ann.tags ? ann.tags.map(t => `<span class="chip">${esc(t)}</span>`).join(' ') :
                        '';
                    const linksHtml = ann.links && ann.links.length ? ann.links.map(l =>
                        `<a href="${esc(l.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation();">${esc(l.label)}</a>`
                    ).join(' · ') : '';
                    const isNew = idx < 2;
                    card.innerHTML = `
                        <div class="news-summary">
                            <img src="${esc(ann.cover)}" alt="${esc(ann.title)}" loading="lazy" onerror="this.style.visibility='hidden'" />
                            <div class="info">
                                <h4>${esc(ann.title)} ${isNew ? '<span class="new-badge">New</span>' : ''}</h4>
                                <p>${esc(ann.description)}</p>
                            </div>
                            <span class="chevron"><i class="fas fa-chevron-right"></i></span>
                        </div>
                        <div class="news-details">
                            ${ann.fullDescription ? `<div class="row"><span class="label">About</span><span class="value">${esc(ann.fullDescription)}</span></div>` : ''}
                            ${ann.releaseDate ? `<div class="row"><span class="label">Released</span><span class="value">${esc(ann.releaseDate)}</span></div>` : ''}
                            ${tagsHtml ? `<div class="row"><span class="label">Tags</span><span class="value">${tagsHtml}</span></div>` : ''}
                            ${linksHtml ? `<div class="row"><span class="label">Links</span><span class="value">${linksHtml}</span></div>` : ''}
                        </div>
                    `;
                    const toggle = e => {
                        if (e.target.closest('a')) return;
                        card.classList.toggle('open');
                    };
                    card.querySelector('.news-summary').addEventListener('click', toggle);
                    announcementsContainer.appendChild(card);
                });
                announcementCount.textContent = ANNOUNCEMENTS.length + ' new';
                newsBadge.textContent = ANNOUNCEMENTS.length;
            }

            /* ── OTHER PROJECTS ── */
            function renderOther() {
                otherGrid.innerHTML = '';
                OTHER_ITEMS.forEach((item, idx) => {
                    const div = document.createElement('div');
                    div.className = 'other-item';

                    const hasImage = item.image && item.image.trim() !== '';
                    const imgHtml = hasImage ?
                        `<img src="${esc(item.image)}" alt="${esc(item.title)}" loading="lazy" onerror="this.style.display='none'; this.parentElement.querySelector('.fallback').style.display='grid';" />` :
                        '';

                    div.innerHTML = `
                        ${imgHtml}
                        ${!hasImage ? `<div class="fallback"><i class="fas fa-image"></i></div>` : ''}
                        <button class="other-close" aria-label="Close"><i class="fas fa-times"></i></button>
                        <div class="other-overlay">
                            <h4>${esc(item.title)}</h4>
                            <p>${esc(item.description)}</p>
                        </div>
                    `;

                    const closeBtn = div.querySelector('.other-close');
                    const expand = e => {
                        if (e && e.target.closest('.other-close')) return;
                        const was = div.classList.contains('expanded');
                        document.querySelectorAll('.other-item.expanded').forEach(el => { if (el !== div) el
                                .classList.remove('expanded'); });
                        div.classList.toggle('expanded', !was);
                        document.body.style.overflow = div.classList.contains('expanded') ? 'hidden' : '';
                    };
                    const collapse = e => {
                        e.stopPropagation();
                        div.classList.remove('expanded');
                        document.body.style.overflow = '';
                    };
                    div.addEventListener('click', expand);
                    closeBtn.addEventListener('click', collapse);
                    div.addEventListener('keydown', e => {
                        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault();
                            expand(e); }
                        if (e.key === 'Escape') collapse(e);
                    });
                    otherGrid.appendChild(div);
                });
                otherCount.textContent = OTHER_ITEMS.length + ' items';
            }

            /* ── PLAYER CORE ── */
            function loadTrack(index, autoplay = false) {
                const track = TRACKS[index];
                if (!track) return;
                currentIndex = index;
                trackTitle.textContent = track.title;
                trackArtist.textContent = track.artist;
                npTitle.textContent = track.title;

                if (track.cover) {
                    coverImg.src = track.cover;
                    coverImg.style.display = 'block';
                    coverFallback.style.display = 'none';
                    coverImg.onerror = () => { coverImg.style.display = 'none';
                        coverFallback.style.display = 'grid'; };
                    coverImg.onload = () => { coverImg.style.display = 'block';
                        coverFallback.style.display = 'none'; };
                } else {
                    coverImg.style.display = 'none';
                    coverFallback.style.display = 'grid';
                }

                audio.src = track.src;
                audio.load();
                progressFill.style.width = '0%';
                currentTimeLabel.textContent = '0:00';
                totalTimeLabel.textContent = track.duration || '0:00';
                updatePlaylistUI();
                updateCoverState();
                updateNPState();
                if (autoplay) {
                    audio.play().catch(() => {});
                }
                window.location.hash = slug(track.title);
            }

            function updateCoverState() {
                coverWrapper.classList.toggle('playing', isPlaying && !!audio.src);
            }

            function updateNPState() {
                npStrip.classList.toggle('playing', isPlaying && !!audio.src);
                npIndicator.className = (isPlaying && !!audio.src) ? 'np-dots' : 'np-dots paused';
            }

            function updatePlaylistUI() {
                document.querySelectorAll('.pl-item').forEach((el, i) => {
                    el.classList.toggle('active', i === currentIndex);
                    const icon = el.querySelector('.pl-icon i');
                    if (icon) {
                        const active = i === currentIndex && isPlaying;
                        icon.className = `fas ${active ? 'fa-volume-high' : 'fa-play'}`;
                        el.querySelector('.pl-icon').classList.toggle('playing', active);
                    }
                });
            }

            function updatePlayBtn() {
                playIcon.className = isPlaying ? 'fas fa-pause' : 'fas fa-play';
                playBtn.setAttribute('aria-label', isPlaying ? 'Pause' : 'Play');
            }

            function play() {
                audio.play().catch(() => {});
                isPlaying = true;
                updatePlayBtn();
                updatePlaylistUI();
                updateCoverState();
                updateNPState();
            }

            function pause() {
                audio.pause();
                isPlaying = false;
                updatePlayBtn();
                updatePlaylistUI();
                updateCoverState();
                updateNPState();
            }

            function togglePlay() { audio.paused ? play() : pause(); }

            function nextTrack() {
                const idx = (currentIndex + 1) % TRACKS.length;
                loadTrack(idx, true);
            }

            function prevTrack() {
                const idx = (currentIndex - 1 + TRACKS.length) % TRACKS.length;
                loadTrack(idx, true);
            }

            function findTrackBySlug(s) {
                if (!s) return -1;
                return TRACKS.findIndex(t => slug(t.title) === s);
            }

            function handleHashChange() {
                const hash = window.location.hash.substring(1);
                if (!hash) return;
                const idx = findTrackBySlug(hash);
                if (idx >= 0 && idx !== currentIndex) {
                    loadTrack(idx, false);
                }
            }
            window.addEventListener('hashchange', handleHashChange);

            /* ── PLAYLIST RENDER ── */
            function renderPlaylist() {
                playlistContainer.innerHTML = '';
                TRACKS.forEach((track, idx) => {
                    const item = document.createElement('div');
                    item.className = 'pl-item' + (idx === currentIndex ? ' active' : '');
                    item.dataset.index = idx;
                    const active = idx === currentIndex && isPlaying;
                    item.innerHTML = `
                        <span class="idx">${String(idx+1).padStart(2,'0')}</span>
                        <div class="info"><span class="title">${esc(track.title)}</span><span class="artist">${esc(track.artist)}</span></div>
                        <span class="dur">${track.duration||'—'}</span>
                        <span class="pl-icon${active ? ' playing' : ''}"><i class="fas ${active ? 'fa-volume-high' : 'fa-play'}"></i></span>
                    `;
                    const handler = () => {
                        if (idx === currentIndex) { togglePlay(); } else {
                            loadTrack(idx, true);
                        }
                    };
                    item.addEventListener('click', handler);
                    item.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e
                            .preventDefault();
                            handler(); } });
                    playlistContainer.appendChild(item);
                });
            }

            /* ── COPY LINK ── */
            function copyCurrentLink() {
                const track = TRACKS[currentIndex];
                if (!track) return;
                const url = window.location.href.split('#')[0] + '#' + slug(track.title);
                navigator.clipboard.writeText(url).then(() => {
                    const orig = copyLinkBtn.innerHTML;
                    copyLinkBtn.innerHTML = '<i class="fas fa-check"></i>';
                    setTimeout(() => { copyLinkBtn.innerHTML = orig; }, 1500);
                }).catch(() => alert('Could not copy link'));
            }

            /* ── VOLUME ── */
            function updateVolumeIcon() {
                const v = parseFloat(volumeSlider.value);
                if (v === 0) volIcon.className = 'fas fa-volume-xmark';
                else if (v < 0.4) volIcon.className = 'fas fa-volume-low';
                else volIcon.className = 'fas fa-volume-high';
            }

            function toggleMute() {
                const v = parseFloat(volumeSlider.value);
                if (v > 0) {
                    previousVolume = v;
                    volumeSlider.value = 0;
                    audio.volume = 0;
                } else {
                    const restore = previousVolume || 0.8;
                    volumeSlider.value = restore;
                    audio.volume = restore;
                }
                updateVolumeIcon();
            }

            function updateProgress() {
                if (isDragging) return;
                if (audio.duration && !isNaN(audio.duration) && isFinite(audio.duration)) {
                    const p = (audio.currentTime / audio.duration) * 100;
                    progressFill.style.width = Math.min(p, 100) + '%';
                    currentTimeLabel.textContent = fmt(audio.currentTime);
                    totalTimeLabel.textContent = fmt(audio.duration);
                }
            }

            /* ── SEEK ── */
            function seekFromClientX(clientX) {
                const rect = progressTrack.getBoundingClientRect();
                const x = Math.min(Math.max((clientX - rect.left) / rect.width, 0), 1);
                if (audio.duration && !isNaN(audio.duration) && isFinite(audio.duration)) {
                    audio.currentTime = x * audio.duration;
                    progressFill.style.width = (x * 100) + '%';
                    currentTimeLabel.textContent = fmt(audio.currentTime);
                }
            }

            function seekMouse(e) { seekFromClientX(e.clientX); }

            function seekTouch(e) { if (e.touches.length) seekFromClientX(e.touches[0].clientX); }

            /* ── EVENT BINDINGS ── */
            playBtn.addEventListener('click', togglePlay);
            prevBtn.addEventListener('click', prevTrack);
            nextBtn.addEventListener('click', nextTrack);
            volIconBtn.addEventListener('click', toggleMute);
            copyLinkBtn.addEventListener('click', copyCurrentLink);

            audio.addEventListener('timeupdate', updateProgress);
            audio.addEventListener('loadedmetadata', () => {
                totalTimeLabel.textContent = fmt(audio.duration);
            });
            audio.addEventListener('ended', nextTrack);
            audio.addEventListener('play', () => {
                isPlaying = true;
                updatePlayBtn();
                updatePlaylistUI();
                updateCoverState();
                updateNPState();
            });
            audio.addEventListener('pause', () => {
                isPlaying = false;
                updatePlayBtn();
                updatePlaylistUI();
                updateCoverState();
                updateNPState();
            });

            volumeSlider.addEventListener('input', () => {
                audio.volume = parseFloat(volumeSlider.value);
                updateVolumeIcon();
            });

            progressTrack.addEventListener('mousedown', e => {
                if (!audio.duration) return;
                isDragging = true;
                wasPlayingBeforeDrag = !audio.paused;
                audio.pause();
                seekMouse(e);
            });
            document.addEventListener('mousemove', e => { if (isDragging) seekMouse(e); });
            document.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    if (wasPlayingBeforeDrag) audio.play().catch(() => {});
                }
            });

            progressTrack.addEventListener('touchstart', e => {
                if (!audio.duration) return;
                isDragging = true;
                wasPlayingBeforeDrag = !audio.paused;
                audio.pause();
                seekTouch(e);
            }, { passive: true });
            progressTrack.addEventListener('touchmove', e => { if (isDragging) seekTouch(e); }, { passive: true });
            progressTrack.addEventListener('touchend', () => {
                if (isDragging) {
                    isDragging = false;
                    if (wasPlayingBeforeDrag) audio.play().catch(() => {});
                }
            }, { passive: true });

            /* ── KEYBOARD SHORTCUTS ── */
            document.addEventListener('keydown', e => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                if (e.code === 'Space') { e.preventDefault();
                    togglePlay(); }
                if (e.code === 'ArrowRight') { e.preventDefault();
                    nextTrack(); }
                if (e.code === 'ArrowLeft') { e.preventDefault();
                    prevTrack(); }
                if (e.key === 'm') { e.preventDefault();
                    toggleMute(); }
                if (e.key === 'Escape') {
                    document.querySelectorAll('.other-item.expanded').forEach(el => {
                        el.classList.remove('expanded');
                        document.body.style.overflow = '';
                    });
                }
            });

            /* ── INIT ── */
            loadTheme();
            renderPlaylist();
            renderAnnouncements();
            renderOther();

            const initialHash = window.location.hash.substring(1);
            const startIdx = initialHash ? Math.max(findTrackBySlug(initialHash), 0) : 0;
            currentIndex = startIdx;
            loadTrack(currentIndex, false);
            if (!initialHash || findTrackBySlug(initialHash) < 0) {
                window.location.hash = slug(TRACKS[currentIndex].title);
            }

            audio.volume = parseFloat(volumeSlider.value);
            updateVolumeIcon();
            npIndicator.className = 'np-dots paused';
            updateNPState();

            // ensure hub is active
            currentPage = 'hub';
            navBtns.forEach(b => b.classList.toggle('active', b.dataset.panel === 'hub'));
            Object.keys(panels).forEach(k => panels[k].classList.toggle('active', k === 'hub'));

        })();
    </script>
</body>
</html>
