<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>SBPebbles · Music Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&display=swap" rel="stylesheet" />
    <style>
        /* ── reset & vars ── */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-base: #0f0d11;
            --bg-surface: rgba(22, 20, 26, .78);
            --bg-elevated: rgba(255, 255, 255, .04);
            --text-primary: #f2ede8;
            --text-secondary: #b4a89c;
            --text-muted: #73695f;
            --accent: #e8b48c;
            --accent-glow: rgba(232, 180, 140, .25);
            --border-subtle: rgba(255, 215, 185, .06);
            --border-strong: rgba(255, 215, 185, .14);
            --shadow-card: 0 20px 60px rgba(0, 0, 0, .8);
            --glass: blur(18px);
            --radius-card: 32px;
            --radius-sm: 20px;
            --radius-full: 60px;
            --bg-gradient: radial-gradient(circle at 20% 20%, #2a2228 0%, #0b090d 80%);
            --bg-glow: radial-gradient(ellipse at 60% 10%, rgba(232, 180, 140, .06), transparent 60%);
            --nav-bg: rgba(18, 16, 22, .82);
            --input-bg: rgba(255, 255, 255, .05);
            --input-border: rgba(255, 255, 255, .1);
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
        }
        [data-theme="light"] {
            --bg-base: #f0ebe6;
            --bg-surface: rgba(255, 255, 255, .9);
            --bg-elevated: rgba(0, 0, 0, .04);
            --text-primary: #1a1a1a;
            --text-secondary: #4a4a4a;
            --text-muted: #8a8a8a;
            --accent: #d97706;
            --accent-glow: rgba(217, 119, 6, .25);
            --border-subtle: rgba(0, 0, 0, .08);
            --border-strong: rgba(0, 0, 0, .15);
            --shadow-card: 0 20px 60px rgba(0, 0, 0, .1);
            --bg-gradient: linear-gradient(135deg, #f0ebe6, #e5dcd4);
            --bg-glow: none;
            --nav-bg: rgba(255, 255, 255, .9);
            --input-bg: rgba(0, 0, 0, .04);
            --input-border: rgba(0, 0, 0, .1);
        }
        [data-theme="turquoise"] {
            --bg-base: #0a1628;
            --accent: #5fc8c8;
            --accent-glow: rgba(95, 200, 200, .3);
            --bg-gradient: radial-gradient(circle at 20% 20%, #1a2a3a, #0a1628 80%);
            --bg-glow: radial-gradient(ellipse at 60% 10%, rgba(95, 200, 200, .08), transparent 60%);
            --border-subtle: rgba(95, 200, 200, .08);
            --border-strong: rgba(95, 200, 200, .15);
            --nav-bg: rgba(10, 22, 40, .85);
        }
        [data-theme="red"] {
            --bg-base: #1a0a0a;
            --accent: #ef4444;
            --accent-glow: rgba(239, 68, 68, .3);
            --bg-gradient: radial-gradient(circle at 20% 20%, #2a1a1a, #1a0a0a 80%);
            --bg-glow: radial-gradient(ellipse at 60% 10%, rgba(239, 68, 68, .08), transparent 60%);
            --border-subtle: rgba(239, 68, 68, .08);
            --border-strong: rgba(239, 68, 68, .15);
            --nav-bg: rgba(26, 10, 10, .85);
        }
        [data-theme="purple"] {
            --bg-base: #0f0a1a;
            --accent: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, .3);
            --bg-gradient: radial-gradient(circle at 20% 20%, #1f1a2a, #0f0a1a 80%);
            --bg-glow: radial-gradient(ellipse at 60% 10%, rgba(139, 92, 246, .08), transparent 60%);
            --border-subtle: rgba(139, 92, 246, .08);
            --border-strong: rgba(139, 92, 246, .15);
            --nav-bg: rgba(15, 10, 26, .85);
        }
        [data-theme="green"] {
            --bg-base: #0a1a0a;
            --accent: #34d399;
            --accent-glow: rgba(52, 211, 153, .3);
            --bg-gradient: radial-gradient(circle at 20% 20%, #1a2a1a, #0a1a0a 80%);
            --bg-glow: radial-gradient(ellipse at 60% 10%, rgba(52, 211, 153, .08), transparent 60%);
            --border-subtle: rgba(52, 211, 153, .08);
            --border-strong: rgba(52, 211, 153, .15);
            --nav-bg: rgba(10, 26, 10, .85);
        }
        [data-theme="ocean"] {
            --bg-base: #0a1628;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, .3);
            --bg-gradient: radial-gradient(circle at 20% 20%, #1a2540, #0a1628 80%);
            --bg-glow: radial-gradient(ellipse at 60% 10%, rgba(59, 130, 246, .08), transparent 60%);
            --border-subtle: rgba(59, 130, 246, .08);
            --border-strong: rgba(59, 130, 246, .15);
            --nav-bg: rgba(10, 22, 40, .85);
        }
        [data-theme="sunset"] {
            --bg-base: #1a1008;
            --accent: #f59e0b;
            --accent-glow: rgba(245, 158, 11, .3);
            --bg-gradient: radial-gradient(circle at 20% 20%, #2a1f14, #1a1008 80%);
            --bg-glow: radial-gradient(ellipse at 60% 10%, rgba(245, 158, 11, .08), transparent 60%);
            --border-subtle: rgba(245, 158, 11, .08);
            --border-strong: rgba(245, 158, 11, .15);
            --nav-bg: rgba(26, 16, 8, .85);
        }
        [data-theme="rainbow"] {
            --bg-base: #0f0d11;
            --accent: #ff6b6b;
            --accent-glow: rgba(255, 107, 107, .3);
            --bg-gradient: radial-gradient(circle at 20% 20%, #ff6b6b15, #0f0d11 80%);
            --bg-glow: radial-gradient(ellipse at 60% 10%, rgba(255, 107, 107, .08), transparent 60%);
            --border-subtle: rgba(255, 107, 107, .08);
            --border-strong: rgba(255, 107, 107, .15);
            --nav-bg: rgba(15, 13, 17, .85);
        }
        [data-theme="candy"] {
            --bg-base: #1a0a1a;
            --accent: #ff6b9d;
            --accent-glow: rgba(255, 107, 157, .3);
            --bg-gradient: radial-gradient(circle at 20% 20%, #2a1a2a, #1a0a1a 80%);
            --bg-glow: radial-gradient(ellipse at 60% 10%, rgba(255, 107, 157, .08), transparent 60%);
            --border-subtle: rgba(255, 107, 157, .08);
            --border-strong: rgba(255, 107, 157, .15);
            --nav-bg: rgba(26, 10, 26, .85);
        }
        [data-theme="forest"] {
            --bg-base: #0a1a0f;
            --accent: #4ade80;
            --accent-glow: rgba(74, 222, 128, .3);
            --bg-gradient: radial-gradient(circle at 20% 20%, #1a2a1f, #0a1a0f 80%);
            --bg-glow: radial-gradient(ellipse at 60% 10%, rgba(74, 222, 128, .08), transparent 60%);
            --border-subtle: rgba(74, 222, 128, .08);
            --border-strong: rgba(74, 222, 128, .15);
            --nav-bg: rgba(10, 26, 15, .85);
        }
        [data-theme="neon"] {
            --bg-base: #080c16;
            --accent: #00f5ff;
            --accent-glow: rgba(0, 245, 255, .4);
            --bg-gradient: radial-gradient(circle at 20% 20%, #1a1a2a, #080c16 80%);
            --bg-glow: radial-gradient(ellipse at 60% 10%, rgba(0, 245, 255, .1), transparent 60%);
            --border-subtle: rgba(0, 245, 255, .1);
            --border-strong: rgba(0, 245, 255, .2);
            --nav-bg: rgba(8, 12, 22, .9);
        }

        /* ── base ── */
        html {
            font-family: "Inter", system-ui, -apple-system, sans-serif;
            background: var(--bg-base);
            color: var(--text-primary);
            transition: background .5s, color .3s;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            padding-top: 5.5rem;
            background: var(--bg-gradient);
            background-attachment: fixed;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: var(--bg-glow);
            transition: background .5s;
        }

        /* ── nav ── */
        .top-nav {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%) translateY(-150%);
            z-index: 2000;
            background: var(--nav-bg);
            backdrop-filter: var(--glass);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-full);
            padding: .5rem 1.4rem;
            display: flex;
            gap: .3rem;
            transition: transform .5s cubic-bezier(.22, 1, .36, 1), opacity .3s, background .5s, border-color .5s;
            opacity: 0;
            pointer-events: none;
            box-shadow: 0 12px 40px rgba(0, 0, 0, .6);
        }
        .top-nav.visible {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
            pointer-events: auto;
        }
        .top-nav .nav-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-family: inherit;
            font-weight: 500;
            font-size: .8rem;
            padding: .4rem 1.2rem;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: .5rem;
            transition: all .25s;
            cursor: pointer;
            letter-spacing: .01em;
        }
        .top-nav .nav-btn i {
            font-size: .8rem;
            transition: transform .2s;
        }
        .top-nav .nav-btn:hover {
            background: rgba(255, 255, 255, .05);
            color: #fff;
        }
        .top-nav .nav-btn.active {
            background: var(--accent);
            color: #0f0d11;
            box-shadow: 0 4px 20px var(--accent-glow);
        }
        .top-nav .nav-btn.active i {
            color: #0f0d11;
        }
        .nav-trigger-zone {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 70px;
            z-index: 1999;
            pointer-events: none;
        }

        /* ── slider ── */
        .page-slider {
            width: 100%;
            max-width: 1100px;
            border-radius: var(--radius-card);
            overflow: hidden;
            box-shadow: var(--shadow-card), 0 0 0 1px var(--border-subtle);
            background: var(--bg-surface);
            backdrop-filter: var(--glass);
            transition: box-shadow .3s, background .5s;
        }
        .page-slider-inner {
            display: flex;
            width: 200%;
            transform: translateX(0);
            transition: transform .7s cubic-bezier(.22, 1, .36, 1);
        }
        .page-slider-inner.slide-announcements {
            transform: translateX(-50%);
        }
        .page-slide {
            width: 50%;
            flex-shrink: 0;
            padding: 2.8rem 2.8rem 2.2rem;
            min-height: 520px;
            position: relative;
        }

        /* ── hub header ── */
        .hub-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            gap: .8rem 1.2rem;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: .6rem;
        }
        .brand-icon {
            font-size: 2.2rem;
            color: var(--accent);
            filter: drop-shadow(0 0 14px var(--accent-glow));
        }
        .brand h1 {
            font-size: 1.9rem;
            font-weight: 600;
            letter-spacing: -.02em;
            background: linear-gradient(135deg, #fff 30%, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .social-links {
            display: flex;
            gap: .5rem;
            flex-wrap: wrap;
        }
        .social-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .04);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: all .25s;
            text-decoration: none;
        }
        .social-btn:hover {
            background: rgba(255, 255, 255, .08);
            transform: translateY(-3px) scale(1.05);
            border-color: var(--accent);
            color: #fff;
            box-shadow: 0 8px 24px var(--accent-glow);
        }
        .tagline {
            font-size: .75rem;
            background: rgba(255, 255, 255, .04);
            padding: .3rem 1rem;
            border-radius: var(--radius-full);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            display: inline-flex;
            align-items: center;
            gap: .4rem;
        }
        .tagline i {
            color: var(--accent);
            font-size: .65rem;
        }

        /* ── now playing strip ── */
        .now-playing-strip {
            display: flex;
            align-items: center;
            gap: .8rem;
            background: rgba(255, 255, 255, .03);
            padding: .4rem 1.2rem .4rem 1rem;
            border-radius: var(--radius-full);
            border: 1px solid var(--border-subtle);
            backdrop-filter: blur(6px);
            margin-bottom: 1.6rem;
            transition: .3s;
        }
        .now-playing-strip .np-label {
            font-size: .6rem;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: var(--text-muted);
            font-weight: 500;
        }
        .now-playing-strip .np-label i {
            margin-right: .2rem;
            color: var(--accent);
        }
        .np-title {
            font-weight: 500;
            font-size: .9rem;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .np-indicator {
            display: flex;
            gap: .2rem;
        }
        .np-indicator .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--accent);
            display: inline-block;
            animation: pulseDot 1.2s ease-in-out infinite;
        }
        .np-indicator .dot:nth-child(2) {
            animation-delay: .2s;
        }
        .np-indicator .dot:nth-child(3) {
            animation-delay: .4s;
        }
        .np-indicator.paused .dot {
            animation: none;
            opacity: .25;
        }
        @keyframes pulseDot {
            0%,
            100% {
                transform: scale(.6);
                opacity: .3;
            }
            50% {
                transform: scale(1.3);
                opacity: 1;
            }
        }

        /* ── player grid ── */
        .player-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 2.2rem;
            align-items: flex-start;
        }
        .cover-wrapper {
            flex: 0 0 180px;
            width: 180px;
            height: 180px;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 24px 48px -12px rgba(0, 0, 0, .7);
            background: #1e1a1f;
            position: relative;
            transition: transform .3s ease, box-shadow .3s;
        }
        .cover-wrapper:hover {
            transform: scale(1.02) translateY(-4px);
            box-shadow: 0 32px 64px -12px rgba(0, 0, 0, .8);
        }
        .cover-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .cover-fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1e1a1f;
            color: var(--accent);
            font-size: 3.6rem;
            opacity: .5;
        }
        .cover-wrapper .visualizer-ring {
            position: absolute;
            inset: -4px;
            border-radius: 32px;
            border: 2px solid transparent;
            transition: .4s;
            pointer-events: none;
        }
        .cover-wrapper.is-playing .visualizer-ring {
            border-color: var(--accent);
            animation: ringPulse 1.6s ease-in-out infinite;
        }
        @keyframes ringPulse {
            0%,
            100% {
                transform: scale(1);
                opacity: .3;
            }
            50% {
                transform: scale(1.04);
                opacity: .7;
            }
        }

        /* ── controls ── */
        .controls-col {
            flex: 1;
            min-width: 200px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .track-info .track-name {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -.01em;
            line-height: 1.2;
        }
        .track-info .track-artist {
            font-size: .95rem;
            color: var(--text-secondary);
        }
        .playback-controls {
            display: flex;
            align-items: center;
            gap: .75rem;
            flex-wrap: wrap;
        }
        .play-btn {
            width: 56px;
            height: 56px;
            min-width: 56px;
            min-height: 56px;
            border-radius: 50%;
            border: none;
            background: var(--accent);
            color: #0f0d11;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all .25s;
            box-shadow: 0 8px 28px var(--accent-glow);
            flex-shrink: 0;
            aspect-ratio: 1/1;
        }
        .play-btn:hover {
            transform: scale(1.06) translateY(-2px);
            box-shadow: 0 12px 36px var(--accent-glow);
        }
        .play-btn:active {
            transform: scale(.92);
        }
        .secondary-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.1rem;
            padding: .4rem;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            min-width: 44px;
            min-height: 44px;
            transition: .2s;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .secondary-btn:hover {
            background: rgba(255, 255, 255, .05);
            color: #fff;
        }

        .volume-wrap {
            display: flex;
            align-items: center;
            gap: .4rem;
            margin-left: auto;
            flex-shrink: 1;
            min-width: 0;
        }
        .volume-wrap .vol-icon-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1rem;
            padding: .2rem;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            min-width: 32px;
            min-height: 32px;
            cursor: pointer;
            transition: .2s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .volume-wrap .vol-icon-btn:hover {
            background: rgba(255, 255, 255, .05);
            color: #fff;
        }
        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 80px;
            max-width: 80px;
            min-width: 40px;
            height: 4px;
            border-radius: 4px;
            background: #2f292e;
            outline: none;
            transition: .2s;
            cursor: pointer;
            flex-shrink: 1;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 16px var(--accent-glow);
            cursor: pointer;
        }
        .volume-slider::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            box-shadow: 0 0 16px var(--accent-glow);
        }

        /* ── progress ── */
        .progress-area {
            display: flex;
            align-items: center;
            gap: .8rem;
        }
        .time-label {
            font-size: .75rem;
            color: var(--text-secondary);
            min-width: 40px;
            font-variant-numeric: tabular-nums;
            flex-shrink: 0;
        }
        .progress-track {
            flex: 1;
            height: 4px;
            border-radius: 20px;
            background: #2f292e;
            cursor: pointer;
            position: relative;
            transition: height .2s;
            min-height: 28px;
            display: flex;
            align-items: center;
        }
        .progress-track:hover {
            height: 7px;
        }
        .progress-fill {
            height: 100%;
            width: 0;
            border-radius: 20px;
            background: linear-gradient(90deg, var(--accent), #dba07a);
            transition: width .08s linear;
            pointer-events: none;
        }

        /* ── playlist ── */
        .playlist-section {
            margin-top: 1.8rem;
            border-top: 1px solid var(--border-subtle);
            padding-top: 1.6rem;
        }
        .playlist-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: .8rem;
        }
        .playlist-header h3 {
            font-size: .8rem;
            text-transform: uppercase;
            letter-spacing: .06em;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .playlist-header .count {
            font-size: .7rem;
            background: rgba(255, 255, 255, .04);
            padding: .2rem .8rem;
            border-radius: 30px;
            color: var(--text-muted);
        }
        .playlist {
            display: flex;
            flex-direction: column;
            gap: .2rem;
            max-height: 260px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .playlist::-webkit-scrollbar {
            width: 4px;
        }
        .playlist::-webkit-scrollbar-thumb {
            background: #3d353b;
            border-radius: 8px;
        }
        .playlist-item {
            display: flex;
            align-items: center;
            gap: .8rem;
            padding: .6rem .8rem;
            border-radius: 16px;
            transition: all .2s;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .playlist-item:hover {
            background: rgba(255, 255, 255, .03);
            border-color: var(--border-subtle);
            transform: scale(.98);
        }
        .playlist-item.active {
            background: rgba(232, 180, 140, .08);
            border-color: rgba(232, 180, 140, .15);
        }
        .playlist-item .idx {
            font-size: .7rem;
            color: var(--text-muted);
            min-width: 24px;
            text-align: center;
            flex-shrink: 0;
        }
        .playlist-item .pl-info {
            flex: 1;

                { title: 'Grape Smarties', description: 'New release!', cover: 'https://i.imgur.com/aTWPtqq.jpeg',
                    fullDescription: '"Grape Smarties" is out now!', releaseDate: 'August 1, 2026', links: [{ label: 'Spotify', url: 'https://open.spotify.com/track/5Fa8JN7lP3nb5XD0v7PnbB' }, { label: 'YT Music', url: 'hhttps://music.youtube.com/watch?v=7kla07C17ag' }],
                    tags: ['Single', 'Indie'] },
                { title: 'White-Raspberry Smarties', description: 'New release!', cover: 'https://i.imgur.com/cAhBoDq.jpeg',
                    fullDescription: '"White-Raspberry Smarties" is out now!', releaseDate: 'August 1, 2026', links: [{ label: 'Spotify', url: 'https://open.spotify.com/track/1dKIYjjABgc8WEIcJHpe94' }, { label: 'YT Music', url: 'https://music.youtube.com/watch?v=aCh0smdSEZk' }],
                    tags: ['Single', 'Indie'] }
            ];

            let tracks = [...DEFAULT_TRACKS],
                announcements = [...DEFAULT_ANNOUNCEMENTS];
            const audio = document.getElementById('audioPlayer'),
                playBtn = document.getElementById('playBtn'),
                playIcon = document.getElementById('playIcon'),
                prevBtn = document.getElementById('prevBtn'),
                nextBtn = document.getElementById('nextBtn'),
                progressFill = document.getElementById('progressFill'),
                progressTrack = document.getElementById('progressTrack'),
                currentTimeLabel = document.getElementById('currentTime'),
                totalTimeLabel = document.getElementById('totalTime'),
                volumeSlider = document.getElementById('volumeSlider'),
                volIcon = document.getElementById('volIcon'),
                volIconBtn = document.getElementById('volIconBtn'),
                trackName = document.getElementById('trackName'),
                trackArtist = document.getElementById('trackArtist'),
                npTitle = document.getElementById('npTitle'),
                npIndicator = document.getElementById('npIndicator'),
                coverImg = document.getElementById('coverImg'),
                coverFallback = document.getElementById('coverFallback'),
                coverWrapper = document.getElementById('coverWrapper'),
                playlistContainer = document.getElementById('playlistContainer'),
                trackCount = document.getElementById('trackCount'),
                announcementsContainer = document.getElementById('announcementsContainer'),
                announcementCount = document.getElementById('announcementCount'),
                pageSlider = document.getElementById('pageSlider'),
                topNav = document.getElementById('topNav'),
                copyLinkBtn = document.getElementById('copyLinkBtn');
            const themeDots = document.querySelectorAll('.theme-dot');

            function setTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                themeDots.forEach(d => d.classList.toggle('active', d.dataset.theme === theme));
                try { localStorage.setItem(STORAGE_KEY_THEME, theme); } catch (_) {}
            }

            function loadTheme() {
                let theme = 'dark';
                try { const s = localStorage.getItem(STORAGE_KEY_THEME); if (s) theme = s; } catch (_) {}
                const valid = ['dark', 'light', 'turquoise', 'red', 'purple', 'green', 'ocean', 'sunset', 'rainbow', 'candy',
                    'forest', 'neon'
                ];
                if (!valid.includes(theme)) theme = 'dark';
                setTheme(theme);
            }
            themeDots.forEach(d => d.addEventListener('click', () => setTheme(d.dataset.theme)));

            let navVisible = false,
                navTimeout = null;

            function showNav() { if (!navVisible) { navVisible = true;
                    topNav.classList.add('visible'); } }

            function hideNav() { if (navVisible) { navVisible = false;
                    topNav.classList.remove('visible'); } }

            function isMobile() { return window.innerWidth <= 720; }
            document.addEventListener('mousemove', (e) => {
                if (isMobile()) return;
                if (e.clientY < 80) { showNav();
                    clearTimeout(navTimeout); } else if (navVisible) {
                    clearTimeout(navTimeout);
                    navTimeout = setTimeout(() => {
                        const r = topNav.getBoundingClientRect();
                        if (!(e.clientY >= r.top && e.clientY <= r.bottom && e.clientX >= r.left && e.clientX <= r
                            .right)) hideNav();
                    }, 400);
                }
            });
            if (!isMobile()) { setTimeout(() => { showNav();
                    setTimeout(hideNav, 1800); }, 400); } else { topNav.classList.add('visible'); }

            let currentPage = 'hub';

            function switchPage(pageId) {
                if (pageId === currentPage) return;
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.page === pageId));
                if (pageId === 'hub') pageSlider.classList.remove('slide-announcements');
                else if (pageId === 'announcements') pageSlider.classList.add('slide-announcements');
                currentPage = pageId;
            }
            document.querySelectorAll('.nav-btn').forEach(b => b.addEventListener('click', () => switchPage(b.dataset.page)));

            function renderAnnouncements() {
                announcementsContainer.innerHTML = '';
                announcements.forEach((ann) => {
                    const card = document.createElement('div');
                    card.className = 'announcement-card';
                    card.setAttribute('role', 'button');
                    card.setAttribute('tabindex', '0');
                    const tagsHtml = ann.tags ? ann.tags.map(t => `<span class="tag">${t}</span>`).join(' ') : '';
                    const linksHtml = ann.links ? ann.links.map(l =>
                        `<a href="${l.url}" target="_blank" rel="noopener" onclick="event.stopPropagation();">${l.label}</a>`
                        ).join(' · ') : '';
                    card.innerHTML = `
                        <div class="card-summary">
                            <img src="${ann.cover}" alt="${ann.title}" loading="lazy" />
                            <div class="info"><h4>${ann.title}</h4><p>${ann.description}</p></div>
                            <span class="badge">New</span>
                            <span class="expand-icon"><i class="fas fa-chevron-down"></i></span>
                        </div>
                        <div class="card-details">
                            ${ann.fullDescription ? `<div class="detail-row"><span class="detail-label">About</span><span class="detail-value">${ann.fullDescription}</span></div>` : ''}
                            ${ann.releaseDate ? `<div class="detail-row"><span class="detail-label">Released</span><span class="detail-value">${ann.releaseDate}</span></div>` : ''}
                            ${tagsHtml ? `<div class="detail-row"><span class="detail-label">Tags</span><span class="detail-value">${tagsHtml}</span></div>` : ''}
                            ${linksHtml ? `<div class="detail-row"><span class="detail-label">Links</span><span class="detail-value">${linksHtml}</span></div>` : ''}
                        </div>
                    `;
                    const toggle = (e) => { if (e.target.closest('a')) return;
                        card.classList.toggle('expanded'); };
                    card.addEventListener('click', toggle);
                    card.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault();
                            toggle(e); } });
                    announcementsContainer.appendChild(card);
                });
                announcementCount.textContent = `${announcements.length} new`;
            }

            let currentIndex = 0,
                isPlaying = false,
                isDragging = false,
                wasPlayingBeforeDrag = false,
                previousVolume = .8;

            function getSlug(title) { return title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, ''); }

            function updateHashForTrack(index) {
                const track = tracks[index];
                window.location.hash = track && track.title ? getSlug(track.title) : '';
            }

            function copyCurrentLink() {
                const track = tracks[currentIndex];
                if (!track) return;
                const url = window.location.href.split('#')[0] + '#' + getSlug(track.title);
                navigator.clipboard.writeText(url).then(() => {
                    const original = copyLinkBtn.innerHTML;
                    copyLinkBtn.innerHTML = '<i class="fas fa-check"></i>';
                    setTimeout(() => { copyLinkBtn.innerHTML = original; }, 1500);
                }).catch(() => alert('Could not copy link'));
            }

            function renderPlaylist() {
                playlistContainer.innerHTML = '';
                tracks.forEach((track, idx) => {
                    const item = document.createElement('div');
                    item.className = `playlist-item ${idx === currentIndex ? 'active' : ''}`;
                    item.dataset.index = idx;
                    item.setAttribute('role', 'button');
                    item.setAttribute('tabindex', '0');
                    const isActive = idx === currentIndex;
                    item.innerHTML = `
                        <span class="idx">${String(idx+1).padStart(2,'0')}</span>
                        <div class="pl-info"><span class="pl-title">${track.title}</span><span class="pl-artist">${track.artist}</span></div>
                        <span class="pl-duration">${track.duration||'—'}</span>
                        <span class="pl-play-icon ${isActive && isPlaying ? 'playing' : ''}"><i class="fas ${isActive && isPlaying ? 'fa-volume-high' : 'fa-play'}"></i></span>
                    `;
                    const handle = () => {
                        if (idx === currentIndex) { togglePlay(); } else { currentIndex = idx;
                            loadTrack(currentIndex); if (isPlaying) audio.play().catch(() => {}); else play(); }
                        updateHashForTrack(currentIndex);
                    };
                    item.addEventListener('click', handle);
                    item.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault();
                            handle(); } });
                    playlistContainer.appendChild(item);
                });
                updateTrackCount();
            }

            function updateTrackCount() { trackCount.textContent = `${tracks.length} tracks`; }

            function loadTrack(index) {
                const track = tracks[index];
                if (!track) return;
                trackName.textContent = track.title;
                trackArtist.textContent = track.artist;
                npTitle.textContent = track.title;
                if (track.cover) { coverImg.src = track.cover;
                    coverImg.style.display = 'block';
                    coverFallback.style.display = 'none'; } else { coverImg.style.display = 'none';
                    coverFallback.style.display = 'flex'; }
                audio.src = track.src;
                audio.load();
                progressFill.style.width = '0%';
                currentTimeLabel.textContent = '0:00';
                totalTimeLabel.textContent = track.duration || '0:00';
                document.querySelectorAll('.playlist-item').forEach((el, i) => {
                    el.classList.toggle('active', i === index);
                    const icon = el.querySelector('.pl-play-icon');
                    if (icon) {
                        icon.className = `pl-play-icon ${i === index && isPlaying ? 'playing' : ''}`;
                        icon.innerHTML = `<i class="fas ${i === index && isPlaying ? 'fa-volume-high' : 'fa-play'}"></i>`;
                    }
                });
                updateCoverPlayState();
                npIndicator.className = isPlaying ? 'np-indicator' : 'np-indicator paused';
            }

            function updateCoverPlayState() { coverWrapper.classList.toggle('is-playing', isPlaying && audio.src && audio.src !==
                    ''); }

            function play() { audio.play().catch(() => {});
                isPlaying = true;
                updatePlayButton();
                updatePlaylistIcons();
                npIndicator.className = 'np-indicator';
                updateCoverPlayState(); }

            function pause() { audio.pause();
                isPlaying = false;
                updatePlayButton();
                updatePlaylistIcons();
                npIndicator.className = 'np-indicator paused';
                updateCoverPlayState(); }

            function togglePlay() { audio.paused ? play() : pause(); }

            function updatePlayButton() {
                playIcon.className = isPlaying ? 'fas fa-pause' : 'fas fa-play';
                playBtn.classList.toggle('is-playing', isPlaying);
            }

            function updatePlaylistIcons() {
                document.querySelectorAll('.playlist-item').forEach((el, i) => {
                    const icon = el.querySelector('.pl-play-icon');
                    if (icon) {
                        const active = i === currentIndex && isPlaying;
                        icon.className = `pl-play-icon ${active ? 'playing' : ''}`;
                        icon.innerHTML = `<i class="fas ${active ? 'fa-volume-high' : 'fa-play'}"></i>`;
                    }
                });
            }

            function formatTime(sec) { if (!sec || isNaN(sec)) return '0:00'; const m = Math.floor(sec / 60),
                    s = Math.floor(sec % 60); return `${m}:${s.toString().padStart(2,'0')}`; }

            function updateProgress() {
                if (isDragging) return;
                if (audio.duration && !isNaN(audio.duration)) {
                    const p = (audio.currentTime / audio.duration) * 100;
                    progressFill.style.width = `${Math.min(p,100)}%`;
                    currentTimeLabel.textContent = formatTime(audio.currentTime);
                    totalTimeLabel.textContent = formatTime(audio.duration);
                }
            }

            function updateVolumeIcon() {
                const v = parseFloat(volumeSlider.value);
                if (v === 0) volIcon.className = 'fas fa-volume-xmark';
                else if (v < .4) volIcon.className = 'fas fa-volume-low';
                else if (v < .7) volIcon.className = 'fas fa-volume-low';
                else volIcon.className = 'fas fa-volume-high';
            }

            function toggleMute() {
                const v = parseFloat(volumeSlider.value);
                if (v > 0) { previousVolume = v;
                    volumeSlider.value = 0;
                    audio.volume = 0;
                    updateVolumeIcon(); } else { volumeSlider.value = previousVolume || .8;
                    audio.volume = parseFloat(volumeSlider.value);
                    updateVolumeIcon(); }
            }

            function nextTrack() { const n = (currentIndex + 1) % tracks.length;
                currentIndex = n;
                loadTrack(currentIndex); if (isPlaying) audio.play().catch(() => {}); else play();
                updateHashForTrack(currentIndex); }

            function prevTrack() { const p = (currentIndex - 1 + tracks.length) % tracks.length;
                currentIndex = p;
                loadTrack(currentIndex); if (isPlaying) audio.play().catch(() => {}); else play();
                updateHashForTrack(currentIndex); }

            function findTrackBySlug(slug) {
                if (!slug) return -1;
                const idx = tracks.findIndex(t => getSlug(t.title) === slug);
                return idx >= 0 ? idx : -1;
            }

            function handleHashChange() {
                const hash = window.location.hash.substring(1);
                if (!hash) return;
                const idx = findTrackBySlug(hash);
                if (idx >= 0 && idx !== currentIndex) {
                    currentIndex = idx;
                    loadTrack(currentIndex);
                    if (isPlaying) audio.play().catch(() => {});
                    renderPlaylist();
                }
            }
            window.addEventListener('hashchange', handleHashChange);

            playBtn.addEventListener('click', togglePlay);
            prevBtn.addEventListener('click', prevTrack);
            nextBtn.addEventListener('click', nextTrack);
            volIconBtn.addEventListener('click', toggleMute);
            copyLinkBtn.addEventListener('click', copyCurrentLink);
            audio.addEventListener('timeupdate', updateProgress);
            audio.addEventListener('loadedmetadata', () => { totalTimeLabel.textContent = formatTime(audio.duration); });
            audio.addEventListener('ended', nextTrack);
            audio.addEventListener('play', () => { isPlaying = true;
                updatePlayButton();
                updatePlaylistIcons();
                npIndicator.className = 'np-indicator';
                updateCoverPlayState(); });
            audio.addEventListener('pause', () => { isPlaying = false;
                updatePlayButton();
                updatePlaylistIcons();
                npIndicator.className = 'np-indicator paused';
                updateCoverPlayState(); });
            volumeSlider.addEventListener('input', () => { audio.volume = parseFloat(volumeSlider.value);
                updateVolumeIcon(); });

            progressTrack.addEventListener('mousedown', (e) => { if (!audio.duration) return;
                isDragging = true;
                wasPlayingBeforeDrag = !audio.paused;
                audio.pause();
                seekFromMouse(e); });
            document.addEventListener('mousemove', (e) => { if (isDragging) seekFromMouse(e); });
            document.addEventListener('mouseup', () => { if (isDragging) { isDragging = false; if (wasPlayingBeforeDrag) audio
                        .play().catch(() => {}); } });
            progressTrack.addEventListener('touchstart', (e) => { if (!audio.duration) return;
                isDragging = true;
                wasPlayingBeforeDrag = !audio.paused;
                audio.pause();
                seekFromTouch(e); }, { passive: true });
            progressTrack.addEventListener('touchmove', (e) => { if (isDragging) seekFromTouch(e); }, { passive: true });
            progressTrack.addEventListener('touchend', () => { if (isDragging) { isDragging = false; if (wasPlayingBeforeDrag)
                        audio.play().catch(() => {}); } }, { passive: true });

            function seekFromMouse(e) { const rect = progressTrack.getBoundingClientRect();
                const x = Math.min(Math.max((e.clientX - rect.left) / rect.width, 0), 1); if (audio.duration) { audio
                        .currentTime = x * audio.duration;
                    progressFill.style.width = `${x*100}%`;
                    currentTimeLabel.textContent = formatTime(audio.currentTime); } }

            function seekFromTouch(e) { const touch = e.touches[0];
                const rect = progressTrack.getBoundingClientRect();
                const x = Math.min(Math.max((touch.clientX - rect.left) / rect.width, 0), 1); if (audio.duration) { audio
                        .currentTime = x * audio.duration;
                    progressFill.style.width = `${x*100}%`;
                    currentTimeLabel.textContent = formatTime(audio.currentTime); } }

            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                if (e.code === 'Space') { e.preventDefault();
                    togglePlay(); }
                if (e.code === 'ArrowRight') { e.preventDefault();
                    nextTrack(); }
                if (e.code === 'ArrowLeft') { e.preventDefault();
                    prevTrack(); }
                if (e.key === 'm') { e.preventDefault();
                    toggleMute(); }
            });

            loadTheme();
            renderPlaylist();
            renderAnnouncements();

            const initialHash = window.location.hash.substring(1);
            const startIndex = initialHash ? Math.max(findTrackBySlug(initialHash), 0) : 0;
            currentIndex = startIndex;
            loadTrack(currentIndex);
            if (initialHash && findTrackBySlug(initialHash) >= 0) updateHashForTrack(currentIndex);

            audio.volume = parseFloat(volumeSlider.value);
            updateVolumeIcon();
            npIndicator.className = 'np-indicator paused';
            currentPage = 'hub';
            pageSlider.classList.remove('slide-announcements');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.page === 'hub'));
        })();
    </script>
</body>
</html>
