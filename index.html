<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SBPebbles Music Hub</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />

    <style>
        /* ─── Reset & Base ─── */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0b0a0c;
            color: #f0ece6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            background-image: radial-gradient(circle at 20% 30%, #1e1a1f 0%, #0b0a0c 80%);
        }

        /* ─── Main Card ─── */
        .hub {
            max-width: 1000px;
            width: 100%;
            background: rgba(18, 16, 19, 0.85);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 3rem;
            padding: 2.5rem 2.5rem 2.2rem;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 215, 175, 0.06);
            transition: all 0.2s ease;
        }

        /* ─── Header ─── */
        .hub-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2.2rem;
            gap: 0.75rem 1rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.65rem;
        }

        .brand-icon {
            font-size: 2rem;
            color: #f5b58a;
            filter: drop-shadow(0 0 8px rgba(245, 181, 138, 0.3));
        }

        .brand h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #f5e6d3 0%, #f5b58a 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tagline {
            font-size: 0.85rem;
            font-weight: 400;
            color: #a8988a;
            background: rgba(255, 215, 175, 0.07);
            padding: 0.45rem 1rem;
            border-radius: 40px;
            border: 1px solid rgba(255, 215, 175, 0.08);
            letter-spacing: 0.01em;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .tagline i {
            color: #f5b58a;
            font-size: 0.75rem;
        }

        /* ─── Now Playing (mini) ─── */
        .now-playing-strip {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: rgba(255, 215, 175, 0.04);
            padding: 0.5rem 1.2rem 0.5rem 1rem;
            border-radius: 60px;
            border: 1px solid rgba(255, 215, 175, 0.06);
        }

        .now-playing-strip .np-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #a8988a;
            font-weight: 500;
        }

        .now-playing-strip .np-title {
            font-weight: 500;
            font-size: 0.9rem;
            color: #f0ece6;
            max-width: 180px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .now-playing-strip .np-title .placeholder-track {
            color: #6a5f55;
            font-style: italic;
        }

        /* ─── Player Card ─── */
        .player-section {
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
        }

        /* top row: cover + controls */
        .player-top {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            align-items: center;
        }

        /* ─── Cover Art ─── */
        .cover-wrapper {
            flex: 0 0 180px;
            width: 180px;
            height: 180px;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 215, 175, 0.06);
            background: #1e1a1f;
            position: relative;
            transition: box-shadow 0.3s ease;
        }

        .cover-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .cover-wrapper:hover img {
            transform: scale(1.02);
        }

        .cover-fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #2a2428, #141114);
            color: #f5b58a;
            font-size: 4rem;
            opacity: 0.7;
        }

        /* ─── Controls Column ─── */
        .controls-col {
            flex: 1;
            min-width: 220px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .track-info {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
        }

        .track-info .track-name {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: #f0ece6;
            line-height: 1.2;
        }

        .track-info .track-artist {
            font-size: 1rem;
            font-weight: 400;
            color: #a8988a;
        }

        /* ─── Big Play Button ─── */
        .playback-controls {
            display: flex;
            align-items: center;
            gap: 1.25rem;
            margin: 0.2rem 0 0.1rem;
        }

        .play-btn {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #f5b58a, #e0946a);
            color: #0b0a0c;
            font-size: 1.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 24px rgba(245, 181, 138, 0.25);
            flex-shrink: 0;
        }

        .play-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 32px rgba(245, 181, 138, 0.35);
        }

        .play-btn:active {
            transform: scale(0.95);
        }

        .play-btn i {
            margin-left: 3px;
        }

        .play-btn.is-playing i {
            margin-left: 0;
        }

        .secondary-btn {
            background: transparent;
            border: none;
            color: #a8988a;
            font-size: 1.2rem;
            cursor: pointer;
            transition: color 0.2s, transform 0.2s;
            padding: 0.4rem;
            border-radius: 30px;
        }

        .secondary-btn:hover {
            color: #f0ece6;
            transform: scale(1.08);
        }

        .volume-wrap {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-left: auto;
        }

        .volume-wrap i {
            color: #a8988a;
            font-size: 1rem;
        }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 70px;
            height: 4px;
            border-radius: 4px;
            background: #3a3235;
            outline: none;
            transition: background 0.2s;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #f5b58a;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(245, 181, 138, 0.3);
        }

        .volume-slider::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #f5b58a;
            cursor: pointer;
            border: none;
        }

        /* ─── Progress Bar ─── */
        .progress-area {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-top: 0.2rem;
        }

        .time-label {
            font-size: 0.8rem;
            font-weight: 400;
            color: #a8988a;
            min-width: 44px;
            font-variant-numeric: tabular-nums;
        }

        .progress-track {
            flex: 1;
            height: 5px;
            border-radius: 8px;
            background: #2f282c;
            cursor: pointer;
            position: relative;
            transition: height 0.15s;
        }

        .progress-track:hover {
            height: 7px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            border-radius: 8px;
            background: linear-gradient(90deg, #f5b58a, #e0946a);
            transition: width 0.05s linear;
            position: relative;
        }

        .progress-fill::after {
            content: "";
            position: absolute;
            right: -5px;
            top: -3px;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: #f5b58a;
            opacity: 0;
            transition: opacity 0.2s;
            box-shadow: 0 0 12px rgba(245, 181, 138, 0.4);
        }

        .progress-track:hover .progress-fill::after {
            opacity: 1;
        }

        /* ─── Playlist ─── */
        .playlist-section {
            margin-top: 0.8rem;
            border-top: 1px solid rgba(255, 215, 175, 0.06);
            padding-top: 1.5rem;
        }

        .playlist-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .playlist-header h3 {
            font-size: 0.9rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #a8988a;
        }

        .playlist-header .count {
            font-size: 0.75rem;
            color: #6a5f55;
            background: rgba(255, 215, 175, 0.06);
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
        }

        .playlist {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.7rem 1rem;
            border-radius: 16px;
            background: transparent;
            transition: background 0.2s ease, transform 0.15s;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .playlist-item:hover {
            background: rgba(255, 215, 175, 0.05);
            border-color: rgba(255, 215, 175, 0.06);
        }

        .playlist-item.active {
            background: rgba(245, 181, 138, 0.08);
            border-color: rgba(245, 181, 138, 0.15);
        }

        .playlist-item .idx {
            font-size: 0.8rem;
            font-weight: 500;
            color: #6a5f55;
            min-width: 24px;
            text-align: center;
        }

        .playlist-item .pl-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.05rem;
            overflow: hidden;
        }

        .playlist-item .pl-title {
            font-weight: 500;
            font-size: 0.95rem;
            color: #f0ece6;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist-item .pl-artist {
            font-size: 0.8rem;
            color: #a8988a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist-item .pl-duration {
            font-size: 0.8rem;
            color: #6a5f55;
            font-variant-numeric: tabular-nums;
            min-width: 44px;
            text-align: right;
        }

        .playlist-item .pl-play-icon {
            color: #f5b58a;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.2s;
            min-width: 20px;
            text-align: center;
        }

        .playlist-item.active .pl-play-icon,
        .playlist-item:hover .pl-play-icon {
            opacity: 1;
        }

        .playlist-item .pl-play-icon.playing {
            opacity: 1;
            color: #f5b58a;
        }

        /* ─── Footer Love ─── */
        .hub-footer {
            margin-top: 2.2rem;
            text-align: center;
            font-size: 0.8rem;
            color: #6a5f55;
            letter-spacing: 0.02em;
            border-top: 1px solid rgba(255, 215, 175, 0.04);
            padding-top: 1.5rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 0.5rem 1.2rem;
        }

        .hub-footer .heart {
            color: #f06a6a;
            display: inline-block;
            animation: pulse-heart 1.8s ease-in-out infinite;
            font-size: 0.9rem;
        }

        .hub-footer .love-text {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .hub-footer .love-text i {
            color: #f5b58a;
            font-size: 0.75rem;
        }

        .hub-footer .distro-badge {
            background: rgba(255, 215, 175, 0.06);
            padding: 0.2rem 0.9rem;
            border-radius: 30px;
            font-size: 0.7rem;
            color: #a8988a;
            border: 1px solid rgba(255, 215, 175, 0.05);
        }

        @keyframes pulse-heart {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
            }
        }

        /* ─── Responsive ─── */
        @media (max-width: 720px) {
            .hub {
                padding: 1.8rem 1.2rem;
                border-radius: 2rem;
            }

            .player-top {
                flex-direction: column;
                align-items: center;
                gap: 1.2rem;
            }

            .cover-wrapper {
                flex: 0 0 160px;
                width: 160px;
                height: 160px;
            }

            .controls-col {
                width: 100%;
                min-width: unset;
            }

            .track-info .track-name {
                font-size: 1.25rem;
            }

            .now-playing-strip {
                width: 100%;
                justify-content: center;
            }

            .brand h1 {
                font-size: 1.4rem;
            }

            .volume-wrap {
                margin-left: 0;
            }

            .playback-controls {
                flex-wrap: wrap;
                justify-content: center;
            }

            .volume-slider {
                width: 60px;
            }

            .playlist-item {
                padding: 0.6rem 0.7rem;
                gap: 0.6rem;
            }

            .playlist-item .pl-title {
                font-size: 0.85rem;
            }

            .hub-footer {
                flex-direction: column;
                gap: 0.4rem;
            }
        }

        @media (max-width: 430px) {
            .hub {
                padding: 1.2rem 0.8rem;
                border-radius: 1.5rem;
            }

            .brand h1 {
                font-size: 1.2rem;
            }

            .cover-wrapper {
                flex: 0 0 140px;
                width: 140px;
                height: 140px;
                border-radius: 20px;
            }

            .play-btn {
                width: 50px;
                height: 50px;
                font-size: 1.3rem;
            }

            .tagline {
                font-size: 0.7rem;
                padding: 0.3rem 0.8rem;
            }
        }

        /* ─── Utility ─── */
        .hidden {
            display: none !important;
        }

        .text-ellipsis {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #3a3235;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #5a4f4f;
        }
    </style>
</head>

<body>

    <div class="hub" role="main">

        <!-- ─── HEADER ─── -->
        <header class="hub-header">
            <div class="brand">
                <span class="brand-icon"><i class="fas fa-compact-disc"></i></span>
                <h1>SBPebbles Music Hub</h1>
            </div>
            <div class="tagline">
                <i class="fas fa-headphones-simple"></i>
                <span>Made with love</span>
            </div>
        </header>

        <!-- ─── NOW PLAYING STRIP ─── -->
        <div class="now-playing-strip" id="nowPlayingStrip">
            <span class="np-label"><i class="fas fa-play" style="font-size:0.6rem;margin-right:4px;"></i> now</span>
            <span class="np-title" id="npTitle">Select a track</span>
        </div>

        <!-- ─── PLAYER ─── -->
        <section class="player-section">

            <div class="player-top">
                <!-- Cover -->
                <div class="cover-wrapper" id="coverWrapper">
                    <div class="cover-fallback" id="coverFallback">
                        <i class="fas fa-music"></i>
                    </div>
                    <img id="coverImg" src="" alt="Album cover" style="display:none;" />
                </div>

                <!-- Controls -->
                <div class="controls-col">
                    <div class="track-info">
                        <span class="track-name" id="trackName">—</span>
                        <span class="track-artist" id="trackArtist">SBPebbles</span>
                    </div>

                    <div class="playback-controls">
                        <button class="secondary-btn" id="prevBtn" aria-label="Previous track">
                            <i class="fas fa-backward-step"></i>
                        </button>

                        <button class="play-btn" id="playBtn" aria-label="Play / Pause">
                            <i class="fas fa-play" id="playIcon"></i>
                        </button>

                        <button class="secondary-btn" id="nextBtn" aria-label="Next track">
                            <i class="fas fa-forward-step"></i>
                        </button>

                        <div class="volume-wrap">
                            <i class="fas fa-volume-low" id="volIcon"></i>
                            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.02" value="0.8" aria-label="Volume" />
                        </div>
                    </div>

                    <!-- Progress -->
                    <div class="progress-area">
                        <span class="time-label" id="currentTime">0:00</span>
                        <div class="progress-track" id="progressTrack" role="slider" aria-label="Seek">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                        <span class="time-label" id="totalTime">0:00</span>
                    </div>
                </div>
            </div>

            <!-- ─── PLAYLIST ─── -->
            <div class="playlist-section">
                <div class="playlist-header">
                    <h3><i class="fas fa-list-ul" style="margin-right:8px;color:#6a5f55;"></i>Playlist</h3>
                    <span class="count" id="trackCount">3 tracks</span>
                </div>
                <div class="playlist" id="playlistContainer">
                    <!-- dynamically populated -->
                </div>
            </div>

        </section>

        <!-- ─── FOOTER ─── -->
        <footer class="hub-footer">

            <span style="color:#4a3f3f;">© 2026 SBPebbles</span>
        </footer>

    </div>

    <!-- ─── AUDIO ELEMENT ─── -->
    <audio id="audioPlayer" preload="metadata"></audio>

    <script>
        (function() {
            'use strict';

            // ─── TRACK DATA ───────────────────────────────────────────────
            const TRACKS = [{
                id: 0,
                title: 'Lost You',
                artist: 'Kam Pebbles',
                src: 'https://s3.amazonaws.com/audio.distrokid.com/hyperfollow/hyperfollow-generated-13357997-B4330654-A8C2-4B6F-A7AE4EDAE8996866.mp3',
                cover: 'https://i.imgur.com/2UMG2Pg.jpeg',
                duration: '3:28'
            }, {
                id: 1,
                title: 'Blue-Raz Lemonade',
                artist: 'Kam Pebbles',
                src: 'https://s3.amazonaws.com/audio.distrokid.com/hyperfollow/hyperfollow-generated-13357997-7C5D43ED-B73F-4B24-B606F40F65E5595A.mp3',
                cover: 'https://i.imgur.com/RnwJuvu.jpeg',
                duration: '2:17'
            }, {
                id: 2,
                title: 'Empty Track',
                artist: 'Kam Pebbles',
                src: 'https://s3.amazonaws.com',
                cover: '',
                duration: '0:00'
            }];

            // ─── DOM REFS ────────────────────────────────────────────────
            const audio = document.getElementById('audioPlayer');
            const playBtn = document.getElementById('playBtn');
            const playIcon = document.getElementById('playIcon');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const progressFill = document.getElementById('progressFill');
            const progressTrack = document.getElementById('progressTrack');
            const currentTimeLabel = document.getElementById('currentTime');
            const totalTimeLabel = document.getElementById('totalTime');
            const volumeSlider = document.getElementById('volumeSlider');
            const volIcon = document.getElementById('volIcon');

            const trackName = document.getElementById('trackName');
            const trackArtist = document.getElementById('trackArtist');
            const npTitle = document.getElementById('npTitle');
            const coverImg = document.getElementById('coverImg');
            const coverFallback = document.getElementById('coverFallback');
            const coverWrapper = document.getElementById('coverWrapper');

            const playlistContainer = document.getElementById('playlistContainer');
            const trackCount = document.getElementById('trackCount');

            // ─── STATE ────────────────────────────────────────────────────
            let currentIndex = 0;
            let isPlaying = false;
            let isDragging = false;
            let wasPlayingBeforeDrag = false;

            // ─── INIT ─────────────────────────────────────────────────────
            function init() {
                renderPlaylist();
                loadTrack(currentIndex);
                setupEventListeners();
                updateTrackCount();
                // set initial volume
                audio.volume = parseFloat(volumeSlider.value);
                updateVolumeIcon();
            }

            // ─── RENDER PLAYLIST ────────────────────────────────────────
            function renderPlaylist() {
                playlistContainer.innerHTML = '';
                TRACKS.forEach((track, idx) => {
                    const item = document.createElement('div');
                    item.className = `playlist-item ${idx === currentIndex ? 'active' : ''}`;
                    item.dataset.index = idx;

                    const isActive = idx === currentIndex;

                    item.innerHTML = `
                    <span class="idx">${String(idx + 1).padStart(2, '0')}</span>
                    <div class="pl-info">
                      <span class="pl-title">${track.title}</span>
                      <span class="pl-artist">${track.artist}</span>
                    </div>
                    <span class="pl-duration">${track.duration || '—'}</span>
                    <span class="pl-play-icon ${isActive && isPlaying ? 'playing' : ''}">
                      <i class="fas ${isActive && isPlaying ? 'fa-volume-high' : 'fa-play'}"></i>
                    </span>
                  `;

                    item.addEventListener('click', () => {
                        if (idx === currentIndex) {
                            togglePlay();
                        } else {
                            currentIndex = idx;
                            loadTrack(currentIndex);
                            if (isPlaying) {
                                audio.play().catch(() => {});
                            } else {
                                play();
                            }
                        }
                    });

                    playlistContainer.appendChild(item);
                });
            }

            // ─── LOAD TRACK ──────────────────────────────────────────────
            function loadTrack(index) {
                const track = TRACKS[index];
                if (!track) return;

                // Update UI
                trackName.textContent = track.title;
                trackArtist.textContent = track.artist;
                npTitle.textContent = track.title;

                // Cover
                if (track.cover) {
                    coverImg.src = track.cover;
                    coverImg.style.display = 'block';
                    coverFallback.style.display = 'none';
                } else {
                    coverImg.style.display = 'none';
                    coverFallback.style.display = 'flex';
                }

                // Audio
                audio.src = track.src;
                audio.load();

                // Reset progress
                progressFill.style.width = '0%';
                currentTimeLabel.textContent = '0:00';
                totalTimeLabel.textContent = track.duration || '0:00';

                // Highlight playlist
                document.querySelectorAll('.playlist-item').forEach((el, i) => {
                    el.classList.toggle('active', i === index);
                    const icon = el.querySelector('.pl-play-icon');
                    if (icon) {
                        icon.className = `pl-play-icon ${i === index && isPlaying ? 'playing' : ''}`;
                        icon.innerHTML = `<i class="fas ${i === index && isPlaying ? 'fa-volume-high' : 'fa-play'}"></i>`;
                    }
                });

                // Update now playing strip
                document.getElementById('npTitle').textContent = track.title;
            }

            // ─── PLAY / PAUSE ────────────────────────────────────────────
            function togglePlay() {
                if (audio.paused) {
                    play();
                } else {
                    pause();
                }
            }

            function play() {
                audio.play().catch(err => {
                    // Autoplay restrictions or network issues
                    console.warn('Playback failed:', err);
                });
                isPlaying = true;
                updatePlayButton();
                updatePlaylistIcons();
                document.getElementById('npTitle').textContent = TRACKS[currentIndex].title;
            }

            function pause() {
                audio.pause();
                isPlaying = false;
                updatePlayButton();
                updatePlaylistIcons();
            }

            function updatePlayButton() {
                if (isPlaying) {
                    playIcon.className = 'fas fa-pause';
                    playBtn.classList.add('is-playing');
                } else {
                    playIcon.className = 'fas fa-play';
                    playBtn.classList.remove('is-playing');
                }
            }

            function updatePlaylistIcons() {
                document.querySelectorAll('.playlist-item').forEach((el, i) => {
                    const icon = el.querySelector('.pl-play-icon');
                    if (icon) {
                        const isActive = i === currentIndex;
                        const isNowPlaying = isActive && isPlaying;
                        icon.className = `pl-play-icon ${isNowPlaying ? 'playing' : ''}`;
                        icon.innerHTML = `<i class="fas ${isNowPlaying ? 'fa-volume-high' : 'fa-play'}"></i>`;
                    }
                });
            }

            // ─── SEEK ─────────────────────────────────────────────────────
            function updateProgress() {
                if (isDragging) return;
                if (audio.duration && !isNaN(audio.duration)) {
                    const percent = (audio.currentTime / audio.duration) * 100;
                    progressFill.style.width = `${Math.min(percent, 100)}%`;
                    currentTimeLabel.textContent = formatTime(audio.currentTime);
                    totalTimeLabel.textContent = formatTime(audio.duration);
                }
            }

            function formatTime(seconds) {
                if (!seconds || isNaN(seconds)) return '0:00';
                const m = Math.floor(seconds / 60);
                const s = Math.floor(seconds % 60);
                return `${m}:${s.toString().padStart(2, '0')}`;
            }

            // ─── VOLUME ──────────────────────────────────────────────────
            function updateVolumeIcon() {
                const val = parseFloat(volumeSlider.value);
                if (val === 0) {
                    volIcon.className = 'fas fa-volume-xmark';
                } else if (val < 0.4) {
                    volIcon.className = 'fas fa-volume-low';
                } else if (val < 0.7) {
                    volIcon.className = 'fas fa-volume-high';
                } else {
                    volIcon.className = 'fas fa-volume-high';
                }
            }

            // ─── TRACK COUNT ─────────────────────────────────────────────
            function updateTrackCount() {
                trackCount.textContent = `${TRACKS.length} tracks`;
            }

            // ─── NAVIGATION ──────────────────────────────────────────────
            function nextTrack() {
                const next = (currentIndex + 1) % TRACKS.length;
                currentIndex = next;
                loadTrack(currentIndex);
                if (isPlaying) {
                    audio.play().catch(() => {});
                } else {
                    play();
                }
            }

            function prevTrack() {
                const prev = (currentIndex - 1 + TRACKS.length) % TRACKS.length;
                currentIndex = prev;
                loadTrack(currentIndex);
                if (isPlaying) {
                    audio.play().catch(() => {});
                } else {
                    play();
                }
            }

            // ─── EVENT LISTENERS ──────────────────────────────────────────
            function setupEventListeners() {

                // Play / Pause
                playBtn.addEventListener('click', togglePlay);

                // Prev / Next
                prevBtn.addEventListener('click', prevTrack);
                nextBtn.addEventListener('click', nextTrack);

                // Audio events
                audio.addEventListener('timeupdate', updateProgress);
                audio.addEventListener('loadedmetadata', () => {
                    totalTimeLabel.textContent = formatTime(audio.duration);
                    // if track has duration in data, use that as fallback
                    const track = TRACKS[currentIndex];
                    if (track.duration && !isNaN(audio.duration)) {
                        // prefer actual duration
                    }
                });
                audio.addEventListener('ended', () => {
                    // Auto-advance
                    nextTrack();
                });
                audio.addEventListener('play', () => {
                    isPlaying = true;
                    updatePlayButton();
                    updatePlaylistIcons();
                    document.getElementById('npTitle').textContent = TRACKS[currentIndex].title;
                });
                audio.addEventListener('pause', () => {
                    isPlaying = false;
                    updatePlayButton();
                    updatePlaylistIcons();
                });

                // Progress bar click & drag
                progressTrack.addEventListener('mousedown', (e) => {
                    if (!audio.duration || isNaN(audio.duration)) return;
                    isDragging = true;
                    wasPlayingBeforeDrag = !audio.paused;
                    audio.pause();
                    seekFromMouse(e);
                });

                document.addEventListener('mousemove', (e) => {
                    if (!isDragging) return;
                    seekFromMouse(e);
                });

                document.addEventListener('mouseup', () => {
                    if (isDragging) {
                        isDragging = false;
                        if (wasPlayingBeforeDrag) {
                            audio.play().catch(() => {});
                        }
                    }
                });

                // Touch support for progress
                progressTrack.addEventListener('touchstart', (e) => {
                    if (!audio.duration || isNaN(audio.duration)) return;
                    isDragging = true;
                    wasPlayingBeforeDrag = !audio.paused;
                    audio.pause();
                    seekFromTouch(e);
                }, { passive: true });

                progressTrack.addEventListener('touchmove', (e) => {
                    if (!isDragging) return;
                    seekFromTouch(e);
                }, { passive: true });

                progressTrack.addEventListener('touchend', () => {
                    if (isDragging) {
                        isDragging = false;
                        if (wasPlayingBeforeDrag) {
                            audio.play().catch(() => {});
                        }
                    }
                }, { passive: true });

                // Volume
                volumeSlider.addEventListener('input', () => {
                    const val = parseFloat(volumeSlider.value);
                    audio.volume = val;
                    updateVolumeIcon();
                });

                // Keyboard shortcuts (optional)
                document.addEventListener('keydown', (e) => {
                    if (e.target.tagName === 'INPUT') return;
                    if (e.code === 'Space') {
                        e.preventDefault();
                        togglePlay();
                    }
                    if (e.code === 'ArrowRight') {
                        e.preventDefault();
                        nextTrack();
                    }
                    if (e.code === 'ArrowLeft') {
                        e.preventDefault();
                        prevTrack();
                    }
                });
            }

            // ─── SEEK HELPERS ────────────────────────────────────────────
            function seekFromMouse(e) {
                const rect = progressTrack.getBoundingClientRect();
                const x = (e.clientX - rect.left) / rect.width;
                const clamped = Math.min(Math.max(x, 0), 1);
                if (audio.duration) {
                    audio.currentTime = clamped * audio.duration;
                    progressFill.style.width = `${clamped * 100}%`;
                    currentTimeLabel.textContent = formatTime(audio.currentTime);
                }
            }

            function seekFromTouch(e) {
                const touch = e.touches[0];
                const rect = progressTrack.getBoundingClientRect();
                const x = (touch.clientX - rect.left) / rect.width;
                const clamped = Math.min(Math.max(x, 0), 1);
                if (audio.duration) {
                    audio.currentTime = clamped * audio.duration;
                    progressFill.style.width = `${clamped * 100}%`;
                    currentTimeLabel.textContent = formatTime(audio.currentTime);
                }
            }

            // ─── START ──────────────────────────────────────────────────
            init();

        })();
    </script>

</body>
</html>
