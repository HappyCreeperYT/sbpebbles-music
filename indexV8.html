<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>SBPebbles Music Hub</title>
    <meta name="description" content="SBPebbles Music Hub">
    <meta name="theme-color" content="#ff5252">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ── base ── */
        :root {
            --font: "Inter", sans-serif;
            --m3-radius-sm: 2px;
            --m3-radius-md: 2px;
            --m3-radius-lg: 2px;
            --m3-elevation-1: 0 1px 3px rgba(0, 0, 0, .22), 0 1px 2px rgba(0, 0, 0, .14);
            --m3-elevation-2: 0 4px 8px rgba(0, 0, 0, .24), 0 2px 4px rgba(0, 0, 0, .16);
            --m3-elevation-3: 0 8px 16px rgba(0, 0, 0, .28), 0 4px 8px rgba(0, 0, 0, .18);
            --m3-elevation-4: 0 16px 32px rgba(0, 0, 0, .34), 0 8px 16px rgba(0, 0, 0, .2);
            --m3-transition: .28s;
            --m3-transition-slow: .45s;
            --anim-curve: cubic-bezier(.22, 1, .36, 1);
            --anim-spring: cubic-bezier(.34, 1.56, .64, 1);
        }

        [data-theme="red"] {
            --md-sys-color-primary: #ff5252;
            --md-sys-color-on-primary: #1c0000;
            --md-sys-color-primary-container: #b30000;

            --md-sys-color-on-tertiary: #3d2000;
            --md-sys-color-tertiary-container: #5c3400;

            --md-sys-color-on-surface-variant: #d8c2be;
            --md-sys-color-background: #1a0c0c;
            --md-sys-color-on-background: #f3dedb;
            --md-sys-color-outline: #a88f8b;
            --md-sys-color-outline-variant: #534341;
            --md-sys-color-shadow: #000;
            --md-sys-color-surface-tint: #ff5252;
            --md-sys-color-inverse-surface: #f3dedb;
            --md-sys-color-inverse-on-surface: #3a302e;
        }

        [data-theme="green"] {

            --md-sys-color-primary-container: #005c31;

            --md-sys-color-secondary-container: #394b39;

            --md-sys-color-surface: #0b180e;
            --md-sys-color-on-surface: #dfe8dc;
            --md-sys-color-surface-variant: #414941;

            --md-sys-color-surface-tint: #69f0ae;
            --md-sys-color-inverse-surface: #dfe8dc;
            --md-sys-color-inverse-on-surface: #2c332c;
        }
        [data-theme="blue"] {
            --md-sys-color-primary: #40c4ff;
            --md-sys-color-on-primary: #00344d;
            --md-sys-color-primary-container: #004e70;
            --md-sys-color-on-primary-container: #bce7ff;
            --md-sys-color-secondary: #b5cadb;
            --md-sys-color-on-secondary: #20333f;
            --md-sys-color-secondary-container: #374955;
            --md-sys-color-on-secondary-container: #d1e5f5;
            --md-sys-color-tertiary: #c9c3ed;
            --md-sys-color-on-tertiary: #302c4d;
            --md-sys-color-tertiary-container: #474263;
            --md-sys-color-on-tertiary-container: #e5dfff;
            --md-sys-color-surface: #07151e;
            --md-sys-color-on-surface: #dfeef8;
            --md-sys-color-surface-variant: #41494e;
            --md-sys-color-on-surface-variant: #c0c8ce;
            --md-sys-color-background: #07151e;
            --md-sys-color-on-background: #dfeef8;
            --md-sys-color-outline: #89939a;
            --md-sys-color-outline-variant: #41494e;
            --md-sys-color-shadow: #000;
            --md-sys-color-surface-tint: #40c4ff;
            --md-sys-color-inverse-surface: #dfeef8;
            --md-sys-color-inverse-on-surface: #293238;
        }
        [data-theme="indigo"] {
            --md-sys-color-primary: #7c4dff;
            --md-sys-color-on-primary: #1a0063;
            --md-sys-color-primary-container: #3b009d;
            --md-sys-color-on-primary-container: #e8daff;
            --md-sys-color-secondary: #c5b8ff;
            --md-sys-color-on-secondary: #2a1b50;
            --md-sys-color-secondary-container: #413568;
            --md-sys-color-on-secondary-container: #e2dcff;
            --md-sys-color-tertiary: #b388ff;
            --md-sys-color-on-tertiary: #33005f;
            --md-sys-color-tertiary-container: #4d1589;
            --md-sys-color-on-tertiary-container: #efdbff;
            --md-sys-color-surface: #140e1b;
            --md-sys-color-on-surface: #ece0ec;
            --md-sys-color-surface-variant: #4a424c;
            --md-sys-color-on-surface-variant: #cbc1cd;
            --md-sys-color-background: #140e1b;
            --md-sys-color-on-background: #ece0ec;
            --md-sys-color-outline: #958d97;
            --md-sys-color-outline-variant: #4a424c;
            --md-sys-color-shadow: #000;
            --md-sys-color-surface-tint: #7c4dff;
            --md-sys-color-inverse-surface: #ece0ec;
            --md-sys-color-inverse-on-surface: #322d33;
        }
        [data-theme="violet"] {
            --md-sys-color-primary: #d7baff;
            --md-sys-color-on-primary: #3b006e;
            --md-sys-color-primary-container: #5a009d;
            --md-sys-color-on-primary-container: #eedcff;
            --md-sys-color-secondary: #d4bee5;
            --md-sys-color-on-secondary: #392a46;
            --md-sys-color-secondary-container: #50405e;
            --md-sys-color-on-secondary-container: #ecdfff;
            --md-sys-color-tertiary: #f2b8c6;
            --md-sys-color-on-tertiary: #4a202b;
            --md-sys-color-tertiary-container: #64343f;
            --md-sys-color-on-tertiary-container: #ffd9e1;
            --md-sys-color-surface: #160e1b;
            --md-sys-color-on-surface: #ebe0ec;
            --md-sys-color-surface-variant: #4a424c;
            --md-sys-color-on-surface-variant: #cbc1cd;
            --md-sys-color-background: #160e1b;
            --md-sys-color-on-background: #ebe0ec;
            --md-sys-color-outline: #958d97;
            --md-sys-color-outline-variant: #4a424c;
            --md-sys-color-shadow: #000;
            --md-sys-color-surface-tint: #d7baff;
            --md-sys-color-inverse-surface: #ebe0ec;
            --md-sys-color-inverse-on-surface: #322d33;
        }

        * {
            box-sizing: border-box
        }
        html {
            scroll-behavior: smooth
        }
        body {
            margin: 0;
            background: var(--md-sys-color-background);
            color: var(--md-sys-color-on-background);
            font-family: var(--font);
            font-size: 15px;
            line-height: 1.5;
            opacity: 0;
            animation: bodyFade .6s var(--anim-curve) forwards;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        @keyframes bodyFade {
            to { opacity: 1 }
        }

        main {
            flex: 1;
        }

        button,
        a {
            font: inherit
        }
        button {
            cursor: pointer
        }
        a {
            color: inherit;
            text-decoration: none
        }

        /* ── focus / reduced motion ── */
        :focus-visible {
            outline: 2px solid var(--md-sys-color-primary);
            outline-offset: 2px;
        }
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
        }

        /* ── appbar ── */
        .appbar {
            position: sticky;
            top: 0;
            z-index: 50;
            background: color-mix(in srgb, var(--md-sys-color-surface) 82%, transparent);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--md-sys-color-outline-variant);
            transition: background var(--m3-transition), border-color var(--m3-transition);
        }
        .appbar-inner {
            max-width: 1120px;
            margin: auto;
            min-height: 72px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 18px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 20px;
            white-space: nowrap;
            transition: transform var(--m3-transition) var(--anim-spring);
        }
        .brand:hover { transform: scale(1.02) }
        .brand i {
            font-size: 19px;
            transition: transform var(--m3-transition) var(--anim-spring);
        }
        .brand:hover i { transform: rotate(-8deg) scale(1.1) }
        .brand span {
            background: linear-gradient(100deg, var(--md-sys-color-primary), var(--md-sys-color-tertiary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .socials {
            display: flex;
            gap: 6px;
            margin-left: auto;
        }
        .icon-btn,
        .control-btn {
            border: 1px solid var(--md-sys-color-outline-variant);
            background: var(--md-sys-color-surface-variant);
            color: var(--md-sys-color-on-surface);
            width: 40px;
            height: 40px;
            border-radius: var(--m3-radius-md);
            display: grid;
            place-items: center;
            transition: all var(--m3-transition) var(--anim-curve);
            position: relative;
            overflow: hidden;
        }
        .icon-btn::after,
        .control-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--md-sys-color-primary);
            opacity: 0;
            transition: opacity var(--m3-transition);
            border-radius: inherit;
        }
        .icon-btn:hover::after,
        .control-btn:hover::after { opacity: .08 }
        .icon-btn:hover,
        .control-btn:hover {
            background: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
            transform: translateY(-2px) scale(1.02);
            box-shadow: var(--m3-elevation-1);
        }
        .icon-btn:active,
        .control-btn:active {
            transform: translateY(0) scale(.96);
            transition-duration: .08s;
        }

        .contact {
            padding: 10px 15px;
            border-radius: var(--m3-radius-md);
            background: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .08em;
            white-space: nowrap;
            transition: all var(--m3-transition) var(--anim-curve);
            position: relative;
            overflow: hidden;
        }
        .contact::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, .15);
            transform: translateX(-100%);
            transition: transform .5s var(--anim-curve);
        }
        .contact:hover::after { transform: translateX(100%) }
        .contact:hover {
            box-shadow: var(--m3-elevation-2);
            transform: translateY(-2px) scale(1.02);
        }
        .contact:active {
            transform: translateY(0) scale(.97);
            transition-duration: .08s;
        }

        /* ── tabs ── */
        .tabs {
            position: sticky;
            top: 72px;
            z-index: 40;
            background: color-mix(in srgb, var(--md-sys-color-background) 92%, transparent);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--md-sys-color-outline-variant);
            transition: background var(--m3-transition), border-color var(--m3-transition);
        }
        .tabs-inner {
            max-width: 1120px;
            margin: auto;
            display: flex;
            padding: 0 20px;
            gap: 2px;
        }
        .tab {
            position: relative;
            border: 0;
            background: none;
            color: var(--md-sys-color-on-surface-variant);
            padding: 16px 24px;
            font-weight: 600;
            transition: all var(--m3-transition) var(--anim-curve);
            border-radius: var(--m3-radius-sm) var(--m3-radius-sm) 0 0;
            cursor: pointer;
        }
        .tab::before {
            content: '';
            position: absolute;
            inset: 4px 8px;
            border-radius: var(--m3-radius-sm);
            background: var(--md-sys-color-primary);
            opacity: 0;
            transition: opacity var(--m3-transition);
        }
        .tab:hover::before { opacity: .06 }
        .tab:hover { color: var(--md-sys-color-on-surface) }
        .tab.active { color: var(--md-sys-color-primary) }
        .tab.active::after {
            content: "";
            position: absolute;
            left: 18px;
            right: 18px;
            bottom: -1px;
            height: 2px;
            background: var(--md-sys-color-primary);
            border-radius: 1px;
            animation: tabActive .4s var(--anim-spring);
        }
        @keyframes tabActive {
            0% { transform: scaleX(0); opacity: 0 }
            100% { transform: scaleX(1); opacity: 1 }
        }
        .tab:active {
            transform: scale(.97);
            transition-duration: .08s;
        }
        .badge {
            display: inline-grid;
            place-items: center;
            min-width: 20px;
            height: 20px;
            margin-left: 7px;
            padding: 0 5px;
            border-radius: 10px;
            background: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
            font-size: 11px;
            transition: all var(--m3-transition) var(--anim-spring);
        }
        .tab:hover .badge { transform: scale(1.08) }

        /* ── panels ── */
        main {
            max-width: 1120px;
            margin: auto;
            padding: 32px 20px 60px;
            width: 100%;
        }
        .panel {
            display: none;
            animation: none;
        }
        .panel.active {
            display: block;
            animation: panelIn .5s var(--anim-curve) both;
        }
        @keyframes panelIn {
            0% { opacity: 0; transform: translateY(18px) scale(.98) }
            100% { opacity: 1; transform: translateY(0) scale(1) }
        }

        /* ── now playing ── */
        .now-playing {
            border: 1px solid var(--md-sys-color-outline-variant);
            background: var(--md-sys-color-surface);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            border-radius: var(--m3-radius-md);
            box-shadow: var(--m3-elevation-1);
            transition: all var(--m3-transition);
            animation: fadeSlide .5s var(--anim-curve) both;
            animation-delay: .06s;
        }
        .now-playing:hover { box-shadow: var(--m3-elevation-2) }
        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(10px) }
            100% { opacity: 1; transform: translateY(0) }
        }
        .np-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .12em;
            color: var(--md-sys-color-on-surface-variant);
        }
        .np-title {
            font-weight: 600;
            transition: color var(--m3-transition);
        }
        .dots {
            display: flex;
            gap: 5px;
        }
        .dots i {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--md-sys-color-primary);
            transition: background var(--m3-transition);
        }
        .playing .dots i { animation: dotPulse 1s infinite }
        .playing .dots i:nth-child(2) { animation-delay: .15s }
        .playing .dots i:nth-child(3) { animation-delay: .3s }
        @keyframes dotPulse {
            0%, 100% { opacity: 1; transform: scale(1) }
            50% { opacity: .2; transform: scale(.65) }
        }

        /* ── player ── */
        .player {
            margin-top: 18px;
            padding: 22px;
            border: 1px solid var(--md-sys-color-outline-variant);
            background: var(--md-sys-color-surface);
            box-shadow: var(--m3-elevation-2);
            border-radius: var(--m3-radius-lg);
            transition: all var(--m3-transition);
            animation: fadeSlide .5s var(--anim-curve) both;
            animation-delay: .1s;
        }
        .player:hover { box-shadow: var(--m3-elevation-3) }
        .player-grid {
            display: grid;
            grid-template-columns: 180px 1fr;
            gap: 24px;
        }
        .cover-wrap {
            width: 180px;
            height: 180px;
            position: relative;
        }
        .cover {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: var(--m3-radius-md);
            background: var(--md-sys-color-surface-variant);
            display: grid;
            place-items: center;
            transition: all var(--m3-transition) var(--anim-curve);
            box-shadow: var(--m3-elevation-2);
        }
        .cover:hover {
            transform: scale(1.025);
            box-shadow: var(--m3-elevation-3);
        }
        .cover.fallback {
            font-size: 55px;
            color: var(--md-sys-color-on-surface-variant);
        }
        .cover-fallback-icon {
            display: none;
            position: absolute;
            inset: 0;
            place-items: center;
            font-size: 55px;
            color: var(--md-sys-color-on-surface-variant);
            pointer-events: none;
        }
        .cover-wrap.playing::after {
            content: "";
            position: absolute;
            inset: -7px;
            border: 2px solid var(--md-sys-color-primary);
            border-radius: var(--m3-radius-lg);
            pointer-events: none;
            animation: ringPulse 1.7s infinite;
            transition: border-color var(--m3-transition);
        }
        @keyframes ringPulse {
            0%, 100% { opacity: .6; transform: scale(1) }
            50% { opacity: .2; transform: scale(1.035) }
        }

        .track-meta {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 15px;
        }
        .eyebrow {
            font-size: 11px;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--md-sys-color-on-surface-variant);
        }
        h1, h2, h3, p { margin-top: 0 }
        .track-title {
            font-size: 25px;
            line-height: 1.2;
            margin: 4px 0 4px;
            transition: color var(--m3-transition);
        }
        .artist {

                cover: "https://i.imgur.com/ycLlohS.png", duration: "3:44" },
            { title: "225_EARLY_PREVIEW_MIXED", artist: "Kam Pebbles",
                src: "https://s3.amazonaws.com/audio.distrokid.com/hyperfollow/hyperfollow-generated-13357997-C0508234-1489-4724-B12A73AA072E9F5E.mp3",
                cover: "https://i.imgur.com/ycLlohS.png", duration: "3:13" },
            { title: "How It Feels To Be Me", artist: "Kam Pebbles",
                src: "https://s3.amazonaws.com/audio.distrokid.com/hyperfollow/hyperfollow-generated-13357997-67E8EB1E-B9AE-48A0-BA8BC7CEFF14EFEC.mp3",
                cover: "https://i.imgur.com/fd1kRok.png", duration: "2:48" },
            { title: "Mint Coffee & Elevator Music", artist: "Kam Pebbles",
                src: "https://s3.amazonaws.com/audio.distrokid.com/hyperfollow/hyperfollow-generated-13357997-3D372B65-65B2-4969-9655B4DA397FC0E6.mp3",
                cover: "https://i.imgur.com/tpa8nWN.png", duration: "2:28" }
        ];

        const DEFAULT_ANNOUNCEMENTS = [
            { title: "Welcome to SBPebbles Music Hub", description: "Explore the latest music, projects, announcements, and artist links in one place.",
                cover: "https://i.imgur.com/2UMG2Pg.jpeg", full: "Welcome to the SBPebbles Music Hub. This page brings the music catalog, updates, projects, and artist destinations together.",
                date: "2026-01-01", tags: ["SBPebbles", "Music"], links: [] },
            { title: "Lost You", description: "Listen to Lost You by Kam Pebbles.",
                cover: "https://i.imgur.com/2UMG2Pg.jpeg", full: "Lost You is available in the built-in player and playlist.",
                date: "2026-01-01", tags: ["Music", "Single"], links: [] },
            { title: "Blue-Raz Lemonade", description: "Listen to Blue-Raz Lemonade by Kam Pebbles.",
                cover: "https://i.imgur.com/RnwJuvu.jpeg", full: "Blue-Raz Lemonade is available in the built-in player and playlist.",
                date: "2026-01-01", tags: ["Music", "Single"], links: [] },
            { title: "Grape Smarties", description: "Listen to Grape Smarties by Kam Pebbles.",
                cover: "https://i.imgur.com/aTWPtqq.jpeg", full: "Grape Smarties is available in the built-in player and playlist.",
                date: "2026-01-01", tags: ["Music", "Single"], links: [] },
            { title: "Miss You", description: "Listen to Miss You by Kam Pebbles.",
                cover: "https://i.imgur.com/XqGkllR.jpeg", full: "Miss You is available in the built-in player and playlist.",
                date: "2026-01-01", tags: ["Music", "Single"], links: [] },
            { title: "219_EARLY_PREVIEW_MIXED", description: "An early preview mix from Kam Pebbles.",
                cover: "https://i.imgur.com/ycLlohS.png", full: "This early preview mix is available in the built-in player.",
                date: "2026-01-01", tags: ["Preview", "Music"], links: [] },
            { title: "225_EARLY_PREVIEW_MIXED", description: "An early preview mix from Kam Pebbles.",
                cover: "https://i.imgur.com/ycLlohS.png", full: "This early preview mix is available in the built-in player.",
                date: "2026-01-01", tags: ["Preview", "Music"], links: [] },
            { title: "How It Feels To Be Me", description: "Listen to How It Feels To Be Me by Kam Pebbles.",
                cover: "https://i.imgur.com/fd1kRok.png", full: "How It Feels To Be Me is available in the built-in player and playlist.",
                date: "2026-01-01", tags: ["Music", "Single"], links: [] },
            { title: "Mint Coffee & Elevator Music", description: "Listen to Mint Coffee & Elevator Music by Kam Pebbles.",
                cover: "https://i.imgur.com/tpa8nWN.png", full: "Mint Coffee & Elevator Music is available in the built-in player and playlist.",
                date: "2026-01-01", tags: ["Music", "Single"], links: [] }
        ];

        const DEFAULT_OTHER = [
            { title: "Music", image: "https://i.imgur.com/2UMG2Pg.jpeg", description: "Music by Kam Pebbles." },
            { title: "Projects", image: "https://via.placeholder.com/900x900.png?text=SBPebbles",
                description: "Creative projects and experiments." },
            { title: "More Coming Soon", image: "https://via.placeholder.com/900x900.png?text=Coming+Soon",
                description: "More SBPebbles projects will appear here." }
        ];

        const $ = s => document.querySelector(s);
        const $$ = s => [...document.querySelectorAll(s)];
        const audio = $("#audio");
        const tracks = DEFAULT_TRACKS;
        let index = 0;
        let dragging = false;
        let muted = false;
        let lastVolume = .8;

        const slug = s => s.toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
        const fmt = t => { if (!Number.isFinite(t)) return "0:00"; return `${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,"0")}` };

        function esc(s) {
            return String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
        }

        function renderPlaylist() {
            $("#playlist").innerHTML = tracks.map((t, i) => {
                const isActive = i === index;
                const isPlaying = isActive && !audio.paused;
                return `<button class="playlist-item ${isActive ? "active" : ""}" data-index="${i}">
                    <span class="idx">${String(i+1).padStart(2,"0")}</span>
                    <span><span class="p-title">${esc(t.title)}</span><br><span class="p-artist">${esc(t.artist)}</span></span>
                    <span class="duration">${t.duration}</span>
                    <span class="playmark"><i class="fas ${isPlaying ? "fa-volume-up" : "fa-play"}"></i></span>
                </button>`;
            }).join("");
            $$(".playlist-item").forEach(b => b.addEventListener("click", () => loadTrack(+b.dataset.index, true)));
        }

        function updatePlaylistUI() {
            $$(".playlist-item").forEach(b => {
                const i = +b.dataset.index;
                const isActive = i === index;
                const isPlaying = isActive && !audio.paused;
                b.classList.toggle("active", isActive);
                const icon = b.querySelector(".playmark i");
                if (icon) icon.className = `fas ${isPlaying ? "fa-volume-up" : "fa-play"}`;
            });
        }

        function loadTrack(i, autoplay = false) {
            index = (i + tracks.length) % tracks.length;
            const t = tracks[index];
            audio.src = t.src;
            audio.load();
            $("#trackTitle").textContent = t.title;
            $("#artist").textContent = t.artist;
            $("#npTitle").textContent = t.title;
            const img = $("#cover");
            img.src = t.cover;
            img.alt = t.title;
            img.classList.remove("fallback");
            img.style.display = "block";
            img.nextElementSibling.style.display = "none";
            img.onerror = () => {
                img.style.display = "none";
                img.classList.add("fallback");
                img.nextElementSibling.style.display = "grid";
            };
            img.onload = () => {
                img.style.display = "block";
                img.classList.remove("fallback");
                img.nextElementSibling.style.display = "none";
            };
            history.replaceState(null, "", "#" + slug(t.title));
            renderPlaylist();
            updateState();
            $("#currentTime").textContent = "0:00";
            $("#progressFill").style.width = "0%";
            $("#duration").textContent = t.duration;
            if (autoplay) audio.play().catch(() => {});
        }

        function updateState() {
            const playing = !audio.paused && !audio.ended;
            $("#coverWrap").classList.toggle("playing", playing);
            $("#nowPlaying").classList.toggle("playing", playing);
            $("#play").innerHTML = `<i class="fas fa-${playing ? "pause" : "play"}"></i>`;
            $("#play").setAttribute("aria-label", playing ? "Pause" : "Play");
            updatePlaylistUI();
        }

        $("#play").onclick = () => audio.paused ? audio.play() : audio.pause();
        $("#prev").onclick = () => loadTrack(index - 1, true);
        $("#next").onclick = () => loadTrack(index + 1, true);
        audio.addEventListener("play", updateState);
        audio.addEventListener("pause", updateState);
        audio.addEventListener("ended", () => loadTrack(index + 1, true));
        audio.addEventListener("timeupdate", () => {
            const p = audio.duration ? audio.currentTime / audio.duration : 0;
            $("#progressFill").style.width = p * 100 + "%";
            $("#currentTime").textContent = fmt(audio.currentTime);
        });
        audio.addEventListener("loadedmetadata", () => $("#duration").textContent = fmt(audio.duration));

        function seek(e) {
            const r = $("#progress").getBoundingClientRect();
            audio.currentTime = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * audio.duration;
        }
        $("#progress").addEventListener("pointerdown", e => {
            dragging = true;
            $("#progress").setPointerCapture(e.pointerId);
            seek(e);
        });
        $("#progress").addEventListener("pointermove", e => dragging && seek(e));
        $("#progress").addEventListener("pointerup", () => dragging = false);

        $("#volume").oninput = e => {
            lastVolume = +e.target.value;
            audio.volume = lastVolume;
            muted = lastVolume === 0;
            updateMuteIcon();
        };
        $("#mute").onclick = () => {
            if (muted || audio.volume === 0) {
                audio.volume = lastVolume || .8;
                $("#volume").value = audio.volume;
                muted = false;
            } else {
                lastVolume = audio.volume;
                audio.volume = 0;
                $("#volume").value = 0;
                muted = true;
            }
            updateMuteIcon();
        };
        function updateMuteIcon() {
            const vol = audio.volume;
            const icon = muted || vol === 0 ? "fa-volume-mute" : vol < .5 ? "fa-volume-down" : "fa-volume-up";
            $("#mute").innerHTML = `<i class="fas ${icon}"></i>`;
        }
        $("#copy").onclick = async () => {
            try {
                await navigator.clipboard.writeText(location.href);
                $("#copy").innerHTML = '<i class="fas fa-check"></i>';
                setTimeout(() => $("#copy").innerHTML = '<i class="fas fa-link"></i>', 1200);
            } catch {}
        };
        document.addEventListener("keydown", e => {
            if (["INPUT", "TEXTAREA", "BUTTON"].includes(document.activeElement.tagName)) return;
            if (e.code === "Space") { e.preventDefault(); audio.paused ? audio.play() : audio.pause(); }
            if (e.key === "ArrowRight") loadTrack(index + 1, true);
            if (e.key === "ArrowLeft") loadTrack(index - 1, true);
            if (e.key.toLowerCase() === "m") $("#mute").click();
        });

        function renderNews() {
            $("#newsBadge").textContent = DEFAULT_ANNOUNCEMENTS.length;
            $("#newsCount").textContent = `${DEFAULT_ANNOUNCEMENTS.length} updates`;
            $("#newsList").innerHTML = DEFAULT_ANNOUNCEMENTS.map((n, i) => {
                const isNew = i < 1;
                return `<article class="news-card" style="animation-delay:${i*.045}s">
                    <div class="news-summary">
                        <img src="${n.cover}" alt="" onerror="this.style.visibility='hidden'">
                        <div>
                            <div class="news-title">${esc(n.title)} ${isNew ? '<span class="new-badge">New</span>' : ''}</div>
                            <p class="news-desc">${esc(n.description)}</p>
                        </div>
                        <i class="fas fa-chevron-right chevron"></i>
                    </div>
                    <div class="news-details">
                        <p>${esc(n.full)}</p>
                        <div class="muted">Release date: ${esc(n.date)}</div>
                        <div class="tags">${(n.tags||[]).map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div>
                        <div class="news-links">${(n.links||[]).map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label||l.url)}</a>`).join("")}</div>
                    </div>
                </article>`;
            }).join("");
            $$(".news-summary").forEach(x => x.addEventListener("click", () => x.parentElement.classList.toggle("open")));
        }

        function renderOther() {
            $("#otherGrid").innerHTML = DEFAULT_OTHER.map((o, i) => {
                return `<article class="other-item" data-other="${i}">
                    <button class="other-close" aria-label="Close"><i class="fas fa-times"></i></button>
                    <img src="${o.image}" alt="${esc(o.title)}">
                    <div class="other-overlay"><strong>${esc(o.title)}</strong><div>${esc(o.description)}</div></div>
                </article>`;
            }).join("");
            $$(".other-item").forEach(item => item.addEventListener("click", e => {
                if (e.target.closest(".other-close")) return;
                expandOther(item);
            }));
            $$(".other-close").forEach(b => b.addEventListener("click", e => {
                e.stopPropagation();
                collapseOther();
            }));
        }

        function expandOther(item) {
            $$(".other-item.expanded").forEach(x => x.classList.remove("expanded"));
            item.classList.add("expanded");
            $("#backdrop").classList.add("show");
        }

        function collapseOther() {
            $(".other-item.expanded")?.classList.remove("expanded");
            $("#backdrop").classList.remove("show");
        }
        $("#backdrop").onclick = collapseOther;
        document.addEventListener("keydown", e => e.key === "Escape" && collapseOther());
        window.addEventListener("scroll", () => collapseOther(), { passive: true });

        $$(".tab").forEach(tab => tab.onclick = () => {
            $$(".tab").forEach(t => t.classList.remove("active"));
            tab.classList.add("active");
            $$(".panel").forEach(p => p.classList.remove("active"));
            $("#" + tab.dataset.panel).classList.add("active");
            window.scrollTo({ top: 0, behavior: "smooth" });
        });

        const themeColors = {
            red: "#ff5252",
            orange: "#ff9100",
            yellow: "#ffd600",
            green: "#69f0ae",
            blue: "#40c4ff",
            indigo: "#7c4dff",
            violet: "#d7baff"
        };
        const themes = Object.keys(themeColors);
        themes.forEach(t => {
            const b = document.createElement("button");
            b.className = "theme-dot";
            b.title = t;
            b.dataset.theme = t;
            b.style.background = themeColors[t];
            b.onclick = () => setTheme(t);
            $("#themePicker").appendChild(b);
        });

        function setTheme(t) {
            document.documentElement.dataset.theme = t;
            localStorage.setItem("sbpebbles-theme", t);
            $$(".theme-dot").forEach(b => b.classList.toggle("selected", b.dataset.theme === t));
            document.querySelector('meta[name="theme-color"]')?.setAttribute("content", themeColors[t]);
        }

        // default to red if no saved theme, or fallback to first rainbow color
        const savedTheme = localStorage.getItem("sbpebbles-theme");
        setTheme(themes.includes(savedTheme) ? savedTheme : themes[0]);

        renderNews();
        renderOther();
        const wanted = location.hash.slice(1);
        const found = tracks.findIndex(t => slug(t.title) === wanted);
        loadTrack(found >= 0 ? found : 0, false);
        audio.volume = .8;
        updateMuteIcon();
    </script>
</body>
</html>
